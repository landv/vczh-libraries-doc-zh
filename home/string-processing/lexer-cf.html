<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Gaclib -- 主页 -- 词法分析器</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/article.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/navigation.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/category.css" />
<script src="/vczh-libraries-doc-zh/scripts/rootView.js"></script>
<script src="/vczh-libraries-doc-zh/scripts/homeView.js"></script>
<script src="/vczh-libraries-doc-zh/scripts/homeCategoryArticleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "string-processing",
    "lexer-cf"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-HomeView"
  },
  {
    "targetObject": "homeViewContainer",
    "viewName": "Gaclib-HomeCategoryArticleView"
  }
];
  const activeButton = "Home";
  const activeCategory = "String";
  const homeArticle = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "欢迎使用 Gaclib！",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Gaclib 是一个 GPU 加速的 C++ 用户界面库。\n            它灵活且高度可定制，内置了大量布局与控件，\n            并支持控件模板、列表项模板、MVVM、本地化、动画等特性。\n            更重要的是，即使界面非常复杂，在交互时依然拥有良好的性能。\n            你可以在这里找到它："
          },
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/Release",
            "content": [
              {
                "kind": "Text",
                "text": "github"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "。\n            本库提供了许多实用的功能。\n            如果你不需要全部特性，\n            可以只使用发布版 C++ 文件中的一部分，以减小可执行文件的体积。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Image",
            "src": "/resources/home/xml_HelloWorld.png"
          }
        ]
      }
    ]
  }
};
  const categoryArticle = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "词法分析器",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            通过使用正则表达式定义每个记号，可以轻松构建一个词法分析器。\n            如果记号数量太多，\n            与其把它们全部复制到列表中，\n            不如逐个读取它们以节省内存。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            上下文相关的着色也是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RegexLexer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 提供的一个非常强大的功能。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "List<WString> codes;\ncodes.Add(L\"/d+\");\ncodes.Add(L\"/s+\");\ncodes.Add(L\"[a-zA-Z_]/w*\");\nRegexLexer lexer(codes, {});\n\nList<RegexToken> tokens;\nCopyFrom(tokens, lexer.Parse(L\"Here is 100 books\"));",
            "language": "C++"
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.activeButton"] = activeButton;
  window["MVC-Resources.activeCategory"] = activeCategory;
  window["MVC-Resources.homeArticle"] = homeArticle;
  window["MVC-Resources.categoryArticle"] = categoryArticle;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
