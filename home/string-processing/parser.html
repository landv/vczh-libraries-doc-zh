<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" type="text/css" href="/global.css" />
<link rel="stylesheet" type="text/css" href="/article.css" />
<link rel="stylesheet" type="text/css" href="/navigation.css" />
<link rel="stylesheet" type="text/css" href="/category.css" />
<script src="/scripts/rootView.js"></script>
<script src="/scripts/homeView.js"></script>
<script src="/scripts/homeCategoryArticleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "string-processing",
    "parser"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-HomeView"
  },
  {
    "targetObject": "homeViewContainer",
    "viewName": "Gaclib-HomeCategoryArticleView"
  }
];
  const activeButton = "Home";
  const activeCategory = "String";
  const homeArticle = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "欢迎使用 Gaclib！",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Gaclib 是一个 GPU 加速的 C++ 用户界面库。\n            它灵活且高度可定制，内置了大量布局与控件，\n            并支持控件模板、列表项模板、MVVM、本地化、动画等特性。\n            更重要的是，即使界面非常复杂，在交互时依然拥有良好的性能。\n            你可以在这里找到它："
          },
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/Release",
            "content": [
              {
                "kind": "Text",
                "text": "github"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "。\n            本库提供了许多实用的功能。\n            如果你不需要全部特性，\n            可以只使用发布版 C++ 文件中的一部分，以减小可执行文件的体积。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Image",
            "src": "/resources/home/xml_HelloWorld.png"
          }
        ]
      }
    ]
  }
};
  const categoryArticle = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "GLR 语法分析器生成",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "文法：面向数字、二元运算符与函数调用的表达式语法分析器"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "include:<VlppParser.h>\nnamespace:calculator\nreflection:calculator\nclassPrefix:Cal\nclassRoot:Expression\nguard:CALCULATOR_PARSER\nparser:Parse(Exp)\nfilePrefix:Calculator\nfile:Ast(_Ast)\nfile:Parser(_Parser)\nambiguity:disabled\nserialization:enabled\ngrammar:\n\nclass Expression\n{\n}\n\nclass NumberExpression : Expression\n{\n    token value;\n}\n\nclass BinaryExpression : Expression\n{\n    enum BinaryOperator\n    {\n        Add,\n        Sub,\n        Mul,\n        Div,\n    }\n\n    Expression firstOperand;\n    Expression secondOperand;\n    BinaryOperator binaryOperator;\n}\n\nclass FunctionExpression : Expression\n{\n    token functionName;\n    Expression[] arguments;\n}\n\ntoken NAME = \"[a-zA-Z_]/w*\";\ntoken NUMBER = \"/d+(./d+)?\";\ntoken ADD = \"/+\";\ntoken SUB = \"-\";\ntoken MUL = \"/*\";\ntoken DIV = \"//\";\ntoken LEFT = \"/(\";\ntoken RIGHT = \"/)\";\ntoken COMMA = \",\";\ndiscardtoken SPACE = \"/s+\";\n\nrule NumberExpression Number\n        = NUMBER : value as NumberExpression\n        ;\nrule FunctionExpression Call\n        = NAME : functionName \"(\" [ Exp : arguments { \",\" Exp : arguments } ] \")\" as FunctionExpression\n        ;\nrule Expression Factor\n        = !Number | !Call\n        = \"(\" !Exp \")\"\n        ;\nrule Expression Term\n        = !Factor\n        = Term : firstOperand \"*\" Factor : secondOperand as BinaryExpression with { binaryOperator = \"Mul\" }\n        = Term : firstOperand \"/\" Factor : secondOperand as BinaryExpression with { binaryOperator = \"Div\" }\n        ;\nrule Expression Exp\n        = !Term\n        = Exp : firstOperand \"+\" Term : secondOperand as BinaryExpression with { binaryOperator = \"Add\" }\n        = Exp : firstOperand \"-\" Term : secondOperand as BinaryExpression with { binaryOperator = \"Sub\" }\n        ;",
            "language": "C++"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这就是你从生成的 C++ 代码中得到的成果。\n            GLR 语法分析器生成器还会为每种根 AST 类型生成访问器。\n            此外还提供带有样板代码的各种 AST 访问器。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "auto table = CalLoadTable();\nPtr<CalExpression> expr = CalParse(L\"max(1, 2) * 3 - 4\", table);",
            "language": "C++"
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.activeButton"] = activeButton;
  window["MVC-Resources.activeCategory"] = activeCategory;
  window["MVC-Resources.homeArticle"] = homeArticle;
  window["MVC-Resources.categoryArticle"] = categoryArticle;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
