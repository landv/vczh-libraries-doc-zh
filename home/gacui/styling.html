<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Gaclib -- 主页 -- 样式</title>
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/global.css" />
<link rel="stylesheet" type="text/css" href="/article.css" />
<link rel="stylesheet" type="text/css" href="/navigation.css" />
<link rel="stylesheet" type="text/css" href="/category.css" />
<script src="/scripts/rootView.js"></script>
<script src="/scripts/homeView.js"></script>
<script src="/scripts/homeCategoryArticleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "gacui",
    "styling"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-HomeView"
  },
  {
    "targetObject": "homeViewContainer",
    "viewName": "Gaclib-HomeCategoryArticleView"
  }
];
  const activeButton = "Home";
  const activeCategory = "GacUI";
  const homeArticle = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "欢迎使用 Gaclib！",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Gaclib 是一个 GPU 加速的 C++ 用户界面库。\n            它灵活且高度可定制，内置了大量布局与控件，\n            并支持控件模板、列表项模板、MVVM、本地化、动画等特性。\n            更重要的是，即使界面非常复杂，在交互时依然拥有良好的性能。\n            你可以在这里找到它："
          },
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/Release",
            "content": [
              {
                "kind": "Text",
                "text": "github"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "。\n            本库提供了许多实用的功能。\n            如果你不需要全部特性，\n            可以只使用发布版 C++ 文件中的一部分，以减小可执行文件的体积。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Image",
            "src": "/resources/home/xml_HelloWorld.png"
          }
        ]
      }
    ]
  }
};
  const categoryArticle = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "样式",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "样式：按选择器设置属性",
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "<Styles>\n    <Style ref.Path=\"//Cell/Button\" Font=\"fontFamily:'Segoe UI' size: 24 antialias:true\">\n        <att.BoundsComposition-set AlignmentToParent=\"left:0 top:0 right:0 bottom:0\"/>\n    </Style>\n</Styles>",
            "language": "Xml"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "UI：在多个控件上应用样式",
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "<Instance ref.Class=\"helloworld::MainWindow\">\n    <Window Text=\"Hello, world!\">\n        <Table CellPadding=\"5\" AlignmentToParent=\"left:0 top:0 right:0 bottom:0\">\n            <att.Rows>\n                <CellOption>composeType:Percentage percentage:1.0</CellOption>\n                <CellOption>composeType:MinSize</CellOption>\n            </att.Rows>\n            <att.Columns>\n                <CellOption>composeType:Percentage percentage:1.0</CellOption>\n                <CellOption>composeType:MinSize</CellOption>\n                <CellOption>composeType:MinSize</CellOption>\n            </att.Columns>\n\n            <Cell Site=\"row:1 column:1 columnSpan:2\">\n                <Button Text=\"OK\"/>\n            </Cell>\n\n            <Cell Site=\"row:1 column:2 columnSpan:2\">\n                <Button Text=\"Cancel\"/>\n            </Cell>\n        </Table>\n    </Window>\n</Instance>",
            "language": "Xml"
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.activeButton"] = activeButton;
  window["MVC-Resources.activeCategory"] = activeCategory;
  window["MVC-Resources.homeArticle"] = homeArticle;
  window["MVC-Resources.categoryArticle"] = categoryArticle;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
