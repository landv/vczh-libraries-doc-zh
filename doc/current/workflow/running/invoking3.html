  const article = {
  "index": false,

    "title": "继承 C++ 类",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            涉及的文件：\n            "

            "items": [
              {

      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            工作流类允许从可反射的 C++ 类继承。\n            这里我们有一个 C++ 类，包含两个属性：\n            "
          },
          {
            "kind": "Program",
            "code": "namespace myapi\n{\n    class App : public Object, public AggregatableDescription<App>\n    {\n    private:\n        WString name;\n        List<Ptr<IValueSubscription>> subscriptions;\n\n    public:\n        static WString Get();\n        static WString Get(const WString& message);\n        static void Print(const WString& text);\n\n        App() = default;\n        ~App()\n        {\n            FOREACH(Ptr<IValueSubscription>, sub, subscriptions)\n            {\n                sub->Close();\n            }\n            FinalizeAggregation();\n        }\n\n        Event<void()> NameChanged;\n        WString GetName();\n        void SetName(const WString& value);\n        List<Ptr<IValueSubscription>>& GetSubscriptions();\n    };\n}"
          },
          {
            "kind": "Text",
            "text": "\n            析构函数代码很重要，因此不会被隐藏。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个可继承的类需要使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "AggregatableDescription"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 而不是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Description"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "FinalizeAggregation"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 也很重要。\n            如果此函数在销毁继承自 App 的 Workflow 类时未被调用，\n            它会按设计崩溃。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            继承一个可反射的 C++ 类非常直接，\n            但在此版本的Workflow脚本中，类中没有虚方法，\n            因此，您无法重写可反射 C++ 类中的虚方法。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "module sampleModule;\nusing myapi::*;\n\nnamespace myscript\n{\n    class MyApp : App\n    {\n        new(name: string)\n        {\n            Name = name;\n            /* \"this\" is not allowed in binding, copy it to a variable */\n            var self = this;\n            var subscription = bind($\"Hello, $(self.Name)\");\n            attach(subscription.ValueChanged,\n                func (value: object): void\n                {\n                    Print(cast string value);\n                });\n            subscription.Open();\n            Subscriptions.Add(subscription);\n        }\n\n        delete\n        {\n            Print(\"Destructing myscript::MyApp\");\n        }\n    }\n}"
          },
          {
            "kind": "Text",
            "text": "\n            允许在工作流类中使用构造函数和析构函数。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这里不会详细解释数据绑定，\n            基本上代码正在跟踪 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$\"Hello, $(self.Name)\""
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            When "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 属性已更改，\n            显然，该表达式的结果也发生了改变。\n            当数据绑定被更改时， "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ValueChanged"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 将被调用。\n            这里将格式化的字符串打印到控制台窗口。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在加载程序集时，Workflow 脚本中定义的所有类和接口都将被注册。\n            这就是为什么您不能加载两次，\n            因为类型之间存在冲突。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当一个可反射类被加载时，\n            无论它是用工作流还是C++实现的\n            调用方式不会改变。\n            但是因为它继承自 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "App"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            获取实例要容易得多 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "App"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Program",
            "code": "auto myapp = UnboxValue<Ptr<App>>(Value::Create(\n    L\"myscript::MyApp\",\n    (\n        Value_xs(), WString(L\"vczh\")\n    )));\n\nmyapp->SetName(L\"Vczh Libraries++\");\nmyapp->SetName(L\"Workflow\");\nmyapp->SetName(L\"Gaclib\");"
          },
          {
            "kind": "Text",
            "text": "\n            此代码创建 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "myscript::MyApp"
              }

              }
            ]

          }
        ]
      }
    ]
  }
