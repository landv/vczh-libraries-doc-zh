  const article = {

      {

          {

          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个典型的工作流脚本需要使用基本类型和一个非常简单的预定义工作流库。\n            编译和运行工作流脚本都需要上述类型的类型信息。\n            为了加载这些类型，\n            需要调用两个函数：\n            "
          },
          {
            "kind": "Program",
            "code": "LoadPredefinedTypes();\nWfLoadLibraryTypes();\nGetGlobalTypeManager()->Load();"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            现在，我们开始运行此工作流脚本：\n            "
          },

            "kind": "Program",
            "code": "module sampleModule;\n\nfunc main(): string\n{\n    return \"Hello, world!\";\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "WfLoadTable"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数为解析工作流脚本创建解析表。\n            加载此表需要时间，当调试宿主 C++ 应用程序时需要几秒钟。\n            因此建议缓存该表。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            首先我们需要编译代码并获取程序集：\n            "
          },
          {
            "kind": "Program",
            "code": "List<WString> codes;\ncodes.Add(WString(ScriptCode, false))\n\nList<Ptr<ParsingError>> errors;\nauto table = WfLoadTable();\nauto assembly = Compile(table, codes, errors);"
          },
          {
            "kind": "Text",
            "text": "\n            如果编译失败，你将得到一个空程序集，\n            以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "errors"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 变量存储脚本中发现的所有错误。\n            注意编译器会在第一个语法错误处停止\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            其次，我们需要创建用于执行脚本的运行时环境：\n            "
          },
          {
            "kind": "Program",
            "code": "auto globalContext = Ptr(new WfRuntimeGlobalContext(assembly));\nauto initializeFunction = LoadFunction<void()>(globalContext, L\"<initialize>\");\ninitializeFunction();"
          },
          {
            "kind": "Text",
            "text": "\n            仅一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "WfRuntimeGlobalContext"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 允许为每个程序集创建\n            在大多数情况下，您无法从文件中两次加载程序集以获取两个程序集和两个独立执行环境的上下文。\n            因为工作流脚本可以创建类和接口，\n            它们也将被注册到全局类型管理器中，就像C++反射一样。\n            重复加载它们会导致错误。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            下一步是初始化全局变量。\n            在工作流脚本中，全局变量应使用默认值进行初始化，\n            但通过加载程序集，这些变量不会被初始化。\n            因此您始终需要运行导出的函数 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<initialize>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 去做它。\n        "
          }
        ]

              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },

            "kind": "Text",
            "text": " 函数以获取结果：\n            "
          },

            "kind": "Program",
            "code": "auto mainFunction = LoadFunction<WString()>(globalContext, L\"main\");\nConsole::WriteLine(mainFunction());"
          },

            "kind": "Text",
            "text": "\n            与C++不同，工作流脚本不需要具有一个 "
          },

              {
                "kind": "Text",

            ]
          },
          {

          }
        ]
