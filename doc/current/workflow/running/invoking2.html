  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "继承 C++ 接口",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            涉及的文件：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/blob/master/Tutorial/Console_Workflow/W03_InheritingCppInterfaces/Main.cpp",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Main.cpp"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            You are able to implement a reflectable C++ interface in Workflow using anonymous interface expression.\n            You are able to write classes in Workflow script, but classes are not allowed to implement interfaces.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            For example, we can define this C++ interface, and make it reflectable:\n            "
          },
          {
            "kind": "Program",
            "code": "class IScripting : public virtual IDescriptable, public Description<IScripting>\n{\npublic:\n    virtual void Execute(const WString& name) = 0;\n};"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            By inheriting from "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IDescriptable"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Description"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ",\n            instances of this interface are accessible in Workflow scripts.\n            But in order to make Workflow scripts being able to implement this interface,\n            more things need to be done:\n            "
          },
          {
            "kind": "Program",
            "code": "namespace vl::reflection::description\n{\n    BEGIN_INTERFACE_PROXY_SHAREDPTR(IScripting)\n        void Execute(const WString& name)override\n        {\n            INVOKE_INTERFACE_PROXY(Execute, name);\n        }\n    END_INTERFACE_PROXY(IScripting)\n}"
          },
          {
            "kind": "Text",
            "text": "\n            Unfortunately it looks boring,\n            but this version of reflection requires you to write such code to allow it to be implemented by Workflow script code.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Here we use "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "BEGIN_INTERFACE_PROXY_SHAREDPTR"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ",\n            because we want instances of this interface to be shared pointers.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Now, we are able to implement this interface in Workflow script:\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\nusing myapi::*;\n\nfunc main(): IScripting^\n{\n    return new IScripting^\n    {\n        override func Execute(name: string): void\n        {\n            App::Print($\"Hello, $(name)!\");\n        }\n    };\n}"
          },
          {
            "kind": "Text",
            "text": "\n            And call it in C++:\n            "
          },
          {
            "kind": "Program",
            "code": "auto mainFunction = LoadFunction<Ptr<myapi::IScripting>()>(globalContext, L\"main\");\nmainFunction()->Execute(L\"Gaclib\");"
          }
        ]
      }
    ]
  }
