  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "继承 C++ 接口",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            涉及的文件：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/blob/master/Tutorial/Console_Workflow/W03_InheritingCppInterfaces/Main.cpp",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Main.cpp"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            您能够在 Workflow 中使用匿名接口表达式实现可反射的 C++ 接口。\n            您能够在 Workflow 脚本中编写类，但类不允许实现接口。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            例如，我们可以定义这个 C++ 接口，并使其可反射：\n            "
          },
          {
            "kind": "Program",
            "code": "class IScripting : public virtual IDescriptable, public Description<IScripting>\n{\npublic:\n    virtual void Execute(const WString& name) = 0;\n};"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            通过从...继承 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IDescriptable"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Description"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            此接口的实例可在工作流脚本中访问。\n            但是为了使工作流脚本能够实现此接口，\n            需要完成更多事情：\n            "
          },
          {
            "kind": "Program",
            "code": "namespace vl::reflection::description\n{\n    BEGIN_INTERFACE_PROXY_SHAREDPTR(IScripting)\n        void Execute(const WString& name)override\n        {\n            INVOKE_INTERFACE_PROXY(Execute, name);\n        }\n    END_INTERFACE_PROXY(IScripting)\n}"
          },
          {
            "kind": "Text",
            "text": "\n            不幸的是，它看起来很无趣，\n            但此版本的反射要求您编写此类代码以允许Workflow脚本代码实现它。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在这里我们使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "BEGIN_INTERFACE_PROXY_SHAREDPTR"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            因为我们希望这个接口的实例是共享指针。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            现在，我们能够在工作流脚本中实现此接口：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\nusing myapi::*;\n\nfunc main(): IScripting^\n{\n    return new IScripting^\n    {\n        override func Execute(name: string): void\n        {\n            App::Print($\"Hello, $(name)!\");\n        }\n    };\n}"
          },
          {
            "kind": "Text",
            "text": "\n            并在C++中调用它：\n            "
          },
          {
            "kind": "Program",
            "code": "auto mainFunction = LoadFunction<Ptr<myapi::IScripting>()>(globalContext, L\"main\");\nmainFunction()->Execute(L\"Gaclib\");"
          }
        ]
      }
    ]
  }
};
