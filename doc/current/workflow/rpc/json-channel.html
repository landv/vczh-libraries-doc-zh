  const article = {

  "topic": {
    "kind": "Topic",
    "title": "JSON RPC 通道设置",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n\t\t\tJSON RPC 层将 RPC 对象语义与数据传输分离开。RpcJsonDispatcher、RpcJsonLifecycle、RpcJsonObjectOps 和 RpcJsonObjectEventOps 知道如何将 RPC 操作转换为 JSON 节点。IRpcJsonMessageDispatcher 是将这些 JSON 节点发送到另一个端点并接收返回的 JSON 节点的边界。\n\t\t"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n\t\t\t当将 JSON RPC 端点连接到传输时使用此页面。对于自定义传输，请实现 IRpcJsonMessageDispatcher。当 vl::inter_process 应提供传输时，请使用通道类。\n\t\t"
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "IRpcJsonMessageDispatcher 合约",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tIRpcJsonMessageDispatcher 有两个运行时职责：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AllocateRequestId 为从此端点发出的出站 JSON RPC 消息分配一个唯一的请求 ID。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "OnJsonRequest 根据 RequestType 发送一个 JSON 请求，并在需要响应时返回响应的 JSON 节点。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tRequestType 描述了路由行为：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "直接向目标客户端发送请求并等待匹配的响应。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "广播通过服务器端代理发送请求并等待代理响应。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BroadcastAndDrop 发送一个广播消息，该消息不会产生响应。服务声明使用此模式。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t当传输接收到针对本地端点的 JSON RPC 请求时，调用 IRpcJsonMessageDispatcher::DefaultTranslate，并传入本地对象操作、事件操作、分发器和生命周期。DefaultTranslate 调用本地 RPC 操作，并在请求需要响应时返回响应的 JSON 节点。\n\t\t\t"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t自定义传输通常遵循以下结构：\n\t\t\t\t"
              },
              {
                "kind": "Program",
                "code": "using namespace vl;\r\nusing namespace vl::glr::json;\r\nusing namespace vl::rpc_controller;\r\n\r\nclass MyJsonMessageDispatcher : public Object, public virtual IRpcJsonMessageDispatcher\r\n{\r\nprivate:\r\n\tatomic_vint nextRequestId = 0;\r\n\tIRpcObjectOps* objectOps = nullptr;\r\n\tIRpcObjectEventOps* objectEventOps = nullptr;\r\n\tIRpcDispatcher* rpcDispatcher = nullptr;\r\n\tIRpcLifecycle* lifecycle = nullptr;\r\n\r\npublic:\r\n\tvint AllocateRequestId() override\r\n\t{\r\n\t\treturn ++nextRequestId;\r\n\t}\r\n\r\n\tPtr<JsonNode> OnJsonRequest(Ptr<JsonNode> message, RequestType requestType) override\r\n\t{\r\n\t\tswitch (requestType)\r\n\t\t{\r\n\t\tcase RequestType::Direct:\r\n\t\t\treturn SendDirectAndWaitForResponse(message);\r\n\t\tcase RequestType::Broadcast:\r\n\t\t\treturn SendBroadcastAndWaitForResponse(message);\r\n\t\tcase RequestType::BroadcastAndDrop:\r\n\t\t\tSendBroadcastAndDrop(message);\r\n\t\t\treturn nullptr;\r\n\t\tdefault:\r\n\t\t\tCHECK_FAIL(L\"Unexpected JSON RPC request type.\");\r\n\t\t}\r\n\t}\r\n\r\n\tvoid OnIncomingJsonRequest(Ptr<JsonNode> message)\r\n\t{\r\n\t\tauto response = IRpcJsonMessageDispatcher::DefaultTranslate(\r\n\t\t\tmessage,\r\n\t\t\tClassifyIncomingRequest(message),\r\n\t\t\tobjectOps,\r\n\t\t\tobjectEventOps,\r\n\t\t\trpcDispatcher,\r\n\t\t\tlifecycle);\r\n\r\n\t\tif (response)\r\n\t\t{\r\n\t\t\tSendJsonResponse(response);\r\n\t\t}\r\n\t}\r\n};",
                "language": "C++"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t名为 SendDirectAndWaitForResponse、SendBroadcastAndWaitForResponse、SendBroadcastAndDrop、ClassifyIncomingRequest 和 SendJsonResponse 的函数是传输特定的。它们可能使用套接字、管道、HTTP、共享内存或另一种消息总线。RPC 层仅要求请求 ID 和响应路由保持一致。\n\t\t\t"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "默认 vl::inter_process 通道",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t默认实现位于命名空间 vl::rpc_controller::channeling 中。它在 vl::inter_process 通道之上实现了 IRpcJsonMessageDispatcher：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonPackage is Ptr<vl::glr::json::JsonNode>."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonChannel 是 vl::inter_process::IChannel<JsonPackage>。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonNetworkChannelClient 和 JsonNetworkChannelServer 将 JSON 包连接到 INetworkProtocol 传输。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonLocalChannelClient 将进程内端点连接到相同的通道服务器。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RpcJsonDispatcherClient 实现了 IRpcJsonMessageDispatcher 和 IChannelReader<JsonPackage> 接口，用于一个端点。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RpcJsonDispatcherServer 实现了 IChannelReader<JsonPackage> 接口，用于服务器端广播代理。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t通道服务器是一个代理。它必须有一个由 RpcJsonDispatcherServer 拥有的本地通道客户端。该本地客户端接收广播请求、服务声明和广播响应。普通客户端，无论是本地还是远程，在连接后都会向代理注册。\n\t\t\t"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "共享通道客户端粘合层",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tJSON 通道客户端必须声明至少一个通道名称。RPC 调度器只需要该名称对应的通道对象：\n\t\t\t\t"
              },
              {
                "kind": "Program",
                "code": "#include <VlppWorkflowLibrary.h>\r\n#include <VlppOS.Windows.h>\r\n#include <utility>\r\n\r\nusing namespace vl;\r\nusing namespace vl::collections;\r\nusing namespace vl::glr::json;\r\nusing namespace vl::inter_process;\r\nusing namespace vl::reflection;\r\nusing namespace vl::rpc_controller;\r\nusing namespace vl::rpc_controller::channeling;\r\n\r\nconstexpr const wchar_t* RpcChannelName = L\"WorkflowRpc\";\r\n\r\ntemplate<typename TBase>\r\nclass JsonRpcChannelClient : public TBase\r\n{\r\nprivate:\r\n\tJsonChannelClient::ChannelMap channelNames;\r\n\tJsonChannel* rpcChannel = nullptr;\r\n\r\nprotected:\r\n\tvoid InitializeRpcChannel()\r\n\t{\r\n\t\tchannelNames.Add(WString::Unmanaged(RpcChannelName), nullptr);\r\n\t\tauto&& channels = this->GetChannels();\r\n\t\tauto index = channels.Keys().IndexOf(WString::Unmanaged(RpcChannelName));\r\n\t\tCHECK_ERROR(index != -1, L\"Missing Workflow RPC channel.\");\r\n\t\trpcChannel = channels.Values()[index];\r\n\t}\r\n\r\npublic:\r\n\ttemplate<typename... TArgs>\r\n\tJsonRpcChannelClient(TArgs&&... args)\r\n\t\t: TBase(std::forward<TArgs>(args)...)\r\n\t{\r\n\t\tInitializeRpcChannel();\r\n\t}\r\n\r\n\tconst JsonChannelClient::ChannelNameList& OnGetChannelNames() override\r\n\t{\r\n\t\treturn channelNames.Keys();\r\n\t}\r\n\r\n\tJsonChannel* GetRpcChannel()\r\n\t{\r\n\t\tCHECK_ERROR(rpcChannel, L\"Missing Workflow RPC channel.\");\r\n\t\treturn rpcChannel;\r\n\t}\r\n};\r\n\r\nusing JsonRpcNetworkClient = JsonRpcChannelClient<JsonNetworkChannelClient>;\r\nusing JsonRpcLocalClient = JsonRpcChannelClient<JsonLocalChannelClient>;",
                "language": "C++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "端点分发器客户端",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tRpcJsonDispatcherClientForTaskQueue 已经通过 JsonChannel 发送 JSON 包实现了 IRpcJsonMessageDispatcher。一个项目仍然需要一个小的子类来创建 RpcJsonDispatcher 和 RpcJsonLifecycle，然后注册已加载模块的 RPC 元数据和辅助操作。\n\t\t\t"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t模块特定的注册由 ConfigureLifecycleForRpcModule 表示。它应为所使用的模块设置 ID 映射、序列化器、对象操作、事件操作、事件附加器和包装器工厂。\n\t\t\t\t"
              },
              {
                "kind": "Program",
                "code": "void ConfigureLifecycleForRpcModule(RpcJsonLifecycle* lifecycle);\r\n\r\nclass MyRpcDispatcherClient : public RpcJsonDispatcherClientForTaskQueue\r\n{\r\npublic:\r\n\tMyRpcDispatcherClient(Ptr<TaskQueue> taskQueue)\r\n\t\t: RpcJsonDispatcherClientForTaskQueue(taskQueue)\r\n\t{\r\n\t}\r\n\r\n\tvoid InitializeRpc(vint clientId)\r\n\t{\r\n\t\tauto rpcDispatcher = Ptr(new RpcJsonDispatcher(clientId, this));\r\n\t\tauto lifecycle = Ptr(new RpcJsonLifecycle(clientId, rpcDispatcher.Obj()));\r\n\r\n\t\tSetRpcObjects(rpcDispatcher, lifecycle);\r\n\t\tConfigureLifecycleForRpcModule(lifecycle.Obj());\r\n\t}\r\n};",
                "language": "C++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "服务器通道设置",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t服务器通道仅接受声明了RPC通道名称的客户端。在代理本地客户端连接后，每个接受的普通客户端都将注册到RpcJsonDispatcherServer中。\n\t\t\t\t入门回调接收 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr<JsonChannelClient>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对于本地客户端，以确保生产者的现有引用计数在回调期间保持有效；对于网络客户端，该值为 null。\n\t\t\t\t转发或存储该内容 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 直接，并使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": ".Obj()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 仅用于需要原始指针的操作。切勿创建另一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 从原始结果。\n\t\t\t\t"
              },
              {
                "kind": "Program",
                "code": "class JsonRpcChannelServer : public JsonNetworkChannelServer<named_pipe::NamedPipeServer>\r\n{\r\nprivate:\r\n\tRpcJsonDispatcherServer* dispatcher = nullptr;\r\n\r\npublic:\r\n\tJsonRpcChannelServer(Ptr<Parser> parser, const WString& pipeName)\r\n\t\t: JsonNetworkChannelServer<named_pipe::NamedPipeServer>(parser, pipeName)\r\n\t{\r\n\t}\r\n\r\n\tWaitForClientResult OnClientConnected(\r\n\t\tvint clientId,\r\n\t\tconst JsonChannelClient::ChannelNameList& availableChannels,\r\n\t\tPtr<JsonChannelClient> localClient) override\r\n\t{\r\n\t\tif (!availableChannels.Contains(WString::Unmanaged(RpcChannelName)))\r\n\t\t{\r\n\t\t\treturn WaitForClientResult::Reject;\r\n\t\t}\r\n\r\n\t\tif (localClient)\r\n\t\t{\r\n\t\t\treturn WaitForClientResult::Accept;\r\n\t\t}\r\n\r\n\t\tif (!dispatcher || !dispatcher->HasServerClientId())\r\n\t\t{\r\n\t\t\treturn WaitForClientResult::Reject;\r\n\t\t}\r\n\r\n\t\tdispatcher->RegisterClient(clientId);\r\n\t\treturn WaitForClientResult::Accept;\r\n\t}\r\n\r\n\tvoid OnClientDisconnected(vint clientId) override\r\n\t{\r\n\t\tif (dispatcher && dispatcher->HasServerClientId())\r\n\t\t{\r\n\t\t\tdispatcher->DisconnectClient(clientId);\r\n\t\t}\r\n\t}\r\n\r\n\tvoid SetDispatcher(RpcJsonDispatcherServer* value)\r\n\t{\r\n\t\tdispatcher = value;\r\n\t}\r\n};\r\n\r\nclass JsonRpcBroadcastingLocalClient : public JsonRpcLocalClient\r\n{\r\nprivate:\r\n\tPtr<RpcJsonDispatcherServerForTaskQueue> dispatcher;\r\n\r\npublic:\r\n\tJsonRpcBroadcastingLocalClient(Ptr<Parser> parser)\r\n\t\t: JsonRpcLocalClient(parser)\r\n\t{\r\n\t}\r\n\r\n\tvoid Connect(JsonChannelServer* channelServer, Ptr<JsonChannelClient> self, Ptr<TaskQueue> taskQueue)\r\n\t{\r\n\t\tauto clientId = channelServer->ConnectLocalClient(self);\r\n\t\tCHECK_ERROR(clientId != -1, L\"Failed to connect the RPC broker local client.\");\r\n\r\n\t\tdispatcher = Ptr(new RpcJsonDispatcherServerForTaskQueue(\r\n\t\t\tthis,\r\n\t\t\tGetRpcChannel(),\r\n\t\t\ttaskQueue));\r\n\t}\r\n\r\n\tRpcJsonDispatcherServer* GetDispatcher()\r\n\t{\r\n\t\tCHECK_ERROR(dispatcher, L\"The RPC broker local client is not connected.\");\r\n\t\treturn dispatcher.Obj();\r\n\t}\r\n};\r\n\r\nvoid StartRpcChannelServer(\r\n\tPtr<Parser> parser,\r\n\tPtr<TaskQueue> taskQueue,\r\n\tPtr<JsonRpcChannelServer>& channelServer,\r\n\tPtr<JsonRpcBroadcastingLocalClient>& brokerClient)\r\n{\r\n\tchannelServer = Ptr(new JsonRpcChannelServer(parser, L\"WorkflowRpcPipe\"));\r\n\tchannelServer->Start();\r\n\r\n\tbrokerClient = Ptr(new JsonRpcBroadcastingLocalClient(parser));\r\n\tbrokerClient->Connect(channelServer.Obj(), brokerClient, taskQueue);\r\n\tchannelServer->SetDispatcher(brokerClient->GetDispatcher());\r\n}",
                "language": "C++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "托管本地服务端点",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t一个进程可以通过连接到同一通道服务器的本地通道客户端托管服务。当拥有通道服务器的进程也拥有本地服务时，这很有用。\n\t\t\t\t"
              },
              {
                "kind": "Program",
                "code": "class JsonRpcServiceLocalClient : public JsonRpcLocalClient\r\n{\r\nprivate:\r\n\tPtr<MyRpcDispatcherClient> dispatcher;\r\n\r\npublic:\r\n\tJsonRpcServiceLocalClient(Ptr<Parser> parser)\r\n\t\t: JsonRpcLocalClient(parser)\r\n\t{\r\n\t}\r\n\r\n\tvoid OnConnected(vint clientId) override\r\n\t{\r\n\t\tCHECK_ERROR(dispatcher, L\"The RPC dispatcher client is missing.\");\r\n\t\tdispatcher->InitializeRpc(clientId);\r\n\t}\r\n\r\n\tvint Connect(\r\n\t\tJsonChannelServer* channelServer,\r\n\t\tPtr<JsonChannelClient> self,\r\n\t\tPtr<TaskQueue> taskQueue,\r\n\t\tvint serverClientId,\r\n\t\tconst List<WString>& waitingForServices)\r\n\t{\r\n\t\tdispatcher = Ptr(new MyRpcDispatcherClient(taskQueue));\r\n\t\tauto clientId = dispatcher->ConnectLocalServer(\r\n\t\t\tchannelServer,\r\n\t\t\tself,\r\n\t\t\tGetRpcChannel(),\r\n\t\t\twaitingForServices);\r\n\r\n\t\tdispatcher->SetServerLocalClientId(serverClientId);\r\n\t\treturn clientId;\r\n\t}\r\n\r\n\tMyRpcDispatcherClient* GetDispatcher()\r\n\t{\r\n\t\tCHECK_ERROR(dispatcher, L\"The RPC dispatcher client is not connected.\");\r\n\t\treturn dispatcher.Obj();\r\n\t}\r\n};\r\n\r\nvoid HostLocalService(\r\n\tJsonChannelServer* channelServer,\r\n\tRpcJsonDispatcherServer* broker,\r\n\tPtr<Parser> parser,\r\n\tPtr<TaskQueue> taskQueue,\r\n\tPtr<IDescriptable> service)\r\n{\r\n\tauto serviceClient = Ptr(new JsonRpcServiceLocalClient(parser));\r\n\tList<WString> waitingForServices;\r\n\tserviceClient->Connect(\r\n\t\tchannelServer,\r\n\t\tserviceClient,\r\n\t\ttaskQueue,\r\n\t\tbroker->GetServerClientId(),\r\n\t\twaitingForServices);\r\n\r\n\tauto rpcClient = serviceClient->GetDispatcher();\r\n\tauto lifecycle = rpcClient->GetRpcLifecycle();\r\n\tauto typeId = lifecycle->GetTypeIdFromName(L\"example::IExampleService\");\r\n\tCHECK_ERROR(typeId != RpcTypeId_NotFound, L\"Unknown RPC service type.\");\r\n\r\n\tlifecycle->RegisterLocalService(typeId, service);\r\n\trpcClient->Initialize();\r\n}",
                "language": "C++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "连接远程客户端",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t远程客户端使用JsonNetworkChannelClient通过原始传输（如 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::inter_process::named_pipe::NamedPipeClient"
                  }
                ]
              },
              {
