    "title": "Properties and Events (class)",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Properties and events are allowed in classes.\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "定义属性与事件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当属性 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 与事件关联 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NameChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                这里不会自动发生神奇的事情，\n                ……的实现 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 应触发 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NameChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " approppriately.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [

                "kind": "Text",

              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Auto-property is very useful to avoid boiler-plate code.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Auto-property must be initialized.\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Full-featured property",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "class WithProp\n{\n    prop Name: string = \"\" {}\n}"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    这意味着：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "class WithProp\n{\n    var name: string = \"\";\n\n    event NameChanged();\n\n    func GetName(): string\n    {\n        return name;\n    }\n\n    func SetName(value: string): void\n    {\n        if (name != value)\n        {\n            name = value;\n            NameChanged();\n        }\n    }\n\n    prop Name: string {GetName, SetName : NameChanged}\n}"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    请注意 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "名称"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 如果该变量由自动属性生成，则它不可访问。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Readonly property",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "class WithProp\n{\n    prop Name: string = \"\" {const}\n}"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    这意味着：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "class WithProp\n{\n    var name: string = \"\";\n\n    event NameChanged();\n\n    func GetName(): string\n    {\n        return name;\n    }\n\n    func SetName(value: string): void\n    {\n        if (name != value)\n        {\n            name = value;\n            NameChanged();\n        }\n    }\n\n    prop Name: string {GetName : NameChanged}\n}"

                  {
                    "kind": "Text",
                    "text": "\n                    请注意 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "名称"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 如果该变量由自动属性生成，则它不可访问。\n                "
                  }

                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    即使该属性是只读的，\n                    但 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 仍然会被生成，\n                    因为这是修改该属性的唯一方式。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " becomse "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "protected"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 在生成的 C++ 代码中，\n                    因此在该类之外调用此函数将导致错误的 C++ 代码。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",

                  },
                  {
                    "kind": "Text",
                    "text": "\n                    请注意 "

                  {
                    "kind": "Strong",

                      {
                        "kind": "Text",
                        "text": "名称"
                      }
                    ]

                  }
                ]

                  },

                    "kind": "Text",
                    "text": "\n                    请注意 "

                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "名称"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 如果该变量由自动属性生成，则它不可访问。\n                "
