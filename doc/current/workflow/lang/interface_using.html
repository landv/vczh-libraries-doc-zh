  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "泛型（接口）",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            接口实际上不支持泛型，\n            但有时它在中表现得像泛型 "
          },
          {
            "kind": "PageLink",
            "href": "/workflow/lang/coroutine.html",
            "content": [
              {
                "kind": "Text",
                "text": "协程"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这是一个由工作流创建的协程示例：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\n\nusing system::*;\n\ninterface Reader\n{\n}\n\n$interface IntReader: Reader<int?>;\n$interface StringReader: Reader<string?>;\n\nfunc Read(): Reader^\n{\n    return new Reader^{};\n}\n\nfunc ReadInt(): IntReader^\n{\n    return new IntReader^(using Read());\n}\n\nfunc ReadString(): StringReader^\n{\n    return new StringReader^(using Read());\n}\n\nclass ReaderCoroutine\n{\n    class Executor\n    {\n        var readObject: bool = false;\n        var source: Enumerable^ = {};\n        var enumerator: Enumerator^ = null;\n        var co: Coroutine^ = null;\n        var result: object = null;\n\n        func Continue(): bool\n        {\n            if (co.Status == CoroutineStatus::Stopped)\n            {\n                return false;\n            }\n\n            var cr = new CoroutineResult^();\n            if (co.Failure is not null)\n            {\n                cr.Failure = co.Failure;\n            }\n            else if (readObject and enumerator is not null)\n            {\n                if (enumerator.Next())\n                {\n                    cr.Result = enumerator.Current;\n                }\n            }\n            co.Resume(false, cr);\n            return true;\n        }\n    }\n\n    static func SetAndPause(impl: Executor*, numbers: Enumerable^): void\n    {\n        impl.source = numbers;\n        impl.enumerator = numbers.CreateEnumerator();\n        impl.readObject = false;\n    }\n\n    static func GetAndRead(impl: Executor*, reader: Reader^): void\n    {\n        impl.readObject = true;\n    }\n\n    static func ReturnAndExit(impl: Executor*, value: object): void\n    {\n        impl.result = value;\n    }\n\n    static func Create(creator: func(Executor*): (Coroutine^)): ReaderCoroutine::Executor^\n    {\n        var e = new Executor^();\n        e.co = creator(cast Executor* e);\n        return e;\n    }\n}\n\nfunc Sum(): ReaderCoroutine::Executor^\n$Reader{\n    $Set range [1, 10];\n    var sum = 0;\n    while (true)\n    {\n        var current = $Get ReadInt();\n        if (current is null)\n        {\n            break;\n        }\n        sum = sum + current;\n    }\n    return sum;\n}\n\nfunc main(): string\n{\n    var e = Sum();\n    while (e.Continue()) {}\n    return cast string e.result;\n}"
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Sum"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数执行：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$Set"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 设置一个数字集合。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$Read"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 逐个读取数字。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "返回所有数字的总和。"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数获取从 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Sum"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            驱动协程运行直到产生结果。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "$interface IDerived: IBase<TYPE>;",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在示例中，有：\n                "
              },
              {
                "kind": "Program",
                "code": "$interface IntReader: Reader<int?>;\n$interface StringReader: Reader<string?>;"
              },
              {
                "kind": "Text",
                "text": "\n                扩展为：\n                "
              },
              {
                "kind": "Program",
                "code": "interface IntReader : Reader\n{\n    static func CastResult(value : ::system::Object) : (int?)\n    {\n        return (cast (int?) value);\n    }\n\n    static func StoreResult(value : int?) : (::system::Object)\n    {\n        return value;\n    }\n}"
              },
              {
                "kind": "Text",
                "text": "\n                因此，例如：\n                "
              },
              {
                "kind": "Program",
                "code": "$interface StringReader: Reader<string?>;"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$interface"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 简单创建一个界面\n                继承自指定的那一个\n                并添加静态函数 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CastResult"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "StoreResult"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                用于在不同值之间进行强制转换， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "object"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 并且指定的泛型参数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$Get"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 知道返回值的类型。\n                显然在：\n                "
              },
              {
                "kind": "Program",
                "code": "var current = $Get ReadInt();"
              },
              {
                "kind": "Text",
                "text": "\n                类型 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "current"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "int?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                because "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReadInt"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IntReader^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                其中， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CastResult"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "int?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                原始接口的外观无关紧要。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "new TYPE^（使用 OBJECT）",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此表达式创建一个接口对象， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "TYPE"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                将所有方法重定向到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OBJECT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                它需要满足以下要求：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 并且类型为 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 两者都应为接口。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 必须与类型不同 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 必须从该类型继承 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". 它不必是直接的基类型。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 不能包含比类型更多的成员 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "new 类型*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也根据情况可用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "TYPE"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已声明。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如：\n                "
              },
              {
                "kind": "Program",
                "code": "interface Reader\n{\n    func Dummy(): void;\n}\n\n$interface IntReader: Reader<int?>;\n\nfunc ReadInt(): IntReader^\n{\n    return new IntReader^(using Read());\n}"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReadInt"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 展开为：\n                "
              },
              {
                "kind": "Program",
                "code": "func ReadInt() : (IntReader^)\n{\n    return new (IntReader^)\n    {\n        var source = Read();\n\n        override func Dummy() : (::system::Void)\n        {\n            source.Dummy();\n        }\n    };\n}"
              },
              {
                "kind": "Text",
                "text": "\n                很明显，\n                if "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OBJECT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是一个原始指针，\n                然后创建的对象持有一个原始指针 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OBJECT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                在这种情况下，你必须非常小心对象的生命周期。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
