  const directoryInfo = {

                    {

                      "path": [

                      ]
                    },
                    {
                      "icon": " ",
                      "name": "实现",
                      "selected": false,
                      "path": [
                        "workflow",

                      ]
                    },
                    {
                      "icon": " ",
                      "name": "泛型",
                      "selected": false,

                      ]

                  ]

              ]
            }
          ]
        }

};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "继承（接口）",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            An interface can inherit multiple interfaces.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            When IDerived inherits from IBase,\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "在 Workflow 脚本中，接口不能继承类（这在 C++ 中可能发生）。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "在 Workflow 脚本中，类不能继承接口（这在 C++ 中可能发生）。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 继承……的所有成员 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "If the same method signature appears in multiple base interfaces (including the derived one), they will have the same implementation in the new interface expression."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "An object must implement all members of "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " in order to implement "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "一个……类型的对象 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " can be implicitly converted to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "一个……类型的对象 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " can be explicitly converted to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", if the object doesn't implement "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", the conversion fails at runtime."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "你不能调用……的成员 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 对于一个……类型的对象 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", even if it implements "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Interfaces are not structural typing, even of an object has all required members, but if it doesn't explicitly declare that it implements an interface, it does not."
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "interface IBase\n{\n    func Say(): string;\n}\n\ninterface IDerived : IBase\n{\n    /* other members */\n}\n\nvar base = new IBase^\n{\n    override func Say(): string\n    {\n        return \"I implements IBase!\";\n    }\n};\n\nvar derived: IBase^ = new IDerived^\n{\n    override func Say(): string\n    {\n        return \"I implements IDerived!\";\n    }\n};"
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Types of "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "base"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "derived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " are "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase^"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ". If an explicit type does not given to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "derived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", it will be "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived^"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "base as IDerived^"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " returns "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "(cast IDerived^ base)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " throws and exception."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Both above conversion will succeed for "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "derived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
};

    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));

  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );

}
