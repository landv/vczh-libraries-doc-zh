  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "继承（接口）",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            接口可以继承多个接口。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当 IDerived 继承自 IBase 时，\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "在 Workflow 脚本中，接口不能继承类（这在 C++ 中可能发生）。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",

                  }
                ]
              },
              {
                "kind": "ContentListItem",

                      {
                        "kind": "Text",

                      }
                    ]
                  },
                  {

                    "text": " 继承……的所有成员 "

                      {

                        "text": "IBase"
                      }

                  {
                    "kind": "Text",
                    "text": "."

                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "如果同一方法签名在多个基接口（包括派生接口）中出现，它们在新的接口表达式中将具有相同的实现。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "一个对象必须实现所有成员， "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以便实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "一个……类型的对象 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IDerived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 可以隐式转换为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IBase"
                      }

                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]

                        "kind": "Text",
                        "text": "IBase"

                    "kind": "Text",
                    "text": " 可以显式转换为 "

                        "kind": "Text",
                        "text": "IDerived"

                        "kind": "Text",

                        "kind": "Text",

        "kind": "Paragraph",

            "kind": "Program",
            "code": "interface IBase\n{\n    func Say(): string;\n}\n\ninterface IDerived : IBase\n{\n    /* other members */\n}\n\nvar base = new IBase^\n{\n    override func Say(): string\n    {\n        return \"I implements IBase!\";\n    }\n};\n\nvar derived: IBase^ = new IDerived^\n{\n    override func Say(): string\n    {\n        return \"I implements IDerived!\";\n    }\n};"
          },

            "kind": "List",
            "ordered": false,
            "items": [

                    "kind": "Text",

                        "kind": "Text",

                    "kind": "Strong",

                      {

                      }

                    ]
                  },
                  {
                    "kind": "Text",

                  }

                        "kind": "Text",

                    "kind": "Text",

                    "kind": "Strong",

                      {
                        "kind": "Text",

                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]

                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",

                        "kind": "Text",
                        "text": "(cast IDerived^ base)"

                  }

                      {
                        "kind": "Text",

                      }

                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              }
            ]
          }
        ]
      }
