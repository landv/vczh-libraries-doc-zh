<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "workflow",
    "lang",
    "module"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "Workflow 脚本",
      "selected": false,
      "path": [
        "workflow",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "语法",
          "selected": false,
          "path": [
            "workflow",
            "lang"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "模块",
              "selected": true,
              "path": [
                "workflow",
                "lang",
                "module"
              ]
            },
            {
              "icon": " ",
              "name": "函数与变量",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "funcvar"
              ]
            },
            {
              "icon": "+",
              "name": "类型",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "type"
              ]
            },
            {
              "icon": "+",
              "name": "表达式",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "expr"
              ]
            },
            {
              "icon": " ",
              "name": "语句",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "stat"
              ]
            },
            {
              "icon": "+",
              "name": "数据绑定",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "bind"
              ]
            },
            {
              "icon": "+",
              "name": "协程",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "coroutine"
              ]
            },
            {
              "icon": "+",
              "name": "状态机",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "state"
              ]
            },
            {
              "icon": " ",
              "name": "关键字索引",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "index"
              ]
            },
            {
              "icon": " ",
              "name": "错误索引",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "error"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "模块",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            任何工作流脚本文件都应是一个模块，写成如下形式：\n            "
          },
          {
            "kind": "Program",
            "code": "module NAME;\n\nusing system::*;\nusing presentation::compositions::Gui*Composition;\n\n/* ... */"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            模块名称无关紧要，\n            但当向编译器提供多个文件以构建程序集时，\n            此程序集中的模块名称必须是唯一的。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "使用声明",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                A "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "using"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 声明导入此模块中的名称\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "using system::*;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 表示命名空间下的名称 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以直接使用。\n                例如，您可以使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::DateTime"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在一个模块中。\n                但到处写命名空间很烦人，\n                所以当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "使用系统::*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 出现在某个模块中，\n                你可以使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DateTime"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 直接。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通配符不需要是完整名称。\n                当你有 "
              },
              {
                "kind": "PageLink",
                "href": "/home/registered/gacui.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacUI 类型"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已加载，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "presentation::compositions::GuiTableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可用。\n                但这个名字太长了，\n                即使 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiTableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 太长了。\n                现在当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "使用 presentation::compositions::Gui*Composition;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 出现在某个模块中，\n                你可以使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Table"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对于该类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                因为当你用替换通配符时， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Table"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                它变成 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "presentation::compositions::GuiTableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                这正是该类型的完整名称。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                有时通配符可能会造成歧义，\n                例如，\n                "
              },
              {
                "kind": "Program",
                "code": "using presentation::compositions::Gui*Composition;\nusing presentation::controls::Gui*;\nusing presentation::templates::Gui*Template;"
              },
              {
                "kind": "Text",
                "text": "\n                当我们尝试使用时 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Window"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在此模块中，\n                编译器发现所有以下类型\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "presentation::compositions::GuiWindowComposition"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "presentation::controls::GuiWindow"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "presentation::templates::GuiWindowTemplate"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                存在，\n                它无法确定使用哪种类型，\n                因此会生成一个错误。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                为了解决此问题，\n                您可以直接使用完整名称。\n                or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " if "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "使用 presentation::controls::*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 出现在模块中，\n                或甚至 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "controls::GuiWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " if "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "使用 presentation::*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 出现在模块中。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "命名空间声明",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您可以像这样自己创建命名空间：\n                "
              },
              {
                "kind": "Program",
                "code": "module test;\nusing system::*;\n\nnamespace mynamespace\n{\n    namespace another\n    {\n        func MyFunc(): string\n        {\n            return \"Hello, world!\";\n        }\n    }\n}"
              },
              {
                "kind": "Text",
                "text": "\n                命名空间允许嵌套。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ":\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "using"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 声明不允许位于命名空间中\n                实际上，它们应该在其他声明之前声明，\n                在模块名称正下方。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "静态初始化",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                静态初始化是位于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "static {}"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 声明。\n                多个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "static {}"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 声明可以出现在模块或命名空间中。\n                它们内部的语句将在模块加载时执行。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当在运行时加载和执行工作流脚本时，\n                此类初始化发生在运行时 "
              },
              {
                "kind": "PageLink",
                "href": "/workflow/running/running.html",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<initialize>"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数，\n                在全局变量初始化之后。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                多个之间的执行顺序 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "static {}"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 声明未定义。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
