        "content": [

            "kind": "Text",

                "text": "接口 IThatInterface* { ... }"

              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            创建一个由原始指针持有的对象。\n            如果此类对象未被删除，会导致内存泄漏。\n        "

            "kind": "Text",
            "text": "\n            除了接口中的成员之外，\n            新的接口表达式还可以包含：\n            "

          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [

                    "kind": "Text",
                    "text": "变量"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "以不开头的函数 "

                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "override"
                      }
                    ]
                  }

              },
              {
                "kind": "ContentListItem",
                "content": [

                    "kind": "Text",

        "kind": "Paragraph",
        "content": [

            "kind": "Text",
            "text": "\n            它们都只能通过名称在新的接口表达式中访问。\n        "

        ]
      },
      {
        "kind": "Topic",
        "title": "在新的接口表达式中删除块",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                新的接口表达式可以包含一个 delete{} 块。\n                它为匿名实现对象声明清理代码。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该块没有名称、参数、返回类型或 override 关键字：\n                "
              },
              {
                "kind": "Program",
                "code": "interface ISubscription*\n{\n    func Stop():void;\n}\n\nvar subscription = new ISubscription*\n{\n    var stopped: bool = false;\n\n    override func Stop():void\n    {\n        stopped = true;\n    }\n\n    delete\n    {\n        if (!stopped)\n        {\n            Stop();\n        }\n    }\n};\n\ndelete subscription;"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于一个共享接口对象，delete{} 块在最后一个共享指针释放对象时运行，\n                对于一个原始接口对象，它在对象被直接删除时运行，\n                或者当对象已被转换为共享指针，并且最后一个共享指针释放它时。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该块用于由匿名实现对象拥有的资源，\n                例如，取消注册回调、关闭订阅或释放原生句柄。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "使用 new 和 delete 创建实现共享接口的对象",

            "content": [
              {
                "kind": "Program",
                "code": "interface IMyInterface\n{\n    func Do():void;\n}\n\nvar my = new IMyInterface^\n{\n    override func Do():void {}\n};"

            ]
          },

            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                你不允许编写 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "new IMyInterface*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                因为接口不是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "接口 IMyInterface*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                的类型为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "my"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMyInterface^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                但你仍然可以获得一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMyInterface*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 通过显式转换：\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "var my2 = cast IMyInterface* my;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当……所指向的对象 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "my2"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 仍然存活时，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "将 IMyInterface^ my2 转换为"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是安全的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当所有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMyInterface^"

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMyInterface*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 值。\n            "
              }

            "kind": "Paragraph",
            "content": [
              {

                "text": "\n                如果对已删除的对象调用成员，会导致崩溃。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "delete"

                ]

                "kind": "Text",

              }
            ]

                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",

              },
              {
                "kind": "Text",
                "text": " 仍然存活时，\n                "
              },
              {
                "kind": "Strong",

                  {
                    "kind": "Text",
                    "text": "将 IMyInterface^ my 转换为"

              {
                "kind": "Text",
                "text": " 是安全的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当所有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMyInterface^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 值的生命周期结束时，\n                该对象将被删除，\n                即使仍然存在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMyInterface*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果对已删除的对象调用成员，会导致崩溃。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "delete"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对由共享指针持有的对象执行……\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                为了删除 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",

                  }

              },

                "kind": "Text",

      {
        "kind": "Topic",
        "title": "内存泄漏",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果两个对象通过共享指针相互持有，\n                它会导致内存泄漏：\n                "
              },
              {
                "kind": "Program",
                "code": "interface IMyInterface\n{\n    prop Next: IMyInterface^ {not observe}\n}\n\nfunc main(): void\n{\n    var a = new IMyInterface^\n    {\n        override prop Next: IMyInterface^ = null {not observe}\n    };\n\n    var b = new IMyInterface^\n    {\n        override prop Next: IMyInterface^ = null {not observe}\n    };\n    \n    a.Next = b;\n    b.Next = a;\n}"
              },
              {
                "kind": "Text",
                "text": "\n                直到您手动断开连接。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
