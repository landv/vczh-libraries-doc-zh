      {
        "kind": "Topic",
        "title": "有序lambda表达式：[$1 + $2]",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此表达式构建一个lambda表达式，\n                它返回方括号内的表达式，\n                参数类型和返回类型自动推导\n                由接收此表达式的上下文中显式指定的类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您可以使用多个参数从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 到任意数字，\n                但是所有数字必须是连续的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如：\n                "
              },
              {
                "kind": "Program",
                "code": "var f: func(string, string):string = [$`Hello, $($1) and $($2)!`];"
              },
              {
                "kind": "Text",
                "text": "\n                完全相同于\n                "
              },
              {
                "kind": "Program",
                "code": "var f = func(a: string, b: string): string\n{\n    return `Hello, $(a) and $(b)!`;\n}"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Lambda 表达式：func(x: int, y: int): int{ return x + y; }",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此表达式创建一个函数，\n                显式指定参数类型和返回类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                允许多个参数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                所有来自外部作用域的已使用局部变量都通过浅拷贝捕获。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这意味着，\n                如果变量持有类实例并被 lambda 表达式捕获，\n                您无法将另一个对象重新分配给此变量。\n                但你可以更改此对象的属性。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这也意味着，\n                在创建后更改捕获的变量（在 lambda 表达式外部）\n                在 lambda 表达式内部无效。\n                "
              },
              {
                "kind": "Program",
                "code": "func main(): int\n{\n    var x = 1;\n    var f = func():int { return x + 1; };\n    x = 2;\n    return f();\n}"
              },
              {
                "kind": "Text",
                "text": "\n                该函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "2"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                全局变量不通过捕获使用，\n                它们总可以在 lambda 表达式中重新分配。\n                "
              },
              {
                "kind": "Program",
                "code": "var x = 1;\n\nfunc main(): int\n{\n    var f = func():int { return x + 1; };\n    x = 2;\n    return f();\n}"
              },
              {
                "kind": "Text",
                "text": "\n                该函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "3"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "让表达式：let x = 1, y = 2 in (x + y)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此表达式为只读局部变量创建一个新的作用域，\n                在最后一个表达式中，即圆括号内的表达式中，哪些是可访问的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                允许使用多个变量，它们由 \""
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": ","
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\"\".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                最后一个表达式的圆括号不能省略。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "func main(): int\n{\n    return let x = 1, y = 2 in (x + y);\n}"
              },
              {
                "kind": "Text",
                "text": "\n                该函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "3"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },

      {
        "kind": "Topic",
        "title": "实例成员访问：OBJECT.MEMBER",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 使用一个名为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在一个由值持有的对象中 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                是否 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是共享指针或原始指针。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是一组重载函数，\n                接收此表达式的实体必须具有显式类型。\n                例如：\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nclass C\n{\n    var x: int = 100;\n    func F():int    { return x; }\n    func F():string { return x; }\n}\n\nfunc main(): string\n{\n    var f = new C^().F;\n    return f();\n}"
              },
              {
                "kind": "Text",
                "text": "\n                会产生错误，\n                因为它无法确定哪个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "F"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 预期。\n                But:\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nclass C\n{\n    var x: int = 100;\n    func F():int    { return x; }\n    func F():string { return x; }\n}\n\nfunc main(): string\n{\n    var f: func(): string = new C^().F;\n    return f();\n}"
              },
              {
                "kind": "Text",
                "text": "\n                显然使用了第二个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "F"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
