            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个订阅(subscription)观察某些对象时，\n                这个订阅的引用会被挂接到属性上的事件处理器捕获，\n                同时这些对象也会被保存进该订阅，因为 "

                  {
                    "kind": "Text",
                    "text": "detach"

                ]
              },
              {
                "kind": "Text",
                "text": " 需要在之后被调用，\n                这会导致循环引用。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                调用 "

                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Close"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                即可解除这些循环引用，\n                从而避免内存泄漏。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nclass Numbers\n{\n    prop A: int = 0 {}\n    prop B: int = 0 {}\n    prop C: int = 0 {}\n}\n\nfunc main(): string\n{\n    var numbers = new Numbers^();\n    var sub = bind(numbers.A + numbers.B + numbers.C);\n\n    var r = {\"\"};\n    attach(sub.ValueChanged, func(newValue: object): void\n    {\n        r[0] = $\"$(r[0])$(cast int newValue); \";\n    });\n    sub.Open();\n\n    numbers.A = 1;\n    numbers.B = 2;\n    numbers.C = 3;\n\n    sub.Close();\n    return r[0];\n}"

                "kind": "Text",

                "kind": "Program",
                "code": "module sampleModule;\n\nclass ClassA\n{\n    prop B: ClassB^ = new ClassB^() {}\n}\n\nclass ClassB\n{\n    prop C: ClassC^ = new ClassC^() {}\n}\n\nclass ClassC\n{\n    prop X: int = 0 {}\n}\n\nfunc main(): string\n{\n    var a = new ClassA^();\n    var sub = bind(a.B.C.X);\n\n    var r = {\"\"};\n    attach(sub.ValueChanged, func(newValue: object): void\n    {\n        r[0] = $\"$(r[0])$(cast int newValue); \";\n    });\n    sub.Open();\n\n    {\n        a.B.C.X = 100;\n    }\n    {\n        var c = new ClassC^();\n        c.X = 200;\n        a.B.C = c;\n    }\n    {\n        var b = new ClassB^();\n        b.C.X = 300;\n        a.B = b;\n    }\n\n    sub.Close();\n    return r[0];\n}"

      {
        "kind": "Topic",
        "title": "警惕属性链中不可观察的属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                拥有被观察属性的对象会被保存在 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "bind"
                  }

              },
              {
                "kind": "Text",
                "text": " 中，因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "detach"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 需要被调用。\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nclass ClassA\n{\n    prop B: ClassB^ = new ClassB^() {not observe}\n}\n\nclass ClassB\n{\n    prop C: ClassC^ = new ClassC^() {not observe}\n}\n\nclass ClassC\n{\n    prop X: int = 0 {}\n}\n\nfunc main(): string\n{\n    var a = new ClassA^();\n    var sub = bind(a.B.C.X);\n\n    var r = {\"\"};\n    attach(sub.ValueChanged, func(newValue: object): void\n    {\n        r[0] = $\"$(r[0])$(cast int newValue); \";\n    });\n    sub.Open();\n\n    var oldC = a.B.C;\n    {\n        a.B.C.X = 100;\n    }\n    {\n        var c = new ClassC^();\n        c.X = 200;\n        a.B.C = c;\n    }\n    {\n        var b = new ClassB^();\n        b.C.X = 300;\n        a.B = b;\n    }\n    oldC.X = 400;\n\n    sub.Close();\n    return r[0];\n}"
              },
              {
                "kind": "Text",
                "text": "\n                该函数返回 "
              },
              {
                "kind": "Strong",
                "content": [

                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n            "

          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不可观察，\n                所以对它们的赋值不会触发回调。\n            "

          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                但是当 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC.X = 400;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被调用时，\n                回调会以 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "400"
                  }

              {
                "kind": "Text",
                "text": " 被触发，\n                而这显然不是 "

                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C.X"

              {
                "kind": "Text",
                "text": " 在 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "bind"

              },
              {
                "kind": "Text",
                "text": " 中指定的实际值。\n            "

            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被缓存了。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不可观察，\n                所以当我们写 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "bind(a.B.C.X)"

              },
              {
                "kind": "Text",
                "text": " 时，\n                它实际上等价于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "让缓存对象 = a.B.C，在（绑定（缓存对象.X））中"
                  }

              },
              {
                "kind": "Text",
                "text": "。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 变为可观察，但 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 仍不可观察时，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 会在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被修改时更新。\n                如果 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被重新赋值时没有被修改，\n                那么对被观察表达式的求值仍会使用旧的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在前面的示例中，\n                请把 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "不观察"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "（位于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "属性 B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 中）移除，\n                并修改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "sub.Open()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 与 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "sub.Close"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 之间的一些代码，如下所示：\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nclass ClassA\n{\n    prop B: ClassB^ = new ClassB^() {}\n}\n\nclass ClassB\n{\n    prop C: ClassC^ = new ClassC^() {not observe}\n}\n\nclass ClassC\n{\n    prop X: int = 0 {}\n}\n\nfunc main(): string\n{\n    var a = new ClassA^();\n    var sub = bind(a.B.C.X);\n\n    var r = {\"\"};\n    attach(sub.ValueChanged, func(newValue: object): void\n    {\n        r[0] = $\"$(r[0])$(cast int newValue); \";\n    });\n    sub.Open();\n\n    {\n        var b = new ClassB^();\n        b.C.X = 100;\n        a.B = b;\n    }\n    {\n        a.B.C.X = 200;\n    }\n    var oldC = a.B.C;\n    {\n        var c = new ClassC^();\n        c.X = 300;\n        a.B.C = c;\n    }\n    oldC.X = 400;\n\n    sub.Close();\n    return r[0];\n}"
              },
              {
                "kind": "Text",
                "text": "\n                该函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\"100; 200; 400; \""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                修改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不会触发事件，\n                因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不可观察。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                修改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 会触发事件，\n                因为之前的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被缓存在订阅中，\n                即使 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已改变也是如此。\n                所以它实际上并不会求值 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                而是求值 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n            "
              }

          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                但如果再次修改 "

                "content": [
                  {
                    "kind": "Text",

                  }

                "text": "，\n                缓存的 "

                "content": [
                  {
                    "kind": "Text",
                    "text": "ClassC^"
                  }
                ]
              },
              {

                "text": " 对象会被刷新，\n                它便不再是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n            "
              }
            ]
          }
        ]

      {
        "kind": "Topic",
        "title": "A ? B : C",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nclass Cond\n{\n    prop Value: bool = false {}\n}\n\nclass Int\n{\n    prop Value: int = 0 {}\n}\n\nfunc main(): string\n{\n    var c = new Cond^();\n    var a = new Int^();\n    var b = new Int^();\n    var sub = bind(c.Value ? a.Value : b.Value);\n\n    var r = {\"\"};\n    attach(sub.ValueChanged, func(newValue: object): void\n    {\n        r[0] = $\"$(r[0])$(cast int newValue); \";\n    });\n    sub.Open();\n\n    c.Value = true;\n    a.Value = 100;\n    b.Value = 200;\n    c.Value = false;\n    a.Value = 300;\n    b.Value = 400;\n\n    sub.Close();\n    return r[0];\n}"
              },
              {
                "kind": "Text",
                "text": "\n                该函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\"0; 100; 100; 200; 200; 400; \""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                即使 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "一个"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 位于 if 表达式的不同分支中，\n                它们的事件也会全部被挂接。\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b.Value"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被修改时，\n                即使它并未参与求值，\n                也仍然会触发回调。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果 if 表达式的分支中有属性链，\n                所有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "attach"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 与 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "detach"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 都将在上游属性被修改时执行，\n                拥有可观察属性的对象会被求值并缓存，\n                相关属性的 getter 也会被调用，\n                而与条件表达式求值出什么无关。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                让我们看一个更复杂的示例：\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nclass Cond\n{\n    prop Value: bool = false {}\n}\n\nclass Holder\n{\n    prop Value: Int^ = new Int^() {}\n}\n\nclass Int\n{\n    prop Value: int = 0 {}\n}\n\nfunc main(): string\n{\n    var c = new Cond^();\n    var a = new Holder^();\n    var b = new Holder^();\n    var sub = bind((c.Value ? a.Value : b.Value).Value);\n\n    var r = {\"\"};\n    attach(sub.ValueChanged, func(newValue: object): void\n    {\n        r[0] = $\"$(r[0])$(cast int newValue); \";\n    });\n    sub.Open();\n\n    c.Value = true;\n    a.Value.Value = 100;\n    b.Value.Value = 200;\n    c.Value = false;\n    a.Value.Value = 300;\n    b.Value.Value = 400;\n\n    sub.Close();\n    return r[0];\n}"
              },
              {
                "kind": "Text",
                "text": "\n                该函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\"0; 100; 200; 400; \""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "c.Value = true;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 执行时，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 会被打印。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(c.Value ? a.Value : b.Value)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 变为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                因此 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value.ValueChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被挂接，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b.Value.ValueChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被分离。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value.Value = 100;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 执行时，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "100;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 会被打印，这显而易见。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b.Value.Value = 200;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 执行时，\n                什么都不会发生，\n                因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b.Value.ValueChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已经被分离了。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "c.Value = false;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 执行时，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "200;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 会被打印。\n                "
              },
              {
                "kind": "Strong",
                "content": [
