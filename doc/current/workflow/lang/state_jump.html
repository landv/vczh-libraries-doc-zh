  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "状态之间跳转",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            与任何函数一样，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 允许有零个、一个或多个参数。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            通过……跳转到另一个状态 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$push_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 类似于调用一个函数。\n            当该状态结束时，\n            状态机在代码之后继续运行 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$push_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            通过……跳转到另一个状态 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$goto_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 类似于 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "goto"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            当该状态结束时，\n            状态机在代码之后不会继续执行 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$goto_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            如果没有堆叠 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$push_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，状态机停止。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "module sampleModule;\n\nusing system::*;\n\nclass MySM : StateMachine\n{\n    var result: int = 0;\n    event ResultChanged();\n\n    func GetResult(): int\n    {\n        return result;\n    }\n\n    prop Result: int {GetResult : ResultChanged}\n\n    $state_machine\n    {\n        $state_input Add(number: int);\n        $state_input Sum();\n\n        $state ResultGenerated(number: int)\n        {\n            result = number;\n            ResultChanged();\n        }\n\n        $state NumberExpected()\n        {\n            var sum = 0;\n            while (true)\n            {\n                $switch(raise)\n                {\n                case Add(number):\n                    {\n                        sum = sum + number;\n                    }\n                case Sum():\n                    {\n                        $push_state ResultGenerated(sum);\n                        break;\n                    }\n                }\n            }\n            $goto_state NumberExpected();\n        }\n\n        $state default()\n        {\n            $goto_state NumberExpected();\n        }\n    }\n}\n\nfunc main(): string\n{\n    var r = {\"\"};\n    var sm = new MySM^();\n    attach(sm.ResultChanged, func():void\n    {\n        r[0] = $\"$(r[0])$(sm.Result); \";\n    });\n\n    sm.Add(1); sm.Add(2); sm.Add(3); sm.Add(4); sm.Add(5); sm.Add(6); sm.Sum();\n    sm.Add(1); sm.Add(1); sm.Add(2); sm.Add(3); sm.Add(5); sm.Add(8); sm.Sum();\n    sm.Add(1); sm.Add(2); sm.Add(4); sm.Add(8); sm.Add(16); sm.Add(32); sm.Sum();\n    return r[0];\n}"
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数返回 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\"21; 20; 63; \""
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            此状态机通过 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Add"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 并通过计算它们的总和输出。 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "sum"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Sum"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被调用时，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$push_state ResultGenerated(sum);"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被执行。\n            当 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state ResultGenerated"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 完成，\n            状态机从最后一个状态继续 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$push_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            哪个是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "break;"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            然后 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$goto_state NumberExpected();"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被执行。\n            这是一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$goto_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            因此它直接跳转到该状态，而不是调用它。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Using "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$jump_state NumberExpected();"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 用于避免循环导致内存泄漏。\n            因为变量和先前状态的恢复点被保存了，\n            但状态永远不会结束。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这是一个无限状态机，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$default"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 永不结束。\n        "
          }
        ]
      }
    ]
  }
};
