                "content": [

              {

                        "content": [

                        "text": " 返回 "

                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {

                          {

                      },
                      {

                      {

                      {

                      {

                        "content": [
                          {

      {

        "content": [

                "content": [
                  {
                    "kind": "Text",

                "content": [
                  {

              },
              {

          },

            "kind": "Paragraph",
            "content": [

                "text": "\n                If "

              {

      },
      {
        "kind": "Topic",
        "title": "托管系统::Async^",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::AsyncScheduler::RegisterDefaultScheduler"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::AsyncScheduler::RegisterSchedulerForCurrentThread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                在执行特定线程中的任务之前需要\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                建议您调用\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::AsyncScheduler::UnregisterDefaultScheduler"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::AsyncScheduler::UnregisterSchedulerForCurrentThread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                当某个线程不需要运行任何任务时。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::Async::Execute"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 使用调用者线程的调度器来运行自身。\n                If "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RegisterSchedulerForCurrentThread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在此线程中被调用，\n                它不会使用已注册的调度器。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RegisterDefaultScheduler"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通常此接口在C++中实现，\n                应使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::reflection::description::IAsyncScheduler"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 作为接口的名称。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                需要实现3种方法：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Execute"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：\n                            该函数会在它选择的任意线程中运行回调。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            此函数在之后被调用 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "$Await"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 完成等待。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            对于 GacUI，UI 线程的调度器不同于其它线程，\n                            因为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Execute"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " （UI 线程的调度器的）会在 UI 线程中运行回调。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            这意味着，\n                            用于任何 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "$Async"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 从用户界面线程调用的\n                            所有代码最终都会在UI线程中执行，\n                            包括使用 await 等待的任务 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "$Await"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ".\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            如果一个任务不想在 UI 线程中执行，即使它是由 UI 线程调度的，\n                            它需要显式调用 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AsyncScheduler::ExecuteInBackground"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "，\n                            这意味着该任务无法使用协程实现。\n                        "
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "ExecuteInBackground"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：\n                            该函数会在它选择的任意线程中运行回调。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            由……生成的代码不会调用它 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "$Async"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 协程。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            对于 GacUI， "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "ExecuteInBackground"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 在随机的非UI线程中运行回调。\n                            这个调度器是否用于UI线程无关紧要。\n                        "
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "DelayExecute"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：\n                            此函数在任何它喜欢的线程中运行一个回调\n                            在指定时间之后。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            由……生成的代码不会调用它 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "$Async"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 协程。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            对于 GacUI，UI 线程的调度器不同于其它线程，\n                            因为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "DelayExecute"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " （UI 线程的调度器的）会在 UI 线程中运行回调。\n                        "
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "：\n                Workflow 脚本没有提供默认调度器。\n                如果你没有实现任何调度器，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$Async"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 协程失败。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "示例",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                让我们看一个调度器的例子。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$Async"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不一定意味着多线程，\n                所有内容都可以同步。\n                以下调度程序将所有任务排队\n                将在需要时由一个执行。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "class SyncScheduler : public Object, public IAsyncScheduler, public Description<SyncScheduler>\n{\npublic:\n    List<Func<void()>>\t\ttasks;\n\n    void Run(const Func<void()>& callback)\n    {\n        auto scheduler = Ptr(new SyncScheduler);\n        IAsyncScheduler::RegisterDefaultScheduler(scheduler);\n        callback();\n        while (scheduler->tasks.Count() > 0)\n        {\n            auto firstTask = scheduler->tasks[0];\n            scheduler->tasks.RemoveAt(0);\n            firstTask();\n        }\n        IAsyncScheduler::UnregisterDefaultScheduler();\n    }\n\n    void Execute(const Func<void()>& callback) override\n    {\n        tasks.Add(callback);\n    }\n\n    void ExecuteInBackground(const Func<void()>& callback) override\n    {\n        tasks.Add(callback);\n    }\n\n    void DelayExecute(const Func<void()>& callback, vint milliseconds) override\n    {\n        // the required waiting time is ignored\n        tasks.Add(callback);\n    }\n};"
              },
              {
                "kind": "Text",
                "text": "\n                假设该类使用此名称注册： "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "test::SyncScheduler"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通过调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SyncScheduler::Run"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                调度器注册自己为全局任务调度器，\n                在调用者线程中执行回调，\n                在调用者线程中执行所有生成的新任务，直到它们全部完成，\n                注销自身。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                以下工作流脚本创建了一些 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Async"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象\n                通过使用协程或实现接口，\n                然后调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SyncScheduler::Run"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 运行所有代码。\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\n\nusing system::*;\nusing test::*;\n\nvar s = \"\";\n\n$interface IStringAsync : Async<string>;\n\nfunc GetStringAsync(x : int) : IStringAsync^\n${\n    s = $\"$(s)[$(x)]\";\n    return cast string x;\n}\n\nfunc GetStringAsync2(x : int) : IStringAsync^\n{\n    var future = Future::Create();\n    AsyncScheduler::GetSchedulerForCurrentThread().ExecuteInBackground(func():void\n    {\n        s = $\"$(s)[$(x)]\";\n        future.Promise.SendResult(cast string x);\n    });\n    \n    return new IStringAsync^(using future of Async^);\n}\n\nfunc GetMultipleStrings() : void\n$Async{\n    for(i in range[0, 1])\n    {\n        var x = $Await GetStringAsync(i);\n        s = $\"$(s)[+$(x)]\";\n        var y = $Await GetStringAsync2(i);\n        s = $\"$(s)[-$(y)]\";\n        $Await Async::Delay(0);\n        s = $\"$(s)!\";\n    }\n}\n\nfunc main():string\n{\n    SyncScheduler::Run(GetMultipleStrings);\n    return s;\n}"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        该 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
