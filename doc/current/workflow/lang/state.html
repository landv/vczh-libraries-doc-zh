  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "状态机",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A state machine works like a coroutine,\n            but unlike coroutine which only has "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Resume"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ",\n            a state machine could have multiple strong-typed inputs.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A state machine is a class.\n            It must inherit from "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "system::StateMachine"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            The last member must be "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state_machine { ... }"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A state machine defines multiple states with arguments.\n            The entry state is called "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "default"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$goto_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$push_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " could be use for jump between states.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A state machine defines multiple strong-typed inputs.\n            The state machine is driven by input.\n            When a "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$switch"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " state is executed,\n            it waits for selected inputs.\n            A required input method must be called to resume the state machine.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Let's start with an example:\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\n\nusing system::*;\n\nclass MySM : StateMachine\n{\n    prop Output: string = \"\" {not observe}\n\n    func Append(text: string): void\n    {\n        Output = $\"$(Output)$(text); \";\n    }\n\n    $state_machine\n    {\n        $state_input A(name: string);\n        $state_input B(name: string);\n\n        $state WaitForName()\n        {\n            $switch ()\n            {\n            case A(name):\n                {\n                    Append($\"A($(name))\");\n                }\n            case B(name):\n                {\n                    Append($\"B($(name))\");\n                }\n            }\n        }\n\n        $state default()\n        {\n            Append(\"First line\");\n            $push_state WaitForName();\n            Append(\"Last line\");\n        }\n    }\n}\n\nfunc main(): string\n{\n    var sm = new MySM^();\n    try\n    {\n        sm.A(\"John\");\n        sm.B(\"Smith\");\n    }\n    catch (ex)\n    {\n        sm.Append(ex.Message);\n    }\n    return sm.Output;\n}"
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数返回 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\"First line; A(John); Last line; The state machine has been stopped.; \""
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "new MySM^()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is executed,\n                    the state machine is not started.\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "sm.A(\"John\");"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is executed.\n                    Because this is the first time a "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state_input"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is called,\n                    the state machine starts.\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    The entry state of a state machine is "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "default"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    it immediately enters "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state default()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\"First line; \""
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被打印。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$push_state WaitForName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is executed,\n                    it jumps to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state WaitForName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    It is supposed to stop at "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$switch"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    But because "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "A"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " has not been consumed,\n                    the state machine continues and choose "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "case A(name):"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\"A(John)\""
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被打印。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Now "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state WaitForName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " finishes.\n                    Because the state machine jumps to this state via "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$push_state"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    so it still needs to go back to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state default"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\"Last line;\""
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被打印。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    The state machine stops.\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "sm.B(\"Smith\");"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is executed,\n                    because the state machines has stopped,\n                    it throws an exception.\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " defines states.\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state_input"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " defines inputs from outside.\n            State machines have more freedom in exchanging data comparing to coroutines.\n        "
          }
        ]
      }
    ]
  }
};

    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
