<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Structs -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/article.css" />
<script src="/vczh-libraries-doc-zh/doc/current/scripts/rootView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/directoryView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/articleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "workflow",
    "lang",
    "struct"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "Workflow 脚本",
      "selected": false,
      "path": [
        "workflow",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "语法",
          "selected": false,
          "path": [
            "workflow",
            "lang"
          ],
          "subNodes": [
            {
              "icon": "-",
              "name": "类型",
              "selected": false,
              "path": [
                "workflow",
                "lang",
                "type"
              ],
              "subNodes": [
                {
                  "icon": " ",
                  "name": "枚举",
                  "selected": false,
                  "path": [
                    "workflow",
                    "lang",
                    "enum"
                  ]
                },
                {
                  "icon": " ",
                  "name": "结构体",
                  "selected": true,
                  "path": [
                    "workflow",
                    "lang",
                    "struct"
                  ]
                },
                {
                  "icon": "+",
                  "name": "接口",
                  "selected": false,
                  "path": [
                    "workflow",
                    "lang",
                    "interface"
                  ]
                },
                {
                  "icon": "+",
                  "name": "类",
                  "selected": false,
                  "path": [
                    "workflow",
                    "lang",
                    "class"
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "结构体",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            结构体可以在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "modules"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "namespaces"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "classes"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "interfaces"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            结构体是所有字段都分配了名称的元组：\n            "
          },
          {
            "kind": "Program",
            "code": "struct Point\n{\n    x: int;\n    y: int;\n}"
          },
          {
            "kind": "Text",
            "text": "\n            字段的类型应仅为值类型，例如：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "基础类型"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "枚举"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "结构体"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "基础类型"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "可为空类型"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            结构体不允许具有自身或其可空类型作为直接或间接字段。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            结构体不能从其他结构体继承。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "分配结构（struct）",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                构造函数表达式是分配结构体类型值的唯一方式：\n                "
              },
              {
                "kind": "Program",
                "code": "func use(p: Point): Point\n{\n    return p;\n}\n\nvar a: Point = {x:1 y:2};\nvar b = {x:3 y:4} of Point;\nvar c = use({x:5 y:6});"
              },
              {
                "kind": "Text",
                "text": "\n                构造函数表达式没有显式类型，\n                因此接收此表达式的地点必须具有显式类型，\n                否则将生成一个错误。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不允许赋值给结构类型变量。\n                但有一种可选类型可以帮助这种情况：\n                "
              },
              {
                "kind": "Program",
                "code": "var d: Point? = null;\nd = {x:7 y:8};"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "访问字段",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                的类型为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "一个"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Point"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                so "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.x"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 1， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.y"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 2。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                的类型为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "d"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Point?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                so "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "d.x"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 7， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "d.y"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是 8。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "d"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 变成 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                访问字段在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "d"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将导致抛出异常。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                结构体字段是只读的，\n                在结构体被分配后，\n                字段不能重新赋值。\n                但结构体变量本身可以用新值赋值。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "歧义",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                由于工作流支持丰富的表达形式，\n                有时构造函数表达式可能会引入二义性。\n                在这种情况下，\n                分号允许出现在每个字段之后：\n                "
              },
              {
                "kind": "Program",
                "code": "var e: Point = {x:1; y:2;};"
              },
              {
                "kind": "Text",
                "text": "\n                请注意，\n                分号必须出现在所有字段之后，\n                或完全提交。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
