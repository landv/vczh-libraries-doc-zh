  const directoryInfo = {

};
  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "工作流 RPC",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n\t\t\tWorkflow RPC 通过使用 Workflow 接口来描述服务契约，并通过与传输无关的生命周期、分发器、序列化器和通道层来运行它们。契约以 Workflow 编写，运行时决定对象引用、方法调用、属性访问和事件如何在进程或机器之间传递。\n\t\t"
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "声明 RPC 接口",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t一个 RPC 服务接口是一个用 @rpc:Interface 标记的非泛型工作流接口。基础接口也必须是 RPC 接口。\n\t\t\t"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t当 RPC 接口表示客户端可以请求的服务类型时，在该接口上使用 @rpc:Ctor。\n\t\t\t\t"
              },
              {
                "kind": "Program",
                "code": "module Rpc;\nusing system::*;\n\nnamespace Chat\n{\n\t@rpc:Interface\n\t@rpc:Ctor\n\tinterface IChatService\n\t{\n\t\tfunc Send(text : string) : void;\n\t\tfunc LastMessage() : string;\n\t}\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tRPC 成员可以使用可序列化的值、RPC 接口的共享指针以及元素类型为可序列化的强类型集合。void 仅作为方法返回类型有效。\n\t\t\t"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "RPC 属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tRPC 分析器识别这些属性：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "@rpc:Interface: 将 Workflow 接口标记为 RPC 接口。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "@rpc:Ctor: 将 RPC 接口标记为可通过 RPC 服务模型构造。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "@rpc:Cached: 将 RPC 属性标记为由客户端包装器缓存。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "@rpc:Dynamic: 将 RPC 属性标记为每次从远程对象读取。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "@rpc:Byval: 通过值传递强类型集合。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "@rpc:Byref: 通过引用传递强类型集合。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t@rpc:Cached 和 @rpc:Dynamic 只能在 RPC 属性上使用，且不能同时出现。除非标记为 @rpc:Dynamic，否则属性默认为缓存。\n\t\t\t"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t@rpc:Byval 和 @rpc:Byref 可用于 RPC 属性、方法返回值和方法参数中强类型集合。它们不能同时出现。当两者均未指定时，可观察集合和包含 RPC 接口的集合默认按引用传递；其他强类型集合默认按值传递。\n\t\t\t"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "可序列化的值",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tRPC 负载必须是可序列化的。支持的负载结构为：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "原始反射值，如布尔值、整数、浮点数和字符串；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "反射结构体、普通枚举和标志枚举；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "可为空值，其元素类型可序列化；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "带有 @rpc:Interface 标记的接口的共享指针；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "强类型集合，其类型参数可序列化。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t保留的框架类型，如对象引用和 RPC 异常，是传输协议的一部分，不能作为普通 RPC 成员负载使用。\n\t\t\t"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "服务与客户端流程",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t服务器创建一个实现对象并将其注册到 IRpcLifecycle。客户端向生命周期请求相同的服务名称，并将返回的对象强制转换为服务接口。\n\t\t\t\t"
              },
              {
                "kind": "Program",
                "code": "func serviceMain(lc : IRpcLifecycle*) : void\n{\n\tvar service = new Chat::IChatService^\n\t{\n\t\tvar last : string = \"\";\n\n\t\toverride func Send(text : string) : void\n\t\t{\n\t\t\tlast = text;\n\t\t}\n\n\t\toverride func LastMessage() : string\n\t\t{\n\t\t\treturn last;\n\t\t}\n\t};\n\n\tlc.RegisterLocalService(rpc_GetIds()[\"Chat::IChatService\"], service);\n}\n\nfunc clientMain(lc : IRpcLifecycle*) : string\n{\n\tvar service = cast (Chat::IChatService^) lc.RequestService(\"Chat::IChatService\");\n\tservice.Send(\"hello\");\n\treturn service.LastMessage();\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\trpc_GetIds() 暴露了已加载的 RPC 模块的 RPC 接口 ID 表。RegisterLocalService 将本地实现绑定到接口 ID。RequestService 通过名称向远程端请求服务并返回一个包装对象。\n\t\t\t"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "运行时对象",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t工作流 RPC 运行时将协议逻辑与传输分离：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IRpcLifecycle 拥有每个客户端或每个会话的状态。它将本地对象映射到对象引用，为远程对象引用创建包装器，注册服务，请求服务，并暴露序列化器、分发器和控制器。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IRpcDispatcher 路由对象操作和事件操作。它声明本地服务，将对象操作发送到客户端，广播对象事件，并具有显式的初始化和最终化步骤。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IRpcController 执行本地对象操作和事件操作。它还控制在应用 RPC 操作时是否抑制属性更改事件和集合项事件。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IRpcSerializer 将反射值、对象引用、异常和操作记录转换为传输表示形式。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "实现分派器",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t调度器实现拥有传输连接的生命周期。它应该：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "为每个连接的客户端创建或接收一个 IRpcLifecycle；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "在发送或接收 RPC 操作之前调用 Initialize；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "将传入的传输消息转换为对象操作、事件操作、服务声明或生命周期操作；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "当本地服务必须对另一方可见时，调用 DeclareLocalService。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "通过 SendToClient_ObjectOps 发送对象操作，通过 BroadcastFromClient_ObjectEventOps 发送对象事件；"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "当传输关闭时调用 Finalize。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t调度器应通过拥有服务对象的主机任务队列或事件循环来安排用户回调。RPC 回调可以重新进入用户代码，因此调度器必须保持其线程和生命周期策略的一致性。\n\t\t\t"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "JSON RPC 通道层",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tJSON 实现使用了 RpcJsonDispatcher、RpcJsonLifecycle、RpcJsonObjectOps 和 RpcJsonObjectEventOps。IRpcJsonMessageDispatcher 接收 JSON 请求，并将其分类为直接消息、广播消息或广播并丢弃消息。\n\t\t\t"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t共享通道实现将 JSON 调度器连接到 "
              },
              {
                "kind": "PageLink",
                "href": "/vlppos/using-inter-process.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::inter_process"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 通道：\n\t\t\t\t"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonPackage 是一个 JSON 节点包。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonChannel 是 IChannel<JsonPackage>。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonChannelClient 和 JsonChannelServer 是调度器使用的通道端点。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonNetworkChannelClient 和 JsonNetworkChannelServer 使用网络通道实现。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "JsonLocalChannelClient 使用本地进程间通道实现。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\tRpcJsonDispatcherClient 从通道接收 JSON 包，等待服务器握手，必要时连接到本地服务器，并暴露其 RPC 生命周期和分发器。RpcJsonDispatcherServer 从客户端接收 JSON 包，注册和断开客户端连接，广播服务声明，并转发 RPC 请求。这两个类都需要一个具体的 ScheduleTask 策略；任务队列变体提供了标准实现。\n\t\t\t"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n\t\t\t\t参见 "
              },
              {
                "kind": "PageLink",
                "href": "/workflow/rpc/json-channel.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "JSON RPC 通道设置"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对于 IRpcJsonMessageDispatcher 传输协议和具体的 vl::inter_process 设置代码。\n\t\t\t"
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
