                "kind": "Text",
                "text": "，\n                但它不如 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BoxValue"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnboxValue"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnboxParameter"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Unboxed<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果在创建新对象时 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnboxParameter"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                它拥有引用。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IsOwned"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                对对象的引用将在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Unboxed<>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "' 的析构函数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果从返回一个现有对象的引用， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnboxParameter"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                它不拥有该引用。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IsOwned"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "false"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                对对象的引用不会被删除 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Unboxed<>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "' 的析构函数。\n                当您将容器装箱到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValue*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 并且解包为完全相同的类型。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "何时使用反射",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果可以，不建议您在运行时使用反射。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                反射主要用于编译和运行工作流脚本。\n                A工作流脚本类甚至可以从多个可反射的C++类继承（必须从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AggregatableDescription"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ").\n                为了执行 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "dynamic_cast"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 正确地，\n                建议您使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SafeAggregationCast<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数，存在于所有可反射的 C++ 类中。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                运行工作流脚本需要反射功能可用，\n                但运行从工作流脚本生成的 C++ 代码时则不会。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacUI"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，所有 GacUI XML 资源文件中的控件在编译时都会转换为工作流脚本文件。\n                为了创建这些控件，\n                建议直接使用由它们生成的 C++ 代码。\n                这些都是由 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacBuild.ps1"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您可以在运行时加载编译后的资源文件和脚本文件以创建控件，\n                但不建议这样做。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                反射有 3 个级别：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "VCZH_DEBUG_NO_REFLECTION"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 预处理器已定义：没有运行时反射。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "VCZH_DEBUG_METAONLY_REFLECTION"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 预处理器已定义：仅可用类型名称。您可以重新加载转储的二进制文件以恢复类型定义，但仅限元数据，反射方法无法执行。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "当未使用上述任何宏时：完整运行时反射功能。在此级别，您可以将类型转储到二进制文件中。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
};

  }
