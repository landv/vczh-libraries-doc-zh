  const article = {
  "index": false,

  "topic": {
    "kind": "Topic",
    "title": "注册宏和属性",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            VlppReflection 通过执行类型加载器代码来注册 C++ 类型。\n            上方的源注释 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Description<T>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " in VlppReflection 包含完整的宏遍历说明；\n            本页总结了注册工作流程，并记录了用于将元数据附加到已注册类型、成员和参数的属性宏。\n            这些属性是 VlppReflection 元数据，而不是 C++ 语言属性。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            类型注册代码仅在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "VCZH_DEBUG_NO_REFLECTION"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 未定义。\n            声明可反射类的代码仍然需要在没有运行时反射的情况下编译，但成员注册和属性是反射构建的一部分。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "注册工作流程",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                注册单元通常遵循以下结构：\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": true,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "定义一个类型列表宏，用于枚举完全限定的C++类型。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "在头文件中，用 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "DECL_TYPE_INFO"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "在一个 C++ 文件中，使用以下内容扩展类型列表 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IMPL_CPP_TYPE_INFO"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 或 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IMPL_TYPE_INFO_RENAME"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "注册枚举项、结构字段、类成员或接口成员。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "创建一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ITypeLoader"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 并调用 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ADD_TYPE_INFO"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 对于类型列表中的每种类型。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "通过以下方式安装加载器 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GetGlobalTypeManager()->AddTypeLoader"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 在读取反射元数据之前。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                成员注册宏通常需要一个临时的逗号宏，因为参数名称列表写在宏参数内：\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "#define MY_TYPELIST(F)\\\n    F(demo::DisplayNameAttribute)\\\n    F(demo::SampleClass)\n\nMY_TYPELIST(DECL_TYPE_INFO)\n\n// In one C++ file:\nMY_TYPELIST(IMPL_CPP_TYPE_INFO)\n\n#define _ ,\n\nBEGIN_STRUCT_MEMBER(demo::DisplayNameAttribute)\n    STRUCT_MEMBER(text)\nEND_STRUCT_MEMBER(demo::DisplayNameAttribute)\n\nBEGIN_CLASS_MEMBER(demo::SampleClass)\n    CLASS_MEMBER_CONSTRUCTOR(Ptr<demo::SampleClass>(), NO_PARAMETER)\n    ATTRIBUTE_TYPE(demo::DisplayNameAttribute, L\"Sample\")\n\n    CLASS_MEMBER_METHOD(Rename, { L\"value\" })\n    ATTRIBUTE_MEMBER(demo::DisplayNameAttribute, L\"Renaming\")\n    ATTRIBUTE_PARAMETER(L\"value\", demo::DisplayNameAttribute, L\"New name\")\nEND_CLASS_MEMBER(demo::SampleClass)\n\n#undef _\n\nclass DemoTypeLoader : public Object, public ITypeLoader\n{\npublic:\n    void Load(ITypeManager* manager) override\n    {\n        MY_TYPELIST(ADD_TYPE_INFO)\n    }\n\n    void Unload(ITypeManager* manager) override\n    {\n    }\n};",
                "language": "C++"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                上方的大段源代码注释 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Description<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也列出这些注册宏族：\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "枚举： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_ENUM_ITEM"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_ENUM_ITEM_MERGABLE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ENUM_ITEM"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ENUM_CLASS_ITEM"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "END_ENUM_ITEM"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "结构体： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_STRUCT_MEMBER"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "STRUCT_MEMBER"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "END_STRUCT_MEMBER"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "类： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_CLASS_MEMBER"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_BASE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_FIELD"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_CONSTRUCTOR"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_EXTERNALCTOR(_TEMPLATE)?"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_METHOD(_OVERLOAD)?_RENAME"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_(STATIC_)?METHOD(_OVERLOAD)?"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_(STATIC_)?EXTERNALMETHOD(_TEMPLATE)?"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_PROPERTY(_EVENT)?(_READONLY)?(_FAST)?"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_PROPERTY_REFERENCETEMPLATE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CLASS_MEMBER_EVENT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "END_CLASS_MEMBER"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "接口： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_INTERFACE_PROXY_NOPARENT_RAWPTR"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_INTERFACE_PROXY_RAWPTR"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_INTERFACE_PROXY_NOPARENT_SHAREDPTR"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_INTERFACE_PROXY_SHAREDPTR"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "END_INTERFACE_PROXY"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_INTERFACE_MEMBER"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BEGIN_INTERFACE_MEMBER_NOPROXY"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "END_INTERFACE_MEMBER"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可反射的接口必须直接或间接继承 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IDescriptable"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果工作流脚本类能够实现该接口，注册代理并使用接受 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr<IValueInterfaceProxy>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                Use "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BEGIN_INTERFACE_MEMBER_NOPROXY"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 仅当不需要脚本实现时。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "属性宏",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                属性宏创建 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IAttributeInfo"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象并将其存储在一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IAttributeBag"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ITypeDescriptor"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMemberInfo"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IParameterInfo"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 通过 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetAttributeCount"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetAttribute"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                每个属性记录其反射的结构类型以及传递给宏的装箱值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                属性类型必须满足以下规则：\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "类型必须在反射中注册。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "注册的类型描述符必须是结构体，而不是类或接口"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE{ARG1, ...}"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 必须为传递给宏的参数进行编译。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "每个参数都应是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ITypeDescriptor*"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 或一个反射的可序列化值类型，以便元数据日志和生成的元数据能够将其写回。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "标记属性不允许有零个参数。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在类型成员注册块中使用这些宏：\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ATTRIBUTE_TYPE(TYPE, ...)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 将属性附加到当前类型描述符。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ATTRIBUTE_MEMBER(TYPE, ...)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 将属性附加到最近注册的字段、属性、事件、方法或构造函数上。应直接放在它所修饰的成员宏之后。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ATTRIBUTE_PARAMETER(L\"name\", TYPE, ...)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 将属性附加到最近注册的方法或构造函数的命名参数上。参数名称必须与其中一个参数完全匹配。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "添加自定义属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                自定义属性只是一个稍后通过属性宏附加的反射结构。\n                保持小而仅包含数据。\n                字段顺序是看到的参数顺序 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "TYPE{ARG1, ...}"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "namespace demo\n{\n    struct DisplayNameAttribute\n    {\n        WString text;\n        auto operator<=>(const DisplayNameAttribute&) const = default;\n    };\n}\n\n#define DEMO_TYPES(F)\\\n    F(demo::DisplayNameAttribute)\\\n    F(demo::SampleClass)\n\nDEMO_TYPES(DECL_TYPE_INFO)\n\nDEMO_TYPES(IMPL_CPP_TYPE_INFO)\n\n#define _ ,\n\nBEGIN_STRUCT_MEMBER(demo::DisplayNameAttribute)\n    STRUCT_MEMBER(text)\nEND_STRUCT_MEMBER(demo::DisplayNameAttribute)\n\nBEGIN_CLASS_MEMBER(demo::SampleClass)\n    ATTRIBUTE_TYPE(demo::DisplayNameAttribute, L\"Visible sample\")\n\n    CLASS_MEMBER_METHOD(Rename, { L\"value\" })\n    ATTRIBUTE_MEMBER(demo::DisplayNameAttribute, L\"Rename method\")\n    ATTRIBUTE_PARAMETER(L\"value\", demo::DisplayNameAttribute, L\"Target name\")\nEND_CLASS_MEMBER(demo::SampleClass)\n\n#undef _",
                "language": "C++"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                要读取属性，遍历 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IAttributeBag"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，检查 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IAttributeInfo::GetAttributeType"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                然后通过读取每个参数 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetAttributeValueType"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetAttributeValue"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果属性参数是类型引用，则值类型为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ITypeDescriptor"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及包装的值存储一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ITypeDescriptor*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Workflow 源属性使用以下语法 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@category:Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                工作流分析器将其解析为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::workflow_attributes::att_category_Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                解析的类型必须是零字段或一个字段的反射结构体\n                单字段工作流属性接受一个参数，而工作流 C++ 生成目前仅发出字符串值。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ITypeDescriptor*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性的值。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "现有生产属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对兄弟源代码库的扫描发现生产属性声明仅存在于工作流仓库中。\n                在 VlppReflection 测试中，测试属性被有意排除。\n                GacUI 和生成的源代码使用 Workflow 属性，但不声明额外的生产属性结构。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                所有现有的生产属性都位于 C++ 命名空间中 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::__vwsn"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和在下面反映 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "system::workflow_attributes"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "att_cpp_File"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " / "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::workflow_attributes::att_cpp_File"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WString 参数"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". 工作流 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "@cpp:File(\"YourFile\")"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 控制为一个类生成的C++文件对。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "att_cpp_UserImpl"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " / "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::workflow_attributes::att_cpp_UserImpl"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：标记。Workflow "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "@cpp:UserImpl"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 为用户代码合并保留一个生成的构造函数、析构函数或函数体。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "att_cpp_Private"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " / "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::workflow_attributes::att_cpp_Private"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：标记。Workflow "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "@cpp:Private"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 在私有部分中发出装饰过的生成 C++ 类成员。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "att_cpp_Protected"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " / "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::workflow_attributes::att_cpp_Protected"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：标记。Workflow "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "@cpp:Protected"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 在保护部分中发出装饰过的生成 C++ 类成员。"

                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {

                      },
                      {
                        "kind": "Text",
                        "text": " / "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::workflow_attributes::att_cpp_Friend"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ITypeDescriptor* 参数"

                      },
                      {
                        "kind": "Text",
                        "text": " 发出 C++ 友元声明。"

                      {

                        "content": [

                            "kind": "Text",
                            "text": "system::workflow_attributes::att_rpc_Interface"

                      },
                      {
                        "kind": "Text",
                        "text": ": Workflow RPC验证中用于识别RPC接口的标记。"

                            "text": "att_rpc_Ctor"

                      {

                        "content": [

                      {
                        "kind": "Text",
                        "text": ": Workflow RPC生成中用于按值传输决策的标记。"

                        "text": " / "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::workflow_attributes::att_rpc_Byref"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": Workflow RPC生成中用于按引用传输决策的标记。"

                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "att_rpc_Cached"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " / "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::workflow_attributes::att_rpc_Cached"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": Workflow RPC生成中用于缓存按引用行为的标记。"

                  },
                  {
                    "kind": "ContentListItem",

                      {

                        "content": [
                          {
                            "kind": "Text",

                      },
                      {
                        "kind": "Text",
                        "text": " / "
                      },
                      {

                      },
                      {
                        "kind": "Text",

                            "kind": "Text",

                      },
                      {
                        "kind": "Text",

                        "kind": "Strong",
                        "content": [

                    "kind": "ContentListItem",

                        ]

                      {
                        "kind": "Text",

                      }
                    ]

                ]

            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                C++ 代码生成属性仅影响生成的 C++ 布局。\n                例如， "

                "content": [
                  {
                    "kind": "Text",
                    "text": "@cpp:Private"

                "content": [

                    "text": "@cpp:Protected"

              {
                "kind": "Text",
                "text": " 不会更改工作流的可见性规则。\n            "
              }
