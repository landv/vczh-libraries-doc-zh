        "content": [
          {
            "kind": "Text",
            "text": "\n            GacUI 应用需要一条应用级的自动化通道，使编码代理能够在调试时检查并操作 UI。\n            在 Windows 上，推荐的通道是在应用启动期间启动 GacUI AutomationService HTTP 端点。\n            这样代理就可以读取控件树或远程渲染器的 DOM，并发送 IO 命令，而无需使用操作系统的 UI Automation。\n        "

              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",

              },
              {
                "kind": "Name",
                "text": ".github/Guidelines/Running-ComputerUse.md"
              },
              {
                "kind": "Text",
                "text": " 文件说明了解除阻塞的工作流程：\n                "
