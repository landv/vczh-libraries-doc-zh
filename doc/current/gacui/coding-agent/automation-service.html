    "kind": "Topic",
    "title": "AutomationService",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            AutomationService 是 GacUI 面向编程式检查与输入的表面。\n            它由……暴露 "
          },
          {
            "kind": "Name",
            "text": "INativeAutomationService"
          },
          {
            "kind": "Text",
            "text": " 通过 "
          },
          {
            "kind": "Name",
            "text": "GetCurrentController()->AutomationService()"
          },
          {
            "kind": "Text",
            "text": "。\n            编码代理使用它读取当前 UI 结构并发送输入命令，而无需依赖操作系统的 UI Automation。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IMPORTANT:"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 强烈建议仅将自动化服务用于调试与测试。它无法完全保证安全。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            该服务与远程协议相互独立。\n            普通 Windows 应用程序、远程协议核心应用与远程协议渲染器都可以暴露自动化服务，\n            但每种配置只暴露各自一侧存在的 UI 视图。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "服务接口",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Name",
                "text": "INativeAutomationService"
              },
              {
                "kind": "Text",
                "text": " 有一个服务级可用性标志与三个功能组：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "Available"
                      },
                      {
                        "kind": "Text",
                        "text": "：当当前控制器不存在自动化服务时返回 false。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "Stop"
                      },
                      {
                        "kind": "Text",
                        "text": "：关闭所有功能。Windows 实现还会停止 HTTP 监听器。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "CanDumpControlTree"
                      },
                      {
                        "kind": "Text",
                        "text": " 以及 "
                      },
                      {
                        "kind": "Name",
                        "text": "DumpControlTree"
                      },
                      {
                        "kind": "Text",
                        "text": "：暴露可见的 GacUI 窗口、弹出层、控件与组合。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "CanDumpDomTree"
                      },
                      {
                        "kind": "Text",
                        "text": " 以及 "
                      },
                      {
                        "kind": "Name",
                        "text": "DumpDomTree"
                      },
                      {
                        "kind": "Text",
                        "text": "：暴露远程协议渲染器的 DOM。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "CanRunIOCommands"
                      },
                      {
                        "kind": "Text",
                        "text": " 以及 "
                      },
                      {
                        "kind": "Name",
                        "text": "RunIOCommand"
                      },
                      {
                        "kind": "Text",
                        "text": "：向主窗口或选定的原生窗口发送文本 IO 命令。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                功能可用性会被分别检查。\n                真实的……服务会返回 true "
              },
              {
                "kind": "Name",
                "text": "Available"
              },
              {
                "kind": "Text",
                "text": " 即使某个特定功能不受支持。\n                不受支持的 dump 功能应从对应的……返回 false "
              },
              {
                "kind": "Name",
                "text": "Can..."
              },
              {
                "kind": "Text",
                "text": " 函数，并从该操作返回空字符串。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Name",
                "text": "CanRunIOCommands"
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Name",
                "text": "INativeAutomationService::IOCommandAvailability"
              },
              {
                "kind": "Text",
                "text": ":\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "Disabled"
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Name",
                        "text": "RunIOCommand"
                      },
                      {
                        "kind": "Text",
                        "text": " 返回空字符串，端点层应将 IO 视为不受支持。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "Enabled"
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Name",
                        "text": "RunIOCommand"
                      },
                      {
                        "kind": "Text",
                        "text": " 接受所有语法有效的命令，并把已接受的工作加入队列。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "ExitOnly"
                      },
                      {
                        "kind": "Text",
                        "text": "：只有完全一致的命令 "
                      },
                      {
                        "kind": "Name",
                        "text": "!Exit"
                      },
                      {
                        "kind": "Text",
                        "text": " 会被转发，并保留正常的 "
                      },
                      {
                        "kind": "Name",
                        "text": "Queued"
                      },
                      {
                        "kind": "Text",
                        "text": " 结果。其它每个命令都恰好返回 "
                      },
                      {
                        "kind": "Name",
                        "text": "！应用程序已停止响应。"
                      },
                      {
                        "kind": "Text",
                        "text": " （同步返回，不排队）。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Windows HTTP 层",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Name",
                "text": "StartWindowsHttpAutomationService"
              },
              {
                "kind": "Text",
                "text": " 会为当前的……创建一个 localhost HTTP 包装器 "
              },
              {
                "kind": "Name",
                "text": "INativeAutomationService"
              },
              {
                "kind": "Text",
                "text": "。\n                它声明于 "
              },
              {
                "kind": "Name",
                "text": "PlatformProviders/Windows/WinNativeWindow.h"
              },
              {
                "kind": "Text",
                "text": " 并由 Windows 平台提供程序实现。\n                如果 "
              },
              {
                "kind": "Name",
                "text": "GetCurrentController()->AutomationService()->Available()"
              },
              {
                "kind": "Text",
                "text": " 为 false，该函数会直接返回，不启动监听器。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该函数把 "
              },
              {
                "kind": "Name",
                "text": "applicationName"
              },
              {
                "kind": "Text",
                "text": " 作为 URL 路径片段，并把 "
              },
              {
                "kind": "Name",
                "text": "port"
              },
              {
                "kind": "Text",
                "text": " 作为 localhost 端口。\n                给定 "
              },
              {
                "kind": "Name",
                "text": "applicationName == L\"Automation/MyApp\""
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Name",
                "text": "port == 8888"
              },
              {
                "kind": "Text",
                "text": "，监听器前缀为 "
              },
              {
                "kind": "Name",
                "text": "http://localhost:8888/Automation/MyApp/"
              },
              {
                "kind": "Text",
                "text": ".\n                该服务提供以下这些HTTP URL：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "GET http://localhost:8888/Automation/MyApp/Controls"
                      },
                      {
                        "kind": "Text",
                        "text": ": 调用 "
                      },
                      {
                        "kind": "Name",
                        "text": "DumpControlTree"
                      },
                      {
                        "kind": "Text",
                        "text": " 在 UI 线程上，当 "
                      },
                      {
                        "kind": "Name",
                        "text": "CanDumpControlTree"
                      },
                      {
                        "kind": "Text",
                        "text": " 为 true。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "GET http://localhost:8888/Automation/MyApp/Dom"
                      },
                      {
                        "kind": "Text",
                        "text": ": 调用 "
                      },
                      {
                        "kind": "Name",
                        "text": "DumpDomTree"
                      },
                      {
                        "kind": "Text",
                        "text": " 在 UI 线程上，当 "
                      },
                      {
                        "kind": "Name",
                        "text": "CanDumpDomTree"
                      },
                      {
                        "kind": "Text",
                        "text": " 为 true。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "POST http://localhost:8888/Automation/MyApp/IO"
                      },
                      {
                        "kind": "Text",
                        "text": "：将 UTF-8 请求体传递给 "
                      },
                      {
                        "kind": "Name",
                        "text": "RunIOCommand"
                      },
                      {
                        "kind": "Text",
                        "text": " 不带窗口 id。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "POST http://localhost:8888/Automation/MyApp/IO/<windowId>"
                      },
                      {
                        "kind": "Text",
                        "text": "：将 UTF-8 请求体传递给 "
                      },
                      {
                        "kind": "Name",
                        "text": "RunIOCommand"
                      },
                      {
                        "kind": "Text",
                        "text": " 带窗口 id 路径段。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                窗口 id 是……之后的路径段 "
              },
              {
                "kind": "Name",
                "text": "IO"
              },
              {
                "kind": "Text",
                "text": "，而不是查询参数。\n                所有其它方法、路径以及格式错误的 "
              },
              {
                "kind": "Name",
                "text": "IO"
              },
              {
                "kind": "Text",
                "text": " 后缀都会返回带文本响应的 HTTP 404。\n                HTTP 包装器仅在……时才返回 404 "
              },
              {
                "kind": "Name",
                "text": "CanRunIOCommands"
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Name",
                "text": "Disabled"
              },
              {
                "kind": "Text",
                "text": "; both "
              },
              {
                "kind": "Name",
                "text": "Enabled"
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Name",
                "text": "ExitOnly"
              },
              {
                "kind": "Text",
                "text": " 调用 "
              },
              {
                "kind": "Name",
                "text": "RunIOCommand"
              },
              {
                "kind": "Text",
                "text": ".\n                成功的IO命令解析返回 "
              },
              {
                "kind": "Name",
                "text": "Queued"
              },
              {
                "kind": "Text",
                "text": "；这表示命令已被接受并投递到 UI 线程，并不意味着所有可见效果都已完成。\n                语法错误、命令错误以及 "
              },
              {
                "kind": "Name",
                "text": "ExitOnly"
              },
              {
                "kind": "Text",
                "text": " 拒绝都会以……开头的文本形式同步返回 "
              },
              {
                "kind": "Name",
                "text": "!"
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "启动服务",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                调用 "
              },
              {
                "kind": "Name",
                "text": "StartWindowsHttpAutomationService"
              },
              {
                "kind": "Text",
                "text": " 来自 "
              },
              {
                "kind": "Name",
                "text": "GuiMain"
              },
              {
                "kind": "Text",
                "text": "，在设置函数安装好当前原生控制器之后、进入应用程序事件循环之前。\n                每个调用……的代码路径 "
              },
              {
                "kind": "Name",
                "text": "StartWindowsHttpAutomationService"
              },
              {
                "kind": "Text",
                "text": " 稍后都必须调用 "
              },
              {
                "kind": "Name",
                "text": "StopWindowsHttpAutomationService"
              },
              {
                "kind": "Text",
                "text": " （在原生控制器或替换的自动化服务被拆除之前）。\n                跳过 stop 会泄漏进程级的 HTTP 服务。\n                请使用局部守卫或等效的 try/catch，使 stop 在正常返回与异常时都能在 start 之后运行。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                普通 Windows 应用程序可以在……之前启动该服务 "
              },
              {
                "kind": "Name",
                "text": "GetApplication()->Run"
              },
              {
                "kind": "Text",
                "text": ":\n                "
              },
              {
                "kind": "Program",
                "code": "#include \"../../../Source/PlatformProviders/Windows/WinNativeWindow.h\"\n\nusing namespace vl;\nusing namespace vl::presentation;\nusing namespace vl::presentation::controls;\n\nclass WindowsHttpAutomationServiceScope\n{\npublic:\n    WindowsHttpAutomationServiceScope(const WString& applicationName, vint port)\n    {\n        windows::StartWindowsHttpAutomationService(applicationName, port);\n    }\n\n    ~WindowsHttpAutomationServiceScope()\n    {\n        windows::StopWindowsHttpAutomationService();\n    }\n};\n\nvoid GuiMain()\n{\n    demo::MainWindow window;\n    window.ForceCalculateSizeImmediately();\n    window.MoveToScreenCenter();\n\n    WindowsHttpAutomationServiceScope httpAutomationService(\n        WString::Unmanaged(L\"Automation/MyApp\"),\n        8888);\n    GetApplication()->Run(&window);\n}\n\nint CALLBACK WinMain(HINSTANCE, HINSTANCE, LPSTR, int)\n{\n    return SetupHostedWindowsDirect2DRenderer();\n}",
                "language": "c++"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                重复调用不会创建多个监听器。\n                Windows 实现会保留一个进程级 HTTP 服务，直到…… "
              },
              {
                "kind": "Name",
                "text": "StopWindowsHttpAutomationService"
              },
              {
                "kind": "Text",
                "text": " 将其停止。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "设置函数用例",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                设置函数决定……期间哪个控制器与服务处于活动状态 "
              },
              {
                "kind": "Name",
                "text": "GuiMain"
              },
              {
                "kind": "Text",
                "text": " 运行。\n                在决定用户代码是否必须替换另一个自动化服务时，请参考以下情形：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "SetupWindowsGDIRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": ": 安装 "
                      },
                      {
                        "kind": "Name",
                        "text": "WindowsAutomationService"
                      },
                      {
                        "kind": "Text",
                        "text": ". 使用 "
                      },
                      {
                        "kind": "Name",
                        "text": "StartWindowsHttpAutomationService"
                      },
                      {
                        "kind": "Text",
                        "text": " 直接用于多窗口控件树与 IO。DOM 路由通常不可用。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "SetupWindowsDirect2DRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": "：自动化行为与 "
                      },
                      {
                        "kind": "Name",
                        "text": "SetupWindowsGDIRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": "，使用 Direct2D 渲染器。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "SetupHostedWindowsGDIRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": ": 安装 "
                      },
                      {
                        "kind": "Name",
                        "text": "WindowsAutomationServiceHosted"
                      },
                      {
                        "kind": "Text",
                        "text": "。直接使用 HTTP 服务。IO 应使用 "
                      },
                      {
                        "kind": "Name",
                        "text": "/IO"
                      },
                      {
                        "kind": "Text",
                        "text": " （不带窗口 id），因为被托管的子窗口与弹出层都在主窗口之下表示。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "SetupHostedWindowsDirect2DRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": "：自动化行为与 "
                      },
                      {
                        "kind": "Name",
                        "text": "SetupHostedWindowsGDIRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": "，使用 Direct2D 渲染器。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Name",
                        "text": "SetupRawWindowsGDIRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": ": 安装 "
                      },
                      {
                        "kind": "Name",
                        "text": "WindowsAutomationService"
                      },
                      {
                        "kind": "Text",
                        "text": " 用于原生窗口控制器。如果原始进程是远程协议渲染器且拥有一个 "
                      },
                      {
                        "kind": "Name",
                        "text": "GuiRemoteRendererSingle"
                      },
                      {
                        "kind": "Text",
                        "text": "，替代 "
                      },
                      {
                        "kind": "Name",
                        "text": "WindowsAutomationServiceRenderer"
                      },
                      {
                        "kind": "Text",
                        "text": " 来暴露渲染器 DOM 与渲染器侧 IO。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
