          },
          {
            "kind": "Paragraph",

              {

                "content": [
                  {
                    "kind": "Text",
                    "text": "0"

                  {

                    "kind": "Text",

                  {

              {
                "kind": "Text",
                "text": "\n                插值函数计算在给定动画进度时字段应到达的位置。\n                如果希望使用线性插值函数，\n                直接返回参数即可。\n                这样的函数通常写成：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",

                      {

                        "kind": "PageLink",

                          {
                            "kind": "Text",

                      {
                        "kind": "Strong",

                          {
                            "kind": "Text",
                            "text": "[$1]"

                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",

                      {
                        "kind": "Text",

                        "kind": "PageLink",

                "kind": "Text",
                "text": "\n                有时让字段在前半段加速、后半段减速会更好，\n                这样的函数可以很方便地用以下方式创建：\n                "
              },

                "kind": "Program",

            ]

      {
        "kind": "Topic",
        "title": "Running an Animation",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Animation/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 生成的类中，\n                有一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CreateAnimation(state, time)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数，\n                意思是动画从当前状态开始，\n                并朝……运行 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "state"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在……中 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "time"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " milliseconds.\n            "
              }
            ]
          },

            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                调用此函数并不会让动画立刻运行，\n                而是返回一个 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(vl::)presentation::controls::IGuiAnimation^"

              {
                "kind": "Text",
                "text": " object.\n                "
              },

                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 所属的\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(vl::)presentation::controls::GuiInstanceRootObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                控制动画如何运行。\n                此类是所有 UI 的基类\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/root_instance.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    根实例\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                so "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "self.AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "self.KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                可以在 XML 中访问。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 把一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象添加到 UI 对象上，\n                并立即开始动画。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 停止一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已添加到 UI 对象上的……对象，\n                并立即停止动画。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于需要多次在状态间切换的动画（例如鼠标移入移出时的按钮），\n                有一种控制动画的模式：\n                "
              },
              {
                "kind": "Program",
                "code": "<ref.Members><![CDATA[\n    var myAnimation : MyAnimation^ = new MyAnimation(initial_state);\n    var lastAnimation : IGuiAnimation^ = null;\n]]></ref.Members>\n...\nvar newAnimation = myAnimation.CreateAnimation(newState, animationLengthInMilliseconds);\nKillAnimation(lastAnimation);\nlastAnimation = newAnimation;\nAddAnimation(lastAnimation);"
              },
              {
                "kind": "Text",
                "text": "\n                当动画运行中需要把状态迁移到新状态时，\n                这段代码会停止当前正在运行的动画，\n                并用一个新的动画替换它。\n                新动画会把当前状态从所在位置平滑地移动到新状态，\n                视觉上应该很平滑。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以接受 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                而它不会做任何事。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",

        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",

                    "kind": "Text",

                    "kind": "Text",
                    "text": "AddAnimation"

                ]

                "text": " 将导致异常。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                把所有字段拆分到多个动画对象也是可行的。\n                但如果多个字段表示的是同一动画的不同部分，\n                请尽量让所有这些字段共用一个动画，以提高性能。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在\n                "
              },
              {
                "kind": "PageLink",
                "href": "https://github.com/vczh-libraries/Release/blob/master/SampleForDoc/GacUI/XmlRes/kb_animation/Resource.xml",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    本教程工程\n                "

              },
              {
                "kind": "Text",
                "text": "，\n                一个按钮由 4 种颜色控制，\n                这些颜色在同一个动画中变化，因为它们表示同一动画的不同部分。\n                因此只需要一个 "

                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Animation/>"
