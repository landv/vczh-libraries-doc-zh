      {
        "kind": "Topic",
        "title": "正确使用 IItemProvider::RequestView",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                列表控件可以重写 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OnStyleInstalled"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 来自 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiListControl"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n                当一个项模板实例被绑定到某个列表项时，会调用此方法。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                新的列表控件类通常为项定义新的项模板类。\n                新的项模板类添加新属性，以定义该新列表控件的项的外观。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可以定义一个或多个视图来读写此特定列表控件类的项细节。\n                然后列表控件类可以调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RequestView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " （使用唯一标识字符串）来获取视图，\n                把视图中的数据绑定到项模板实例。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如：\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiTextList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 定义了 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ITextItemView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 视图，用于把 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Checked"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性添加到项上。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IItemArranger"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也可以定义自己的视图。\n                例如，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewColumnItemArranger"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 定义 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IColumnItemView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                从列表控件读取列，\n                用于渲染列头。\n                任何使用……的列表控件 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewColumnItemArranger"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 都应确保\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IColumnItemView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 得到实现，并且可以从……访问 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IItemProvider::RequestView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                你可以出于任何目的定义自己的视图，\n                只要它仅用于读写项的细节。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "项目数据绑定",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可数据绑定的列表控件可以从实现……的项源读写项 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr<IValueEnumerable>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n                该对象也可以实现任何派生接口，例如：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IValueReadonlyList"

                    "kind": "ContentListItem",

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IValueList"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IValueObservableList"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                如果项源实现了 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValueObservableList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                那么当项改变时，列表控件预期会自动更新。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/properties.html#Property-Name-func-data-Object-PROPERTY-TYPE",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    可读属性的类型\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/properties.html#Writable-Property-Name-func-data-Object-value-PROPERTY-TYPE-isWrite-bool-PROPERTY-TYPE",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    可写属性的类型\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                可以用来让用户告诉你如何从项中访问细节。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::controls::ReadProperty"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::controls::WriteProperty"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                可以在 C++ 中用于这些属性类型。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "示例",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                强烈建议你先阅读……的源代码\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiTextList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiBindableTextList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                再创建你自己的列表控件类。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
