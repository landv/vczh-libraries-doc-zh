                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "右侧"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 字段仍描述按住按钮的状态。\n                    请使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "button"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 来区分触发事件的按钮，包括在松开按钮时。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当为某个按钮迁移处理程序时，请订阅对应的新事件并过滤 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "arguments.button"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "。\n                    例如，把原对 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "leftButtonDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 的订阅替换为：\n                    \n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "composition->GetEventReceiver()->mouseDown.AttachLambda(\n    [](GuiGraphicsComposition* sender, GuiMouseEventArgs& arguments)\n    {\n        if (arguments.button != NativeMouseButton::Left) return;\n        // Handle the left button press.\n    });",
                    "language": "c++"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    在 GacUI 资源 XML 中，替换 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ev.leftButtonDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 与 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ev.mouseDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " ，并在 Workflow 中应用相同的过滤：\n                    \n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Bounds>\n    <ev.mouseDown-eval><![CDATA[\n        if (arguments.button == NativeMouseButton::Left)\n        {\n            arguments.handled = true;\n        }\n    ]]></ev.mouseDown-eval>\n</Bounds>",
                    "language": "xml"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    一次双击会触发 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseUp"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseDoubleClick"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，然后 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseUp"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiItemMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiNodeMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 继承 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "button"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "。\n                    位于 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiListControl"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 上的原有按钮专属 Item 事件，以及位于 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiVirtualTreeListControl"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 上的 Node 事件都会被保留。\n                    请通过组合事件处理 Mouse4 与 Mouse5。\n                "
                  }
                ]
              }
            ]

                    "text": " 等接收单独修饰符的方法，也都要在按键参数之前加上该参数。\n                    "

                  },
                  {
                    "kind": "Text",

                  {
                    "kind": "Strong",
                    "content": [

                        "kind": "Text",
                        "text": "_alt"

                    "kind": "Text",

                        "kind": "Text",
                        "text": "nullptr"

                  },
                  {

                    "text": "。\n                    在几乎所有情况下，此参数的值都无关紧要，\n                    通常它是一个元素或一个组合。\n                "

                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    新方法 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsInHostedRendering"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "StartHostedRendering"

                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "

                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "StopHostedRendering"
                      }

                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }

                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    使用 "

                    "content": [

                        "kind": "Text",
                        "text": "GuiGraphicsRenderTarget"

                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 来实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IGuiGraphicsRenderTarget"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " ，从而降低复杂度，\n                    无需费心处理托管或非托管模式，\n                    以及部分裁剪的计算。\n                "
                  }
                ]

            ]
          },
          {
            "kind": "Topic",
            "title": "IGuiGraphicsParagraph",

                    "content": [
                      {
                        "kind": "Text",

                  {
                    "kind": "Text",

                    "content": [
                      {
                        "kind": "Text",
                        "text": "CloseCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 已改为 "

                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EnableCaret"

                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {

                    "content": [
                      {
                        "kind": "Text",

                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },

                  },
                  {
                    "kind": "Text",

              },
              {

                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EnableCaret"

                  },
                  {
                    "kind": "Text",

                    ]
                  },

                    "text": " 以及任何其他文本属性，在渲染内联对象时都应当被忽略。\n                    目前它表示对象是否被选中。你可以选择任意方式来渲染它。\n                "
                  }
                ]
              }
            ]
          },
          {

            "title": "INativeWindow",

                    "content": [
                      {
                        "kind": "Text",

                  },
                  {
                    "kind": "Text",

              },

                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    新方法 "

                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetRenderingOffset"

                  },

                    "text": "，它总是返回 "

                  }
                ]
              },

                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    新方法 "

                  {

                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsRenderingAsActivated"

                  },

                    "kind": "Text",
                    "text": "，它应返回 "

                    "content": [

          {
            "kind": "Topic",

                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    原先九个针对具体按钮的回调被移除：\n                    "

                  {

                              {

                                "text": "MiddleButtonDown"

                          },
                          {
                            "kind": "Text",
                            "text": "，并且 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "RightButtonDown"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 被替换为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MouseDown"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }

                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LeftButtonUp"
                              }

                          },
                          {
                            "kind": "Text",
                            "text": ", "

                          {

                            "content": [
                              {
                                "kind": "Text",
                                "text": "MiddleButtonUp"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "，并且 "

                          {
                            "kind": "Strong",
                            "content": [

                                "kind": "Text",
                                "text": "RightButtonUp"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 被替换为 "

                            "content": [
                              {
                                "kind": "Text",
                                "text": "MouseUp"

                                "kind": "Text",
                                "text": "RightButtonDoubleClick"
                              }

                            "text": " 被替换为 "

                          {

                        ]
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    新的虚回调以按钮作为第一个参数：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "virtual void MouseDown(NativeMouseButton button, const NativeWindowMouseInfo& info);\nvirtual void MouseUp(NativeMouseButton button, const NativeWindowMouseInfo& info);\nvirtual void MouseDoubleClick(NativeMouseButton button, const NativeWindowMouseInfo& info);",
                    "language": "c++"

                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    请更新监听器的重写与原生平台分发，让全部五个按钮都使用这些回调。\n                    将按钮专属行为移入测试，或针对 "

                        "kind": "Text",

                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LeftButtonDown(info)"

                  },

                    "kind": "Text",
                    "text": " 变成 "

                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",

                  {
                    "kind": "Text",
                    "text": "。\n                    在双击的第二次按下时，调用 "

                    "content": [

                        "kind": "Text",
                        "text": "MouseDown"

                  },

                    "kind": "Text",
                    "text": "。\n                    所有鼠标回调都会在 "

                    "content": [
                      {
                        "kind": "Text",
                        "text": "info.osSuper"

                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "。\n                    请随原生事件捕获该状态，并将其传给监听器。\n                "

                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    新回调 "

                    "kind": "Strong",
                    "content": [

                        "kind": "Text",
                        "text": "RenderingAsActivated"

                  },
                  {
                    "kind": "Text",

                    "content": [
                      {
                        "kind": "Text",

                    "content": [

                        "text": "INativeWindow::IsRenderingAsActivated"

                  },
                  {
                    "kind": "Text",
                    "text": " 被更改。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [

                        "kind": "Text",
                        "text": "Closing"

                  },
                  {
                    "kind": "Text",
                    "text": " 被重命名为 "

                    "content": [

                    "kind": "Text",
                    "text": " 以及 "

                    "text": ".\n                    "

                    "content": [

                    "content": [

                    "kind": "Text",
                    "text": " ，即对所有监听器调用；\n                    若没有任何监听器在 "

                    "content": [

                        "kind": "Text",
                        "text": "BeforeClosing"

                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "

                "kind": "Paragraph",

                    "kind": "Text",

                    "text": "\n                    向……添加了一个参数 "
