              "selected": false,

  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "远程协议核心应用",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            远程协议核心应用是一个调用 SetupRemoteNativeController 的普通 GacUI 应用。\n            它变成无头（headless）模式，并被强制进入托管模式。\n            核心不会绘制到操作系统原生窗口；\n            而是通过 vl::inter_process 通道发送 JSON 远程协议包。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            标准的 C++ 实现方式很简洁：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "在某个 INetworkProtocolServer 实现上启动 GuiRemoteProtocolNetworkChannelServer<TServerBase>，例如跨平台的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::async_tcp_socket::SocketHttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "、仅限 Windows 的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::named_pipe::NamedPipeServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，或仅限 Windows 的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "使用 GuiRemoteProtocolLocalChannelClient 把核心连接到该服务器。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "用 GuiRemoteProtocolAsyncJsonChannel 和 GuiRemoteProtocolCoreChannel 包装核心通道。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "把协议传给 SetupRemoteNativeController，通常需先经过 GuiRemoteProtocolFilter 与 GuiRemoteProtocolDomDiffConverter。"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            可移植的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/MiniHttp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 测试路径会创建一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IAsyncSocketServer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，并使用 "
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 并将其注入一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiRemoteProtocolNetworkChannelServer<async_tcp_socket::SocketHttpServer>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 特化。\n            同一个监听器还可以托管一个独立的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SocketHttpServerApi"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 自动化前缀。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            核心客户端应注册为 GacUIRemoteProtocolCoreClientId。\n            由 GuiRemoteProtocolChannelClient 创建的渲染器会声明 GacUIRemoteProtocolChannelName。\n            GuiRemoteProtocolCoreChannel 会从渲染器的 ControllerConnect 事件得知渲染器客户端 id，\n            因此用户代码无需逐个路由远程协议消息。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            通道准入会收到一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Ptr<IJsonChannelClient>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，本地客户端会得到它，网络客户端则得到 null。\n            请保留那个由生产者拥有的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Ptr"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "；在转发或保留本地客户端时也应如此。仅在临时的原始指针操作中使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": ".Obj()"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，并且绝不要根据该原始指针构造新的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Ptr"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个精简的命名管道配置如下所示：\n            "
          },
          {
            "kind": "Program",
            "code": "using namespace vl;\r\nusing namespace vl::presentation;\r\nusing namespace vl::presentation::remoteprotocol;\r\nusing namespace vl::presentation::remoteprotocol::channeling;\r\nusing namespace vl::presentation::remoteprotocol::repeatfiltering;\r\n\r\nclass NamedPipeRemoteCoreServer\r\n    : public GuiRemoteProtocolNetworkChannelServer<inter_process::named_pipe::NamedPipeServer>\r\n{\r\n    using Base = GuiRemoteProtocolNetworkChannelServer<inter_process::named_pipe::NamedPipeServer>;\r\n\r\n    EventObject rendererConnected;\r\n\r\npublic:\r\n    NamedPipeRemoteCoreServer(Ptr<glr::json::Parser> parser, const WString& pipeName)\r\n        : Base(parser, pipeName)\r\n    {\r\n        rendererConnected.CreateManualUnsignal(false);\r\n    }\r\n\r\n    void WaitForRenderer()\r\n    {\r\n        rendererConnected.Wait();\r\n    }\r\n\r\nprotected:\r\n    inter_process::WaitForClientResult OnClientConnected(\r\n        vint clientId,\r\n        const IJsonChannelClient::ChannelNameList& availableChannels,\r\n        Ptr<IJsonChannelClient> localClient) override\r\n    {\r\n        if (localClient)\r\n        {\r\n            return inter_process::WaitForClientResult::Accept;\r\n        }\r\n\r\n        if (availableChannels.Contains(WString::Unmanaged(GacUIRemoteProtocolChannelName)))\r\n        {\r\n            rendererConnected.Signal();\r\n            return inter_process::WaitForClientResult::Accept;\r\n        }\r\n        return inter_process::WaitForClientResult::Reject;\r\n    }\r\n};\r\n\r\nvoid StartNamedPipeRemoteCore()\r\n{\r\n    auto jsonParser = Ptr(new glr::json::Parser);\r\n    NamedPipeRemoteCoreServer server(jsonParser, L\"GacUIRemoteProtocolNamedPipe\");\r\n    server.Start();\r\n\r\n    auto coreClient = Ptr(new GuiRemoteProtocolLocalChannelClient(jsonParser));\r\n    auto coreClientId = server.ConnectLocalClient(coreClient);\r\n    CHECK_ERROR(coreClientId == GacUIRemoteProtocolCoreClientId, L\"Failed to register the core client.\");\r\n\r\n    server.WaitForRenderer();\r\n\r\n    GuiRemoteProtocolAsyncJsonChannel asyncChannel(coreClient->GetProtocolChannel());\r\n    GuiRemoteProtocolCoreChannel coreProtocol(\r\n        coreClient.Obj(),\r\n        &asyncChannel,\r\n        L\"MyRemoteCore.exe\",\r\n        asyncChannel.GetRemoteEventProcessor());\r\n\r\n    GuiRemoteProtocolFilter filteredProtocol(&coreProtocol);\r\n    GuiRemoteProtocolDomDiffConverter diffProtocol(&filteredProtocol);\r\n    SetupRemoteNativeController(&diffProtocol);\r\n\r\n    server.Stop();\r\n}",
            "language": "c++"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            GuiMain 仍然会创建并运行 GacUI 窗口。\n            如果 UI 在远程服务器存活期间抛出异常，\n            请通过 IJsonLocalChannelServer::BroadcastError 发送该错误，让渲染器停止而不是继续等待更多数据包。\n            生产服务器还可以拒绝不提供 GacUIRemoteProtocolChannelName 的客户端、断开之前的渲染器，\n            或在替换渲染器时调用 GuiRemoteProtocolCoreChannel::DetachRenderer。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            参见 "
          },
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/GacUI/tree/master/Test/GacUISrc/RemotingTest_Core",
            "content": [
              {
                "kind": "Text",
                "text": "RemotingTest_Core"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            其中包含完整的命名管道（"
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/Pipe"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "）、Windows HTTP.sys/WinHTTP（"
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/Http"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "）以及可移植 Mini HTTP（"
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/MiniHttp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "）实现。\n        "
          }
        ]
      }
    ]
  }
};
