                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "为文本应用样式",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                控件模板用于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DocumentLabel"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DocumentViewer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也可以指定一个默认样式。\n                例如，这里是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DarkSkin"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "' 的默认样式为这两个控件：\n                "
              },
              {
                "kind": "Program",
                "code": "<Style name=\"#Default-Override\">\n    <color>#FFFFFF</color>\n</Style>\n<Style name=\"#Selection-Override\">\n    <color>#FFFFFF</color>\n    <bkcolor>#007ACC</bkcolor>\n</Style>"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当文档加载到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DocumentLabel"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DocumentViewer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                所有强制默认样式（控件的字体、控件模板的默认样式、预定义和覆盖样式）将按以下方式合并。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当我们说 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A + B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                这意味着我们首先使用样式 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                然后使用所有属性在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 覆盖先前的结果，\n                并最终获得一个合并的样式。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                显然，从左到右或从右到左的关联没有区别。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "T"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "D"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 表示 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "控件的 Font 属性"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "控件模板"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "文档"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "。\n                例如，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "#Default[C]"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 表示 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Font"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 控件的属性，\n                包含除……之外的所有内容 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "color"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "bkcolor"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "第一轮"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ": 当文档分配给控件时\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "#Default"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " = #Default[D] + #Default-override[D] + #Default[C] + #Default-override[T]"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "#Selection"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " = #Selection[D] + #Selection-override[D] + #Selection-override[T]"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "#Context"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " = #Context[D] + #Context-override[D] + #Context-override[T]"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "#NormalLink"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " = #NormalLink[D] + #NormalLink-override[D] + #NormalLink-override[T]"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "#ActiveLink"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " = #ActiveLink[D] + #ActiveLink-override[D] + #ActiveLink-override[T]"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                我们会看到，\n                控件中的配置和控件模板具有更高的优先级。\n                如果一个文档想要在某些文本上应用样式，\n                它应该明确指定（参见 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Content>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " （而不是尝试覆盖预定义样式）。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "第二轮"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ": 当文档被显示时：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "正常文本"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": #Default"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "hyperlink"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": #Default + #NormalLink"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "活动超链接"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": #Default + #ActiveLink"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "选定的普通文本"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": #Default + #Selection"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "选中的超链接"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": #Default + #NormalLink + #Selection"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "选中的活动超链接"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": #Default + #ActiveLink + #Selection"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                活动超链接是鼠标光标下的超链接。\n                超链接可以指定其自己的正常样式和活动样式，\n                但如果未指定，\n                它们变成 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "#NormalLink"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "#ActiveLink"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "空格字符",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当标签之间有空格时，\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "如果有其他字符，则所有空格（包括前导和尾随空格）都将被保留。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "如果只有空格字符，它们都将被忽略。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如，在本文段中：\n                "
              },
              {
                "kind": "Program",
                "code": "<p>\n    <nop>This is a book.<br/></nop>\n    <nop>It is about GacUI!<br/></nop>\n</p>"
              },
              {
                "kind": "Text",
                "text": "\n                该文本是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "This is a book.\\r\\nIt is about GacUI!\\r\\n"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如，但在此段落中：\n                "
              },
              {
                "kind": "Program",
                "code": "<p>\n    This is a book.\n    It is about GacUI!\n</p>"
              },
              {
                "kind": "Text",
                "text": "\n                该文本是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\\r\\n[many-spaces]This is a book.\\r\\n[many-spaces]It is about GacUI!\\r\\n[many-spaces]"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<nop/>...<br/><nop/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " pattern 是指定段落中行的强烈建议。\n                如果只有一行，\n                just skip <br/>.\n            "
              }
            ]
          }
        ]
      },
      {

              {

              {
