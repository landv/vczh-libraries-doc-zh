<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Root Instance -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "gacui",
    "xmlres",
    "instance",
    "root_instance"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "GacUI",
      "selected": false,
      "path": [
        "gacui",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "GacUI XML 资源",
          "selected": false,
          "path": [
            "gacui",
            "xmlres",
            "home"
          ],
          "subNodes": [
            {
              "icon": "-",
              "name": "<Instance>",
              "selected": false,
              "path": [
                "gacui",
                "xmlres",
                "tag_instance"
              ],
              "subNodes": [
                {
                  "icon": " ",
                  "name": "根实例",
                  "selected": true,
                  "path": [
                    "gacui",
                    "xmlres",
                    "instance",
                    "root_instance"
                  ]
                },
                {
                  "icon": " ",
                  "name": "子实例",
                  "selected": false,
                  "path": [
                    "gacui",
                    "xmlres",
                    "instance",
                    "child_instances"
                  ]
                },
                {
                  "icon": " ",
                  "name": "属性",
                  "selected": false,
                  "path": [
                    "gacui",
                    "xmlres",
                    "instance",
                    "properties"
                  ]
                },
                {
                  "icon": " ",
                  "name": "事件",
                  "selected": false,
                  "path": [
                    "gacui",
                    "xmlres",
                    "instance",
                    "events"
                  ]
                },
                {
                  "icon": " ",
                  "name": "命名空间",
                  "selected": false,
                  "path": [
                    "gacui",
                    "xmlres",
                    "instance",
                    "namespaces"
                  ]
                },
                {
                  "icon": " ",
                  "name": "实例继承",
                  "selected": false,
                  "path": [
                    "gacui",
                    "xmlres",
                    "instance",
                    "inheriting"
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "根实例",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Root 实例是直接在一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Instance/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            其标签名称不以“ref.”开头的。\n            必须恰好有一个根实例在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Instance/>"
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            根实例的类型是此 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Instance/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            创建一个类：\n            "
          },
          {
            "kind": "Program",
            "code": "namespace helloworld\n{\n    class MainWindow : presentation::controls::GuiWindow\n    {\n        new*(){}\n    }\n}"
          },
          {
            "kind": "Text",
            "text": "\n            以下 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Instance/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 预期：\n            "
          },
          {
            "kind": "Program",
            "code": "<Instance name=\"MainWindowResource\">\n  <Instance ref.Class=\"helloworld::MainWindow\">\n    <Window/>\n  </Instance>\n</Instance>"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IMPORTANT"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ": 生成的实例构造函数始终返回一个原始指针。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            仅 "
          },
          {
            "kind": "PageLink",
            "href": "/workflow/running/invoking3.html",
            "content": [
              {
                "kind": "Text",
                "text": "可继承的类"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以用作根实例的类型。\n            根实例的类型也必须具有无参数的构造函数。\n            但 GacUI 也知道如何创建 UI 对象，\n            so "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Window/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 也是一个有效的根实例类型，即使它没有默认构造函数。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这里列出了有效的根实例类型：\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<Window>",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                窗口是可以在您的操作系统中显示的控件。\n                与其他控件不同，它不需要有父控件。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                有一些其他从Window继承的控件，\n                但根实例唯一有效的类型是 Window。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<TabPage>",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                TabPage 是 Tab 的子控件。\n                当一个 TabPage 被添加到 Tab 中时，\n                包含TabPage的标签页标题。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Text"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性将显示在选项卡中。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于应用程序来说，这非常常见，\n                Tab 中的 TabPages 是根据上下文动态创建的。\n                例如，\n                向导中的页面可以在您选择某些页面中的不同选项时进行更改。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在这种情况下，\n                通过创建 TabPages 的实例，\n                通过数据绑定和MVVM模式的强大功能，\n                组织应用程序非常容易。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<RibbonTabPage>",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                RibbonTabPage 是 RibbonTab 的子控件。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<CustomControl>",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                自定义控件可以是任何控件的子控件。\n                自定义控件本身不提供任何功能，\n                这是另一种组织应用程序多个实例的方式。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当应用程序的内容也根据上下文动态控制时，\n                但是 Tab 不符合设计。\n                对于这些场景，\n                自定义控件可以通过少量的 Workflow 脚本进行组织，\n                这也非常方便。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "模板和 <ThemeTemplates>",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                所有控件模板和项模板都可以是根项的类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果你已经为多个甚至所有控件创建了新的设计，\n                您可以使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ThemeTemplates/>"
                  }
                ]
              },
              {
                "kind": "PageLink",
                "href": "/gacui/kb/dtemplates.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "像这样"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                使您的设计成为应用程序的默认设计。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "另一个实例",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                允许一个实例从另一个实例继承。\n                参见 "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/namespaces.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "命名空间"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                以及 "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/inheriting.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "实例继承"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                以了解更多详情。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "其他",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                任何具有默认构造函数的可继承类都可以作为根实例的类型。\n                您可以在中定义一个类 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Script/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 并且将其用作实例。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这是创建配置的典型场景。\n                通过将配置定义为 Workflow 类，\n                您可以为该配置创建不同的选项作为不同的实例。\n                或创建另一个类，将固定数量的选项作为属性。\n                并将选项详细信息分配给这些属性。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该 "
              },
              {
                "kind": "PageLink",
                "href": "https://github.com/vczh-libraries/Release/blob/master/SampleForDoc/GacUI/XmlRes/kb_animation/Resource.xml",
                "content": [
                  {
                    "kind": "Text",
                    "text": "动画示例"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                是一个很好的例子。\n                请检出并查看如何 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AnimationState"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AnimationConfig"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RadioButtonAnimationConfig"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被使用，\n                它们构成了使用实例作为配置的一种非常常见的模式。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
