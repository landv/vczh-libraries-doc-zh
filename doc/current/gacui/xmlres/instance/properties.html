                "kind": "Text",
                "text": " 属性赋值，\n                GacUI 对不同类型的属性值进行不同的解释。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这里是各种类型及其如何解释属性值的列表：\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "原始类型",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "对于字符串，值变为字符串字面量。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "对于布尔值、整数和数字，它必须是有效的 "
                          },
                          {
                            "kind": "PageLink",
                            "href": "/workflow/lang/expr.html",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Workflow 字面量"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "对于日期时间，必须为“YYYY-MM-DD hh:mm:ss.sss”"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "结构体",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    值必须包含多个“FIELD:VALUE”。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "FIELD"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是结构体中的字段名，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "VALUE"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是一个有效的 "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/workflow/lang/expr.html",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Workflow 表达式"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 具有兼容类型。\n                    多个项由空格分隔。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    它实际上是一个 "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/workflow/lang/expr.html#Constructor-expression-a-b-c-a-x-b-y-c-z-",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "工作流构造函数表达式"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    不带外层花括号。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "枚举",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "对于枚举，值必须是枚举项之一。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "对于标志，多个枚举项名称用“|”分隔。"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "可空类型",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    默认值为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    但你不能显式赋值 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 在 XML 中。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "类或接口",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    一个对象应具备这些属性，\n                    但是由于对象不能在XML属性中创建，\n                    所以你需要使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<att.NAME/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    如果对象类型恰好是属性类型，\n                    您可以使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "_"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 作为该对象的标签名。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    上述规则也适用于基本类型，\n                    例如：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Window Text=\"The Title\"/>"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    等价于\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Window>\n  <att.Text>\n    <String>The Title</String>\n  </att.Text>\n</Window>"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    以及\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Window>\n  <att.Text>\n    <_>The Title</_>\n  </att.Text>\n</Window>"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "集合",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这些属性期望为零个或多个值。\n                    但是由于集合不能在XML属性中创建，\n                    所以你需要使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<att.NAME/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    如果对象类型恰好是项目类型，\n                    您可以使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "_"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 作为该对象的标签名。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    例如：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Table>\n  <att.Rows>\n    <CellOption>composeType:MinSize</CellOption>\n    <CellOption>composeType:Percentage percentage:1.0</CellOption>\n  </att.Rows>\n</Table>"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    等价于\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Table>\n  <att.Rows>\n    <_>composeType:MinSize</_>\n    <_>composeType:Percentage percentage:1.0</_>\n  </att.Rows>\n</Table>"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "控件/项模板：func(data: Object): TEMPLATE_CLASS*",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    值必须是类型名称，\n                    或多个类型名称，用“;”分隔。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    一个类型名称可以是类的完整名称，\n                    喜欢 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "my::namespace::MyClass"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    或者使用带有属性命名空间设置的等效标签名，\n                    喜欢 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "my:MyClass"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当存在时 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Instance xmlns:my=\"my::namespace::*\"/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    对于项模板，\n                    可以有一个构造函数参数，\n                    通常是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<ref.Parameter/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    项目类型未知，\n                    因为对于一个可绑定的列表控件，\n                    每个项目可以是不同类型的。\n                    如果有多个项目模板具有不同的构造函数参数类型，\n                    每个构造函数参数类型将被测试，直到找到第一个与实际项类型兼容的。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    上述测试对于没有构造函数参数的项模板总是成功。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这是在列表控件中为不同项应用不同项模板的常见模式。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "属性名称：func(data: Object): PROPERTY_TYPE",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当存在一个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "env.ItemType"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 属性\n                    在具有此属性的对象上，或在任何父对象上，\n                    在运行时检索属性值的对象类型预期为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "env.ItemType"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    在这种情况下，\n                    此属性的值必须为有效的属性或字段名称。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当也存在一个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "env.ItemName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 属性，\n                    此属性的值也可以是一个有效的\n                    "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/workflow/lang/expr.html",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Workflow 表达式"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "env.ItemName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 变成一个有效的标识符，用于表示要获取属性的对象。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    例如：\n                    当您将集合绑定到一个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<BindableDataGrid/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    不同的列可以配置为显示集合项的不同属性，例如：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<BindableDataGrid env.ItemType=\"demo::MyDataItem^\" env.ItemName=\"itemToBind\">\n  <att.Columns>\n    <DataColumn Text=\"Name\" Size=\"120\">\n      <att.TextProperty>Name</att.TextProperty>\n    </DataColumn>\n\n    <DataColumn Text=\"Gender\" Size=\"80\">\n      <att.TextProperty>demo::ToString(itemToBind.Gender)</att.TextProperty>\n    </DataColumn>\n  </att.Columns>\n</BindableDataGrid>"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "可写属性名称：func(data: Object, value: PROPERTY_TYPE, isWrite: bool): PROPERTY_TYPE",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "可写属性名称"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 非常类似于 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "属性名称"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    唯一的区别是，\n                    无论属性值是标识符还是表达式，\n                    它必须是可赋值的。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "注意："
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 结构体字段和只读属性不可赋值。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "<BindableDataGrid> 列属性",
            "content": [
              {
                "kind": "Topic",
                "title": "presentation::controls::list::IDataVisualizerFactory^",
                "content": [
                  {
                    "kind": "Paragraph",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        A "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IDataVisualizerFactory"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 属性与……非常相似 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "项目模板"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        没有输入对象来选择可视化工具。\n                        相反，\n                        多个可视化器全部创建并嵌套在一起，\n                        以便不同的可视化工具可以共享一些装饰，例如边框。\n                        第一个是最内层的一个\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "Paragraph",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        每个可视化器必须从 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "presentation::templates::GuiGridVisualizerTemplate"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "。\n                        该 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CellValue"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 属性将根据……赋值 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ValueProperty"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （该列的）属性。\n                    "
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Topic",
                "title": "presentation::controls::list::IDataEditorFactory^",
                "content": [
                  {
                    "kind": "Paragraph",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        A "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IDataEditorFactory"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 属性与……非常相似 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "项目模板"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        没有输入对象可供选择编辑器。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "Paragraph",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        每个编辑器必须从 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "presentation::templates::GuiGridEditorTemplate"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "。\n                        该 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CellValue"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 属性将根据……赋值 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ValueProperty"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （该列的）属性。\n                    "
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Topic",
                "title": "presentation::controls::list::IDataFilter^",
                "content": [
                  {
                    "kind": "Paragraph",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        一个……的属性值 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IDataFilter^"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 属性预期是一个\n                        "
                      },
                      {
                        "kind": "PageLink",
                        "href": "/workflow/lang/expr.html#Ordered-lambda-expression-1-2-",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Workflow lambda 表达式"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        第一个参数是行对象\n                        这是其中的一项 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ItemSource"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 列表控件的集合。\n                        返回 true 以使行可见。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "Paragraph",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "注意"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        对于 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "-eval"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 绑定，\n                        表达式必须返回一个实现了……的对象 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IDataFilter"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 接口中。\n                    "
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Topic",
                "title": "presentation::controls::list::IDataSorter^",
                "content": [
                  {
                    "kind": "Paragraph",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        一个……的属性值 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IDataSorter^"
                          }
                        ]
                      },
