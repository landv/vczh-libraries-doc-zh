          {
            "kind": "Topic",
            "title": "GacUI.xml",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    GacUI 允许资源文件依赖于其他资源文件。\n                    GacUI.xml 放在根文件夹中。\n                    对 GacUI.xml 运行 GacBuild.ps1，它会递归搜索所有资源文件。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    在本教程中，我们只有一个资源文件，\n                    即 UI\\Resource.xml。\n                    在这种情况下，GacUI.xml 的内容非常简单：\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "<GacUI/>",
                    "language": "xml"
                  }
                ]
              }
            ]
          },

            "kind": "Topic",
            "title": "UI\\Resource.xml",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    在这个文件中，我们要指定以下信息：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "生成的 C++ 文件的存放位置"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "生成的二进制资源文件的存放位置"

                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "包含 \"GacUI.h\"，因为我们不需要运行时反射"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "名字为 HelloWorld"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "描述 HelloWorld 窗口"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<Resource>\n<Folder name=\"GacGenConfig\">\n    <Folder name=\"Cpp\">\n    <Text name=\"SourceFolder\">Source</Text>\n    <Text name=\"Resource\">..\\HelloWorld.bin</Text>\n    <Text name=\"NormalInclude\">GacUI.h</Text>\n    <Text name=\"Name\">HelloWorld</Text>\n    </Folder>\n</Folder>\n<Folder name=\"MainWindow\">\n    <Instance name=\"MainWindowResource\">\n        <Instance ref.CodeBehind=\"false\" ref.Class=\"helloworld::MainWindow\">\n            <Window Text=\"Hello, world!\" ClientSize=\"x:480 y:320\">\n                <att.BoundsComposition-set PreferredMinSize=\"x:480 y:320\"/>\n                <Label Text=\"Welcome to GacUI Library!\">\n                    <att.Font>fontFamily:\"Segoe UI\" size:32 antialias:true</att.Font>\n                </Label>\n            </Window>\n        </Instance>\n    </Instance>\n</Folder>\n</Resource>",
                    "language": "xml"
                  }
                ]
              }
            ]
          }
        ]

                "text": "\n                本项目不需要运行时反射，\n                所以你必须定义一个空的 "

          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "#define GAC_HEADER_USE_NAMESPACE\n#include \"UI/Source/HelloWorld.h\"\n\nusing namespace vl::collections;\nusing namespace vl::stream;\n\nvoid GuiMain()\n{\n    {\n        FileStream fileStream(L\"HelloWorld.bin\", FileStream::ReadOnly);\n        GetResourceManager()->LoadResourceOrPending(fileStream);\n    }\n    helloworld::MainWindow window;\n    window.MoveToScreenCenter();\n    GetApplication()->Run(&window);\n}",
