                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CaretEnd"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性\n                表示选择范围。\n                如果在从右到左的文本中从右向左拖动鼠标，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CaretBegin"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 大于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CaretEnd"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetCaret"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 更改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CaretBegin"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CaretEnd"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 同时。\n                取消选择并移动光标，\n                只需将这两个属性设置为相同的值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EnsureCaretVisible"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将文本框滚动到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CaretEnd"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CalculateCaretFromPoint"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回位置附近的最近光标。\n                坐标原点是文档的左上角。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetCaretBounds"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回光标的当前位置。\n                它是一个带有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "zero"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 宽度，\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "y1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "y2"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 组件表示垂直光标线的位置。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "选择",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SelectionText"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SelectionModel"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性\n                返回文档的选择内容，以纯文本或文档片段形式。\n                分配它们的行为相当于调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EditRun"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EditText"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                在选择项上。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SelectAll"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 设置选择为整个文档。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "使用文档或文本进行初始化",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LoadTextAndClearUndoRedo"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LoadDocumentAndClearUndoRedo"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 建议用所需内容初始化或重置编辑器控件。\n                这些函数以优化的性能加载新内容到控件，并清除所有撤销和重做历史记录。\n                撤销和重做功能可用于未来的编辑。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "分配文档和文档项",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                分配一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(vl::)presentation::DocumentModel"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 到该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Document"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性\n                更新控件中的全部内容\n                并将光标移动到文档的开头。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于文档中如以下的任何文档项占位符：\n                "
              },
              {
                "kind": "Program",
                "code": "<object name=\"SOMETHING\"/>"
              },
              {
                "kind": "Text",
                "text": "\n                A "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<DocumentItem/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 具有完全相同的名称\n                在任何文档编辑器控件中\n                将此标签中的任何内容嵌入到文档的占位符中：\n                "
              },
              {
                "kind": "Program",
                "code": "<DocumentViewer>\n  <DocumentItem Name=\"SOMETHING\">\n    <Button Text=\"SOMETHING\"/>\n  </DocumentItem>\n</DocumentViewer>"
              },
              {
                "kind": "Text",
                "text": "\n                仅一个组合或一个控件可以是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<DocumentItem/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                但它可以有任何数量的子组合或控件。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                占位符的大小是组合或控件的最小大小。\n                可以有多个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<DocumentItem/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在一个文档编辑器控件中。\n                如果任何 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<object/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<DocumentItem/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 无法匹配彼此，\n                它被忽略，\n                但 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<object/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 仍会占用一个字符的光标位置。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AddDocumentItem"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RemoveDocumentItem"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetDocumentItems"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                可以在将文档分配给 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Document"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "编辑",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                全部 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Edit*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 方法接受两个光标和内容\n                并用指定内容替换当前文档中指定范围的内容。\n                如果两个光标值相同，\n                它们是插入而不是替换。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EditRun"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 插入或替换为 a "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(vl::)presentation::DocumentMode"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象。\n                如果 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "copy"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 参数被设为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                子节点将不会被重用。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果子节点在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Document"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改而未调用任何 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Edit*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 方法，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NotifyParagraphUpdated(索引, 旧计数, 新计数)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClearUndoRedo"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 必须被调用，\n                这意味着段落cs来自 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "index"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "-th 到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "index+oldCount-1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "-th\n                已被替换为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "newCount"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 段落。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                显然，\n                如果所有更改都发生在同一段落中\n                参数 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NotifyParagraphUpdated(index, 1, 1)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 预期。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "选择、编辑文本和图像",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EditText"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 用多段文本替换文档的一部分。\n                    如果 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "frontSide"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 参数被设为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    它使用指定范围之前字符的文本样式，\n                    否则使用其后的那一个。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EditImage"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 用图像替换文档的一部分。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "编辑和响应超链接",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EditHyperlink"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 将文档的一部分转换为单段落中的超链接。\n                    该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "reference"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 参数是附加到超链接的属性，\n                    当超链接被执行时，\n                    引用的值将被传递给 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ActiveHyperlinkExecuted"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 事件，\n                    或从 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetActiveHyperlinkReference"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当此超链接被激活时。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RemoveHyperlink"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 将文档的一部分转换为单段落中的非超链接。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "编辑和摘要格式",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    一种样式组合可以被赋予一个名称，并且\n                    "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/gacui/xmlres/tag_doc.html",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        存储在文档中\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    可以在\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EditStyleName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RemoveStyleName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 或 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RenameStyle"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EditStyle"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 更改文档中某一部分的样式。\n                    最后一个参数中的组件 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "(vl::)presentation::DocumentStyleProperties"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    在中与样式标签具有一对一的匹配。 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Style/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 或 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Font/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ":\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "face"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "<face/>"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "size"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "<size/>"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "color"
                              }
                            ]
