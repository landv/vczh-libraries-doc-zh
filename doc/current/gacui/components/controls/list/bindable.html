      {
        "kind": "Topic",
        "title": "更新项目",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                If "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ItemSource"
                  }

              },
              {
                "kind": "Text",
                "text": " 是一个可观察集合，\n                当您向集合中添加一项时，\n                或从集合中移除一项，\n                或替换集合中的项，\n                列表控件将知道并显示最新结果。\n                但更改项中的属性不会触发刷新列表控件，\n                因为 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "属性和写属性不是数据绑定"

              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当项目中的数据被修改时，\n                有三种方法可以通知列表控件重新创建与这些项关联的项模板实例：\n                "

              {
                "kind": "List",

                        "kind": "Text",

                      {
                        "kind": "Text",
                        "text": ",\n                        call "
                      },
                      {
                        "kind": "Strong",
                        "content": [

                            "kind": "Text",
                            "text": "NotifyUpdate"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 通知列表控件。\n                        此方法接受一个索引范围，\n                        该范围内的所有项都将被视为已更改。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        触发 "

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IValueObservableList::ItemChanged"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 通知列表控件的事件。\n                        当项目中的数据被修改时，\n                        这意味着集合中没有添加或移除任何内容。\n                        因此，请始终确保第二个和第三个参数具有相同的值。\n                        此事件接受一个索引范围，\n                        该范围内的所有项都将被视为已更改。\n                    "
                      }
                    ]
