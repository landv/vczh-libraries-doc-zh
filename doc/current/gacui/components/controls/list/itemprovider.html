                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiVirtualDataGrid"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 要求项提供程序实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "list::IDataGridView"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 用于单元格级别访问：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetBindingCellValue(行, 列)"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 访问单元格数据"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "SetBindingCellValue(行, 列, 值)"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 设置单元格数据（如果列已分配编辑器工厂，则必须可写）"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetCellSpan()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 无效果（合并单元格暂不支持）"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IMPORTANT"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    数据网格的项提供程序表示按渲染顺序排列的项，\n                    这意味着它只包含通过所有筛选条件的项目，\n                    按分配的排序器排序。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {

        "content": [

            "kind": "Paragraph",

              {

                "text": "\n                每个列表和树控件都使用特定的提供程序实现：\n            "

          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "列表控件和视图实现："

                ]
              },
              {
                "kind": "List",

                "items": [
                  {
                    "kind": "ContentListItem",

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiTextList"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "list::TextItemProvider"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （BindingValue： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Ptr<TextItem>"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ")"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiListView"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "list::ListViewItemProvider"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （BindingValue： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Ptr<ListViewItem>"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ")"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiBindableTextList"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "list::TextItemBindableProvider"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （BindingValue： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "description::Value"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （位于 ItemSource 中）"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiBindableListView"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "list::ListViewItemBindableProvider"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （BindingValue： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "description::Value"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （位于 ItemSource 中）"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiVirtualTreeListControl"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "tree::NodeItemProvider"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiBindableDataGrid"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "list::DataProvider"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "树控件和视图实现："
                  }
                ]
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiTreeView"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "tree::TreeViewItemRootProvider"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （BindingValue： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Ptr<TreeViewItem>"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ")"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GuiBindableTreeView"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "tree::TreeViewItemBindableRootProvider"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （BindingValue： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "description::Value"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " （位于 ItemSource 中）"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "操作项目",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                不同的控件提供了不同的方式来以编程方式操作其项。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "GuiTextList",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiTextList"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 提供对其项的直接访问：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetItems()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回一个可写的 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<TextItem>"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetSelectedItem()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回所选 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<TextItem>"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " （如果选择了多项或未选择任何项，则为 null）"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "GuiListView",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiListView"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 提供对列和项的访问：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetDataColumns()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回数据列索引的可写列表"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetColumns()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回一个可写的 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<ListViewColumn>"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetItems()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回一个可写的 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<ListViewItem>"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetSelectedItem()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回所选 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<ListViewItem>"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " （如果选择了多项或未选择任何项，则为 null）"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "GuiTreeView",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiTreeView"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 通过树状结构提供访问 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Nodes()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ":\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetRootNode()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 返回 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<INodeProvider>"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 根节点的"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetMemoryNode(node)"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 转换为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "INodeProvider*"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 到 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MemoryNodeProvider*"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MemoryNodeProvider"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 提供：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Children()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 可写列表 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<MemoryNodeProvider>"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetData()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 访问节点的实际数据（必须是 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Ptr<TreeViewItem>"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ")"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "SetData(value)"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": 设置节点的数据"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "GuiBindableTextList",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiBindableTextList"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 支持数据绑定：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetItemSource()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：获取表示所有项的可枚举对象"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "SetItemSource(value)"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：设置项源（如果它实现了 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "IValueReadonlyList"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "，实现将更高效；如果它实现了 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "IValueObservableList"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "，那么改变该列表会自动更新列表控件）"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetSelectedItem()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回所选 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "description::Value"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " （如果选择了多项或未选择任何项，则为 null）"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "NotifyItemDataModified(起始位置, 数量)"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：当项源没有更新、但某个项内部的属性发生改变时，请调用此函数"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "GuiBindableListView",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiBindableListView"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 通过数据绑定组合列：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetDataColumns()"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：返回数据列索引的可写列表"
                          }
                        ]
                      },
