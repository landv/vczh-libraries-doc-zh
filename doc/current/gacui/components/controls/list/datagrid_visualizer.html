                            {

                              "selected": false,
                              "path": [
                                "gacui",

                            },
                            {

                              "selected": false,

};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "可视化器",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "VisualizerFactory"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 属性是一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "list::IDataVisualizerFactory"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "。\n            请查看\n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/xmlres/instance/properties.html#presentation-controls-list-IDataVisualizerFactory-",
            "content": [
              {
                "kind": "Text",
                "text": "\n                本页\n            "
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            以了解如何在 GacUI XML 资源中使用此属性。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            要创建一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "list::IDataVisualizerFactory"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在 C++ 中，\n            建议使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "list::DataVisualizerFactory"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 作为接口的实现。\n            构造函数有两个参数。\n            第一个参数是一个\n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/xmlres/instance/properties.html#Control-Item-Template-func-data-Object-TEMPLATE-CLASS-",
            "content": [
              {
                "kind": "Text",
                "text": "\n                项模板的属性值\n            "
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            来创建一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiGridVisualizerTemplate"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            第二个参数是一个装饰的可视化器工厂，\n            这是可选的。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            如果装饰的可视化器工厂不存在， "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "null"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            从第一个参数创建的可视化器模板\n            将包含从装饰的可视化器工厂创建的一个。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            第一列单元格的默认可视化器工厂是：\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\n                MainColumnVisualizerTemplate;FocusRectangleVisualizerTemplate;CellBorderVisualizerTemplate\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这意味着，\n            对于这些单元格，\n            当单元格获得焦点时，将显示一个焦点矩形（仅在单元格有焦点时渲染）。\n            并且焦点矩形包含在一个边框内。\n            单元格只有右边和下边的边框线。\n            但当所有单元格一起渲染时，\n            它们构成一个表格。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            其他列单元格的默认可视化器工厂是：\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\n                SubColumnVisualizerTemplate;FocusRectangleVisualizerTemplate;CellBorderVisualizerTemplate\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            例如，\n            创建上述默认可视化器工厂：\n            "
          },
          {
            "kind": "Program",
            "code": "auto mainProperty = [](const Value&) { return new MainColumnVisualizerTemplate; };\nauto subProperty = [](const Value&) { return new SubColumnVisualizerTemplate; };\nauto focusRectangleProperty = [](const Value&) { return new FocusRectangleVisualizerTemplate; };\nauto cellBorderProperty = [](const Value&) { return new CellBorderVisualizerTemplate; };\n\n\ndefaultMainColumnVisualizerFactory = \n    Ptr(new DataVisualizerFactory(cellBorderProperty,\n        Ptr(new DataVisualizerFactory(focusRectangleProperty,\n            Ptr(new DataVisualizerFactory(mainProperty)\n    )))));\ndefaultSubColumnVisualizerFactory = \n    Ptr(new DataVisualizerFactory(cellBorderProperty,\n        Ptr(new DataVisualizerFactory(focusRectangleProperty,\n            Ptr(new DataVisualizerFactory(subProperty)\n    )))));"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            我们为所有预定义的可视化器模板创建项目模板属性值：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "MainColumnVisualizerTemplate"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SubColumnVisualizerTemplate"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusRectangleVisualizerTemplate"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CellBorderVisualizerTemplate"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            然后使用嵌套的实例将它们组合在一起： "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "DataVisualizerFactory"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "注意"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "：\n            在 C++ 中的可视化顺序与 GacUI XML 资源中的顺序相反。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            请查看\n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/components/itemplates/home.html",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "项目模板"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            以了解有关 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiGridVisualizerTemplate"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "分步示例",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在此示例中，\n                单元格可视化器应用于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Author"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 列和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Summary"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 列：\n                "
              },
              {
                "kind": "Program",
                "code": "<att.AuthorColumn-set>\n  <att.VisualizerFactory>HyperlinkVisualizerTemplate;FocusRectangleVisualizerTemplate;CellBorderVisualizerTemplate</att.VisualizerFactory>\n</att.AuthorColumn-set>\n<att.SummaryColumn-set>\n  <att.VisualizerFactory>sample:SummaryVisualizer;FocusRectangleVisualizerTemplate;CellBorderVisualizerTemplate</att.VisualizerFactory>\n</att.SummaryColumn-set>"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "HyperlinkVisualizerTemplate"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是一个预定义的可视化器，用于将单元格转换为超链接。\n                它仅更改列下所有单元格的外观和鼠标光标。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "sample:SummaryVisualizer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是在同一个资源文件中定义的可视化器。\n                它为文本添加一个图标，\n                当鼠标悬停在图标上方时，\n                显示一个工具提示以显示完整的摘要。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在 GacUI 资源 XML 中，\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/properties.html#presentation-controls-list-IDataVisualizerFactory-",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    多个模板\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                可以被赋给 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VisualizerFactory"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性以使多个可视化器嵌套在一起。\n                这里 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusRectangleVisualizerTemplate"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CellBorderVisualizerTemplate"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被使用\n                使单元格看起来像默认的那样，\n                可以获取焦点并具有边框的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "源代码： "
                      },
                      {
                        "kind": "PageLink",
                        "href": "https://github.com/vczh-libraries/Release/blob/master/SampleForDoc/GacUI/XmlRes/control_datagrid_visualizer/Resource.xml",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "control_datagrid_visualizer"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Image",
                        "src": "/gacui/control_datagrid_visualizer.gif"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
