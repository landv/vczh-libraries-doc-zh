<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title><ResponsiveShared> -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/article.css" />
<script src="/vczh-libraries-doc-zh/doc/current/scripts/rootView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/directoryView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/articleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "gacui",
    "components",
    "compositions",
    "responsive_shared"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "GacUI",
      "selected": false,
      "path": [
        "gacui",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "GacUI 组件",
          "selected": false,
          "path": [
            "gacui",
            "components",
            "home"
          ],
          "subNodes": [
            {
              "icon": "-",
              "name": "组合",
              "selected": false,
              "path": [
                "gacui",
                "components",
                "compositions",
                "home"
              ],
              "subNodes": [
                {
                  "icon": "-",
                  "name": "响应式设计系列",
                  "selected": false,
                  "path": [
                    "gacui",
                    "components",
                    "compositions",
                    "responsive"
                  ],
                  "subNodes": [
                    {
                      "icon": "-",
                      "name": "<ResponsiveView>",
                      "selected": false,
                      "path": [
                        "gacui",
                        "components",
                        "compositions",
                        "responsive_view"
                      ],
                      "subNodes": [
                        {
                          "icon": " ",
                          "name": "<ResponsiveFixed>",
                          "selected": false,
                          "path": [
                            "gacui",
                            "components",
                            "compositions",
                            "responsive_fixed"
                          ]
                        },
                        {
                          "icon": " ",
                          "name": "<ResponsiveShared>",
                          "selected": true,
                          "path": [
                            "gacui",
                            "components",
                            "compositions",
                            "responsive_shared"
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "<ResponsiveShared>",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<ResponsiveView/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            有时当它切换到另一个视图时，\n            通过切换，内容已完全更改。\n            从一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiResponsiveCompositionBase"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 到另一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiResponsiveCompositionBase"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            在……中 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Views"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            如果一个具有重要状态的控件需要在不同视图之间共享，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<ResponsiveShared/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以帮忙。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这类场景非常常见。\n            例如，\n            不同的视图可以共享一个文本框。\n            如果在不同的视图中使用不同的文本框控件来表示相同输入数据，\n            用户会感到困惑，以为选中的区域消失了，仅仅是因为改变了窗口大小。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<ResponsiveView>::SharedControls",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                所有控件需要在视图之间共享\n                必须在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SharedControls"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 集合属性。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                为了使这些控件能够被使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveShared/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                通常需要指定控件名称\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/tag_instance.html",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ref.Name"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                每个控件的属性。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveView/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已删除，\n                所有控件在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SharedControls"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也将被删除。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<ResponsiveShared>::Shared",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于任何需要出现在视图中特定位置的控件，\n                a "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveShared/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 用作占位符。\n                它是一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Bounds/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                因此，所有必要的属性都像控件一样可用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BoundsComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在此组合中，\n                要显示的控件是通过使用指定的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Shared"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性，\n                通常使用一个\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/properties.html#-ref",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "-ref"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                绑定。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiResponsiveCompositionBase"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在……中 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Views"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已选中，\n                全部包含 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveShared/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在此组合中将收到通知\n                使 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Shared.BoundsComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 成为子组合\n                使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Shared.BoundsComposition.AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 设置为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "left:0 top:0 right:0 bottom:0"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                之后，\n                所有共享控件都已移至其占位符位置。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
