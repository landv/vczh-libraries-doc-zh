                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "true"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 如果鼠标中键正在按下。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "右侧"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ": "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "true"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 如果鼠标右键正在按下。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "x"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 以及 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "y"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：相对于……的坐标 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "第一个回调参数"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "wheel"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：\n                            滚轮的方向与距离。正数表示滚轮向右或向下旋转。\n                            对于当今典型的鼠标，一次旋转的单位是 120。\n                        "
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "移动事件",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    GacUI 提供以下按钮事件：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "mouseMove"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "mouseEnter"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "mouseLeave"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseEnter"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当鼠标移入组合时触发。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseLeave"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当鼠标移出组合时触发。\n                    当鼠标从一个组合移到其子组合时，\n                    不算离开原组合，\n                    它仍处于原组合及其子组合中。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseMove"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当鼠标移动时触发。\n                    它在捕获的组合上触发，\n                    当没有组合被捕获时，则在鼠标正下方的组合上触发，\n                    然后沿父链传播，\n                    可以通过设置……来阻止 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "handled"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 到 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "捕获",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当按下按钮事件发生时，\n                    该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "compositionSource"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 会被捕获。\n                    被捕获的组合会成为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "compositionSource"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    （后续发生在所在窗口或菜单、弹出层等中的全部鼠标事件的目标），\n                    包括按钮抬起事件。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    在按住的鼠标按键全部释放后，捕获会被释放。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "在鼠标事件期间移动或删除控件或组合。",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    有时你可能想在鼠标事件回调中改变控件树结构\n                    （包括 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Clicked"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 按钮中的……）。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这很棘手，因为\n                    鼠标事件不仅会发给这个组合，\n                    还会发给它的所有父组合。\n                    即使当 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "handled"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被设置为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    在回调函数结束后仍有一些事情要处理。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当你移动或删除影响父链的控件或组合时，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GacUI 将稳定崩溃"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    为了解决这个问题，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetApplication()->InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 会帮到你。\n                    每当你调用此函数时，\n                    对……的回调 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 会在当前这一系列事件结束后\n                    立即运行。\n                    那是重组控件或组合的一个非常安全的时机。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    例如，\n                    如果你自定义页签控件，让每个页签页都有一个关闭按钮：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "void MyTabPage::buttonCloseClicked(GuiGraphicsComposition* sender, GuiEventArgs& arguments)\n{\n    // this is still in the chain of mouse button events,\n    // so InvokeInMainThread is required to delete MyTabPage.\n    GetApplication()->InvokeInMainThread(this->GetRelatedControlHost(), [=]()\n    {\n        this->GetOwnerTab()->GetPages().Remove(this);\n        SafeDeleteControl(this);\n    });\n}"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "焦点事件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                GacUI 提供以下按钮事件：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "gotFocus"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "lostFocus"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "caretNotify"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                第二个参数的类型是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::compositions::GuiEventArgs&"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "presentation::composition::GuiEventArgs*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在……中 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Workflow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                焦点组合是……的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " （拥有焦点的控件的）。\n                像按钮这样的控件在被点击后会获得焦点，\n                你也可以调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetFocus"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 把焦点移到某个控件。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当控件获得焦点时，\n                它的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 拥有焦点。\n                如果你在编写控件模板，\n                可以把任意组合设到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " （控件模板的）属性上，\n                它就会成为该控件的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 焦点组合。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                一个窗口只能有一个获得焦点的控件。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "gotFocus"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 当组合获得焦点时触发。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "lostFocus"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 当先前获得焦点的组合失去焦点时触发。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "caretNotify"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 每半秒会在获得焦点的控件上持续触发。\n                如果控件想渲染输入插入符，\n                它需要订阅 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "caretNotify"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                并在该事件发生时让输入插入符在可见与不可见状态间切换。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                COMPOSITION->"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetRelatedGraphicsHost"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "()->"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetCaretPoint"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                用于告诉系统在哪里显示输入法的小窗口。\n                强烈建议由获得焦点的控件调用此函数，\n                以避免状态损坏。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果窗口自身获得或失去焦点，\n                相关事件会在窗口上触发，\n                这里描述的事件不受影响。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "键盘事件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                GacUI 提供以下按钮事件：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "previewKey"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "keyDown"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "keyUp"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                第二个参数的类型是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::compositions::GuiKeyEventArgs&"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "presentation::composition::GuiKeyEventArgs*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在……中 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Workflow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                键盘事件在获得焦点的组合上触发，\n                然后沿父链传播，\n                可以通过设置……来阻止 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "handled"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "previewKey"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在任何其他键盘事件之前触发。\n                如果 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "handled"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被设置为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                不仅父级链会停止，\n                后续的键盘事件也会被取消。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "代码"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " （第二个参数的）成员\n                映射到……中的某个项 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::VKEY"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " enum.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                其它成员包含事件的信息：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ctrl"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果正在按下 CTRL 键。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "shift"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果正在按下 SHIFT 键。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "alt"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果正在按下 ALT 键。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
