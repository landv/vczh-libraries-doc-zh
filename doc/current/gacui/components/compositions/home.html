                    "kind": "Text",

                  {
                    "kind": "Text",
                    "text": "AssociatedHitTestResult"

                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",

                            "kind": "Strong",

                                "kind": "Text",

                      },

                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "OwnedElement"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 当 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MinSizeLimitation"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 是 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LimitToElement"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 或 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LimitToElementAndChildren"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Children"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 当 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MinSizeLimitation"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 是 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LimitToElementAndChildren"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    以及以下仅存在于 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiBoundsComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 及其派生类：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "ExpectedBounds"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "的大小"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "子项 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 当 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MinSizeLimitation"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 是 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LimitToElementAndChildren"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    组合具有默认最小尺寸0。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    通过将元素分配给 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "OwnedElement"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 属性，\n                    该元素已绑定到此组合。\n                    元素使用组合的位置和大小进行渲染。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    有时元素需要最小尺寸才能完整渲染其内容\n                    （通常用于 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SolidLabel"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 未启用尾部省略号的情况下）。\n                    要为该组合分配最小尺寸，\n                    只需设置 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MinSizeLimitation"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 到 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LimitToElement"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 或 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LimitToElementAndChildren"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    如果此组合具有子项，\n                    还将有一个最小尺寸以渲染所有子项。\n                    要为该组合分配最小尺寸，\n                    只需设置 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MinSizeLimitation"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 到 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LimitToElementAndChildren"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    您也可以使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "PreferredMinSize"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 属性。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "组合的位置",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    位置由以下属性控制：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", defaults to (-1,-1,-1,-1).\n                            任何组件 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 必须为 -1 或非负数。\n                            "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 是此组合与其父组合之间的间隙。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "ExpectedBounds"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", defaults to (0,0,0,0).\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "InternalMargin"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 父组合的，默认为 (0,0,0,0)。\n                            任何组件 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "InternalMargin"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 必须为非负数。\n                            "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "InternalMargin"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 在该组件与其子组件之间添加间距。\n                            一个组件 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "InternalMargin"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 当考虑相应的组件时 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 子组合的 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "-1"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ".\n                        "
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    考虑 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "左侧"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "右侧"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 所属的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            如果两者均不为 -1，\n                            此组合与其父级之间的间隙由以下定义： "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ".\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            If "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "左侧"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 是 -1 和 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "右侧"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 不是，\n                            右侧间隙由定义 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "，\n                            左侧的间距由组件的宽度决定。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            If "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "左侧"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 不为 -1 且 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "右侧"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 不是，\n                            左侧间隙由定义 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "，\n                            右侧的间隙由组件的宽度决定。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            如果两者都是 -1，\n                            左侧间隙由定义 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "ExpectedBounds"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 与其父级结合 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "InternalMargin"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "，\n                            右侧的间隙由组件的宽度决定。\n                        "
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "top"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "bottom"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和高度类似于上面所描述的。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 也会影响父组合的最小尺寸\n                    if "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MinSizeLimitation"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 父组合的设置为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LimitToElementAndChildren"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "注意"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    一些组合如 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<SideAligned/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 或 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<PartialView/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    忽略 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "将按钮保持在窗口的右下角",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这非常直接：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Button>\n  <att.BoundsComposition AlignmentToParent=\"left:-1 top:-1 right:5 bottom:5\"/>\n</Button>"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    通过这样做，\n                    按钮将保持距离其父容器右侧5像素（96 dpi）的位置。\n                    并且距离其父控件底部5像素（96 dpi）\n                    当其父控件的大小改变时，\n                    按钮将贴靠在右下角。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "注意"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    建议您使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Table/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当你可以的时候，\n                    由于按钮的大小可能会因不同操作系统语言配置下的文本不同而改变。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Table/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 帮助组织按钮和按钮上方的内容。\n                    或当右下角有多个按钮时。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "定位属性的数据绑定",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                只是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DON'T DO THIS"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IT IS DANGEROUS"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将一个定位属性绑定到另一个定位属性。\n                例如，\n                您可能希望保持一个组合恰好占据其父组合的左半部分。\n                但如果你绑定 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 的此组合的大小，\n                它可能导致其父组合持续增长。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当父组合对象增大时（例如拖动窗口），\n                子组合也会增长，因为它希望保持间隙完全一致。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                之后 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也随着子组件的增加而增长，\n                并且这会导致父级组合重新增长，因为间隙增大了。\n                此过程永不停止，\n                窗口在调整大小时会持续增长。\n                直到永远。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "其他属性",
        "content": [
          {
            "kind": "Topic",
            "title": "AssociatedControl",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回控件，\n                    所属的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BoundsComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 这是组合吗？\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性可能返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当此组合不是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
