          {
            "kind": "Text",
            "text": "\n            我们可以使用所有这些来为 "

            "kind": "Strong",

              {
                "kind": "Text",

          {

          },
          {
            "kind": "Program",
            "code": "<Instance ref.Class=\"sample::TabHeaderButtonTemplate\">\n  <SelectableButtonTemplate ref.Name=\"self\" MinSizeLimitation=\"LimitToElementAndChildren\">\n    <Bounds AlignmentToParent=\"left:0 top:0 right:0 bottom:0\">\n      <SolidBackground>\n        <att.Color-bind><![CDATA[\n          cast Color (\n            not self.VisuallyEnabled ? \"#00000000\" :\n            self.State == ButtonState::Pressed ? \"#3D3D3D\" :\n            self.State == ButtonState::Active ? \"#808080\" :\n            self.Selected ? \"#3D3D3D\" :\n            \"#00000000\"\n          )\n        ]]></att.Color-bind>\n      </SolidBackground>\n    </Bounds>\n    <Bounds AlignmentToParent=\"left:0 top:0 right:0 bottom:0\">\n      <att.Visible-bind>self.Focused</att.Visible-bind>\n      <FocusRectangle/>\n    </Bounds>\n    <Bounds AlignmentToParent=\"left:1 top:1 right:1 bottom:1\" MinSizeLimitation=\"LimitToElement\">\n      <SolidLabel Text-bind=\"self.Text\" Font-bind=\"self.Font\">\n        <att.Color-bind><![CDATA[\n          cast Color (\n            self.VisuallyEnabled ? \"#FFFFFF\" : \"808080\"\n          )\n        ]]></att.Color-bind>\n      </SolidLabel>\n    </Bounds>\n  </SelectableButtonTemplate>\n</Instance>"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            然后一个包含三个复选框的窗口，使用此控件模板：\n            "
          },
          {
            "kind": "Program",
            "code": "<Instance ref.Class=\"sample::MainWindow\" ref.Styles=\"res://MainWindow/SharedStyle\">\n  <Window Text=\"kb_ctemplates\" IconVisible=\"true\" ClientSize=\"x:640 y:480\">\n    <att.BoundsComposition-set PreferredMinSize=\"x:480 y:320\"/>\n      <Stack Direction=\"Vertical\" MinSizeLimitation=\"LimitToElementAndChildren\" AlignmentToParent=\"left:5 top:5 right:-1 bottom:-1\" Padding=\"5\">\n        <StackItem><CheckBox Text=\"Button 1\"/></StackItem>\n        <StackItem><CheckBox Text=\"Button 2\"/></StackItem>\n        <StackItem><CheckBox Text=\"Button 3\"/></StackItem>\n      </Stack>\n  </Window>\n</Instance>"
          }

            "kind": "Text",
            "text": "\n            使用此新的控件模板，\n            我们可以为标签控件创建一个更复杂的控件模板。\n        "

        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Tab"

            ]
          },
          {
            "kind": "Text",

          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TabTemplate"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            并且它有两个重要属性： "

          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Commands"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "

          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",

              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            这些都是输入属性。\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Commands"
              }
            ]
          },

                "kind": "Text",

            "kind": "Strong",

              {

            ]
          },

      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            通过绑定 "

                "kind": "Text",

          {

            "text": "，\n            我们可以轻松为每个选项卡页面创建一个按钮列表。\n            当标签页被插入或从标签控件中移除时，\n            按钮列表将自动刷新。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            首先我们为 "
          },
          {
            "kind": "Strong",
            "content": [

                "kind": "Text",
                "text": "Tab"

            "kind": "Text",
            "text": ":\n            "
          },
          {
            "kind": "Program",
            "code": "<Instance ref.Class=\"sample::TabTemplate\">\n  <TabTemplate ref.Name=\"self\" ContainerComposition-ref=\"container\" TabOrder=\"TopToBottom\" MinSizeLimitation=\"LimitToElementAndChildren\">\n    <Table AlignmentToParent=\"left:0 top:0 right:0 bottom:0\" MinSizeLimitation=\"LimitToElementAndChildren\">\n      <att.Rows>\n        <CellOption>composeType:Percentage percentage:1.0</CellOption>\n      </att.Rows>\n      <att.Columns>\n        <CellOption>composeType:MinSize</CellOption>\n        <CellOption>composeType:Percentage percentage:1.0</CellOption>\n      </att.Columns>\n\n      <Cell Site=\"row:0 column:0\">\n        <RepeatStack ref.Name=\"header\" AlignmentToParent=\"left:0 top:0 right:0 bottom:0\" Padding=\"2\" Direction=\"Vertical\" MinSizeLimitation=\"LimitToElementAndChildren\">\n          <att.ItemTemplate>sample::TabHeaderTemplate</att.ItemTemplate>\n          <att.ItemSource-bind>self.TabPages</att.ItemSource-bind>\n          <ev.ItemInserted-eval>\n            <![CDATA[\n              {\n                var stackItem = header.StackItems[arguments.itemIndex];\n                var item = cast (TabHeaderTemplate*) stackItem.Children[0];\n                item.Commands = self.Commands;\n              }\n            ]]>\n          </ev.ItemInserted-eval>\n        </RepeatStack>\n      </Cell>\n\n      <Cell Site=\"row:0 column:1\">\n        <SolidBackground Color=\"#3D3D3D\"/>\n        <Bounds ref.Name=\"container\" AlignmentToParent=\"left:1 top:1 right:1 bottom:1\"/>\n      </Cell>\n    </Table>\n  </TabTemplate>\n</Instance>"
          },
          {
            "kind": "Text",
            "text": "\n            在此控件模板中，\n            我们使用创建一个按钮列表 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RepeatStack"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在左侧，\n            并在右侧创建一个用于标签页内容的容器。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在项模板中 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RepeatStack"

            ]
          },
          {
            "kind": "Text",
            "text": " 命名为 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "sample::TabHeaderTemplate"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            即：\n            "
          },
