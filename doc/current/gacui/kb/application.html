              {

              }

          },

          }
        ]
      },
      {
        "kind": "Paragraph",

          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当使用创建一个主题时， "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUI XML 资源"

            "content": [
              {
                "kind": "Text",
                "text": "RegisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 对于此主题，必须在关联的资源文件加载后调用。\n            很难确切知道时间\n            因此，GacUI 提供了一个高效的插件系统来解决这个问题。\n            您可以创建一个插件来注册此主题，并像这样声明此主题依赖于其资源：\n            "

            "kind": "Program",

          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当默认控件模板和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiMain"
              }
            ]
          },
          {

            "content": [
              {
                "kind": "Text",

          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            所有 GacUI 对象只能在 UI 线程中使用。\n            为了使线程之间能够通信，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 提供以下函数来运行任务：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 检查当前线程是否为 UI 线程。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeAsync"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在任意后台线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在 UI 线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThreadAndWait"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在 UI 线程中执行一个任务，并等待其完成。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DelayExecute"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在指定时间之后，于任意后台线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DelayExecuteInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在指定时间之后，于 UI 线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RunGuiTask"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在 UI 线程中执行一个任务，并等待其完成。"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThread"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以在任意线程中调用。\n            该函数会将要执行的任务排队，\n            稍后再执行。\n            在 UI 线程中调用该函数也是可以的，\n            这是一种很常见的模式，用于立即触发某些事情，但并非严格意义上的“此刻”。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            例如，\n            当你在标签页标题中放一个按钮来移除该标签页时，\n            你不能在按钮的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Click"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 事件中直接移除并删除该标签页，\n            因为在此 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Click"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 事件之后还有其他事件要触发，\n            而这些事件要求按钮及其所有祖先对象仍然存活。\n            在这种情况下，\n            你可以请求 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThread"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 删除标签页标题，\n            它会在这次点击所需的一切都处理完成之后才执行，\n            而 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SafeDeleteControl"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 就能正常工作。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThreadAndWait"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 不能在 UI 线程中调用。\n            如果你这样做，\n            它会抛出异常以示警告。\n            你还可以让该函数在任务未于指定时间内完成时返回。\n            这种情况下，任务不会被取消。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RunGuiTask"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 的工作原理类似于 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThreadAndWait"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            但在 UI 线程中调用也是可以的。\n            它只会在任务完成之后才返回。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupWindowsGDIRendererInternal"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 与 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupHostedWindowsDirect2DRenderer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            使用唯一一个操作系统原生窗口来搭建 GacUI。\n            所有非主窗口都将在该窗口内渲染。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupRemoteNativeController"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 使用远程协议搭建 GacUI，\n            它同样以宿主模式运行。\n            它接受一个参数，即 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IGuiRemoteProtocol"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 的实现，\n            该接口负责在核心与渲染器之间序列化与反序列化命令。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupRawWindowsGDIRenderer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupRawWindowsDirect2DRenderer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 启动一个 GacUI 应用程序 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "INativeController"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 仅，仅限\n            将不会有 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 运行中，因此无法使用任何控件。\n            当您想运行一个与用户交互的远程协议渲染器时，这会很有用。\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiRemoteRendererSingle"
              }
            ]
          },
