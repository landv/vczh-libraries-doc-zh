      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个 GacUI 应用需要一个用户自定义的函数 "

            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "void GuiMain(void)"

            ]
          },
          {
            "kind": "Text",
            "text": "。\n            要启动一个 GacUI 应用，\n            必须在入口函数中调用以下函数之一。\n            "

          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    对于 Windows，\n                    必须在 "

                      {
                        "kind": "Text",
                        "text": "WinMain"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 中调用以下函数之一来启动应用：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "SetupWindowsDirect2DRenderer"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "SetupHostedWindowsDirect2DRenderer"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",

                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {

                            "text": "SetupHostedWindowsGDIRenderer"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    它们会初始化必要的对象，并调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiMain"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，以不同的渲染技术运行。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    对于 macOS，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetupOSXCoreGraphicsRenderer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 或 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetupOSXHostedCoreGraphicsRenderer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 必须在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "main"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 中调用。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    对于使用 Wayland 的 Linux，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::presentation::elements::wgac::SetupWGacRenderer or SetupWGacHostedRenderer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 必须在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "main"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 中调用。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被调用时，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 对象已就绪，\n            可以通过 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GetApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数访问。\n            一个典型的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数如下所示：\n            "
          },
          {
            "kind": "Program",
            "code": "void GuiMain()\n{\n    // 1. create a window, anything that inherits from GuiWindow works\n    MyWindow myWindow;\n\n    // 2. decide where to show the window, it could be any location in any monitor you like\n    myWindow.MoveToScreenCenter()\n\n    // 3. show the window as a main window of the application\n    GetApplication()->Run(&myWindow);\n\n    // 4. when the main window is closed, it gets here\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RegisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " must be called before creating any UI object to\n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/kb/dtemplates.html",
            "content": [
              {
                "kind": "Text",
                "text": "register a set of default control templates"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            for all controls.\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RegisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "UnregisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " can be used to manage all registered themes.\n            A single theme object is not required to provide control templates for all controls,\n            but all registered themes must cover all controls.\n            The latest registered theme has the top priority.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            When a theme is created using "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUI XML Resource"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ",\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RegisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " for this theme is required to call after the associated resource file is loaded.\n            It is difficult to know the exact timing,\n            so GacUI provideds an efficient plugin system to solve this problem.\n            You can create a plugin to register this theme and declare that this theme is depended on its resource like this:\n            "
          },
          {
            "kind": "Program",
            "code": "class DefaultSkinPlugin : public Object, public IGuiPlugin\n{\npublic:\n\tGUI_PLUGIN_NAME(Custom_DefaultSkinPlugin)\n\t{\n\t\tGUI_PLUGIN_DEPEND(GacGen_DarkSkinResourceLoader);\n\t}\n\n\tvoid Load(bool, bool)override\n\t{\n\t\tRegisterTheme(Ptr(new darkskin::Theme));\n\t}\n\n\tvoid Unload(bool, bool)override\n\t{\n\t}\n};\nGUI_REGISTER_PLUGIN(DefaultSkinPlugin)"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当默认控件模板和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 都准备好后，\n            就可以创建一个非常简单的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "WinMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 来启动应用：\n            "
          },
          {
            "kind": "Program",
            "code": "int CALLBACK WinMain(HINSTANCE hInstance, HINSTANCE hPrevInstance, LPSTR lpCmdLine, int CmdShow)\n{\n    return SetupWindowsDirect2DRenderer();\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            所有 GacUI 对象只能在 UI 线程中使用。\n            为了使线程之间能够通信，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 提供以下函数来运行任务：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 检查当前线程是否为 UI 线程。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeAsync"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在任意后台线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在 UI 线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThreadAndWait"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在 UI 线程中执行一个任务，并等待其完成。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DelayExecute"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在指定时间之后，于任意后台线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DelayExecuteInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在指定时间之后，于 UI 线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RunGuiTask"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在 UI 线程中执行一个任务，并等待其完成。"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThread"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以在任意线程中调用。\n            该函数会将要执行的任务排队，\n            稍后再执行。\n            在 UI 线程中调用该函数也是可以的，\n            这是一种很常见的模式，用于立即触发某些事情，但并非严格意义上的“此刻”。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            例如，\n            当你在标签页标题中放一个按钮来移除该标签页时，\n            你不能在按钮的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Click"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 事件中直接移除并删除该标签页，\n            因为在此 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Click"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 事件之后还有其他事件要触发，\n            而这些事件要求按钮及其所有祖先对象仍然存活。\n            在这种情况下，\n            你可以请求 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThread"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 删除标签页标题，\n            它会在这次点击所需的一切都处理完成之后才执行，\n            而 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SafeDeleteControl"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 就能正常工作。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThreadAndWait"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 不能在 UI 线程中调用。\n            如果你这样做，\n            它会抛出异常以示警告。\n            你还可以让该函数在任务未于指定时间内完成时返回。\n            这种情况下，任务不会被取消。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RunGuiTask"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 的工作原理类似于 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThreadAndWait"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            但在 UI 线程中调用也是可以的。\n            它只会在任务完成之后才返回。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupWindowsGDIRendererInternal"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 与 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupHostedWindowsDirect2DRenderer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            使用唯一一个操作系统原生窗口来搭建 GacUI。\n            所有非主窗口都将在该窗口内渲染。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupRemoteNativeController"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 使用远程协议搭建 GacUI，\n            它同样以宿主模式运行。\n            它接受一个参数，即 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IGuiRemoteProtocol"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 的实现，\n            该接口负责在核心与渲染器之间序列化与反序列化命令。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupRawWindowsGDIRenderer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SetupRawWindowsDirect2DRenderer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " starts up a GacUI application with "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "INativeController"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " only,\n            there will be no "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " running and therefore no controls can be used.\n            This is useful when you want to run a remote protocol renderer that interacts with a user.\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiRemoteRendererSingle"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " connects to one actual GacUI application that running with remote protoco.\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IMPORTANT:"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " you must implement the communicating by yourself.\n            GacUI has a default implementation of remote protocol serialization with JSON or string format.\n            But you must implement the sending and receiving.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            When running GacUI with unit test framework,\n            it starts GacUI with remote protocol,\n            with an implementation of "
          },
          {
            "kind": "Strong",
