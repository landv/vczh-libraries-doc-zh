      {

          {
            "kind": "Text",
            "text": "\n            操作系统提供程序是使 GacUI 跨平台的关键。\n        "

        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            如果你想将 GacUI 移植到一个新的平台，\n            这就是你应该做的：\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "实现 INativeWindowService 和 INativeWindow",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这两个接口是任何操作系统提供程序的关键。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通常，\n                一个实例 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 控制目标操作系统中的一个窗口。\n                如果可用多个图形API（例如Windows上的GDI和Direct2D），\n                它们通常共享相同的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 实现。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "在您喜欢的图形 API 中实现元素渲染器",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                所有元素都有自己的渲染器对象。\n                当一个元素被放入窗口时，\n                一个渲染器对象将与该元素关联。\n                相同元素类型的实例拥有自己的渲染器对象，\n                它们不共享渲染器对象。\n                因此在渲染器中非常容易缓存必要的系统资源。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通过使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DEFINE_GUI_GRAPHICS_RENDERER"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在你的渲染器类中，\n                所有样板代码都将准备就绪，\n                您只需要调用静态 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Register"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个元素需要被渲染时，\n                它将找到已注册的渲染器类，\n                创建一个实例并将其关联到元素本身。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "实现 GuiGraphicsResourceManager 和 IGuiGraphicsRenderTarget",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiGraphicsResourceManager"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是渲染的核心对象。\n                它是一个类，但有一些抽象函数需要重写。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetGuiGraphicsResourceManager"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 要求注册您的实现。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiGraphicsResourceManager"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiGraphicsRenderTarget"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是元素接口的一部分\n                使所有渲染器对象都能访问窗口的系统资源。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通常您还需要创建一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeControllerListener"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                这是一种方便的方式来跟踪创建和销毁 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 实例并保持你的代码解耦。\n                当一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已创建，\n                通常是一个实现 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiGraphicsRenderTarget"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也将被创建并关联到窗口。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiGraphicsRenderTarget* GuiGraphicsResourceManager::GetRenderTarget(INativeWindow*)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                是要实现的重要功能之一。\n                当窗口需要刷新自身时，\n                此函数将被调用以检索一个实现 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiGraphicsRenderTarget"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 从一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                并且渲染目标将发送给所有元素的所有渲染器对象实例。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                由于在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DEFINE_GUI_GRAPHICS_RENDERER"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 您已经指定了\n                底层类型，也是由您创建以实现的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiGraphicsRenderTarget"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                每当一个渲染目标被提供给元素渲染器时，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RenderTargetChangedInternal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将使用实际的渲染目标类型调用。\n                这是一个重新创建依赖于这个特定渲染目标的系统资源的好机会。\n                那之后，\n                渲染目标将存储在受保护的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "renderTarget"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 字段。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于像 DirectX 这样的图形 API，\n                有时设备上下文会无效，必须重新启动整个过程。\n                在这种情况下，\n                将创建一个新的渲染目标并设置到所有渲染器对象上\n                通过调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RenderTargetChangedInternal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 再次。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "实现 INativeController",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 由多个服务组成：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeCallbackService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 管理 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeControllerListener"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 以便不同的组件可以接收系统消息并保持代码解耦。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeAsyncService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 在多个线程中管理并执行任务队列。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeResourceService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 从操作系统访问光标和字体。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeClipboardService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 从操作系统访问剪贴板"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeScreenService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 从操作系统访问物理显示器。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeDialogService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 从操作系统访问默认对话框。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeImageService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 从文件或内存加载图像。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeWindowService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 使用操作系统的窗口管理器来管理窗口。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "INativeInputService"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 从操作系统访问全局键盘状态和计时器。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "托管模式",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiHostedController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetHostedApplication"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以创建 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                在原生之上 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 实例。\n                结账 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetupWindowsGDIRendererInternal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetupHostedWindowsDirect2DRenderer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 详细信息。\n                当使用远程协议运行 GacUI 时，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetupRemoteNativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将创建 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiHostedController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在……之上 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiRemoteController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当某个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以本机操作系统提供者身份运行 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiHostedController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                它必须处理额外的渲染工作 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiGraphicsRenderTarget"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ":\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IsInHostedRendering()"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 将被调用以检测渲染目标是否正常工作。"

                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "StartHostedRendering()"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". 这仅在托管模式下调用，以便后续所有渲染调用都得到提示。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "多个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "StartRendering()"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 以及 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "StopRendering()"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 从窗口发出的调用。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "StopHostedRendering()"
                          }
                        ]
                      },
                      {
