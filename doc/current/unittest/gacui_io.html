<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>IO Interaction -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/article.css" />
<script src="/vczh-libraries-doc-zh/doc/current/scripts/rootView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "unittest",
    "gacui_io"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "单元测试",
      "selected": false,
      "path": [
        "unittest",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "在单元测试框架中运行 GacUI",
          "selected": false,
          "path": [
            "unittest",
            "gacui"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "快照与帧",
              "selected": false,
              "path": [
                "unittest",
                "gacui_frame"
              ]
            },
            {
              "icon": " ",
              "name": "IO 交互",
              "selected": true,
              "path": [
                "unittest",
                "gacui_io"
              ]
            },
            {
              "icon": " ",
              "name": "访问控件",
              "selected": false,
              "path": [
                "unittest",
                "gacui_controls"
              ]
            },
            {
              "icon": " ",
              "name": "快照查看器",
              "selected": false,
              "path": [
                "unittest",
                "gacui_snapshots"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "IO 交互",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            计算控件或组合在后续鼠标交互中的位置，\n            使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "protocol->LocationOf(controlOrComposition, ratioX?, ratioY?, offsetX?, offsetY?)"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            它使用对象内的全局位置进行计算\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "left + width * ratioX + offsetX"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "top + height * ratioY + offsetY"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            您可以省略最后 4 个参数以获取对象的中心。\n            这样的位置可以直接传递给鼠标交互函数。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "鼠标交互",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这里是可用的鼠标交互函数列表： "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "protocol"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "MouseMove(位置) 和 MouseMove(位置, ctrl, shift, alt, osSuper)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 使用可选修饰键将鼠标移动到指定位置。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_LDown(location?)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发一个左键按下事件。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_LUp(location?)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发一个左键释放事件。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_LDBClick(location?)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发一个左键双击事件。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "LClick(位置?) 和 LClick(位置, ctrl, shift, alt, osSuper)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发多个事件以模拟带可选修饰键的点击。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "LDBClick(位置?) 和 LDBClick(位置, ctrl, shift, alt, osSuper)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发多个事件以模拟带可选修饰键的双击。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "提供了 M（中间）、R（右）、Mouse4 和 Mouse5 版本的 down、up、click 和 double-click 函数。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "鼠标滚轮交互",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这里是可用的鼠标滚轮交互函数列表： "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "protocol"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_Wheel(up, position?) 和 _Wheel(up, position, ctrl, shift, alt, osSuper)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 向前滚动滚轮。负数表示向后滚动。 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WheelDown"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 或 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WheelUp"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 用于以跳步方式滚动的快捷键时，一次跳跃的比例为 120。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_HWheel(right, position?) 和 _HWheel(right, position, ctrl, shift, alt, osSuper)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 向右滚动水平滚轮。负数表示向左滚动。 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "HWheelLeft"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 或 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "HWheelRight"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 用于以跳步方式滚动的快捷键时，一次跳跃的比例为 120。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "关键交互",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这里是可用的键交互函数列表： "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "protocol"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_KeyDown(key)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发一个按键按下事件。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_KeyDownRepeat(key)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发一个按键按下事件，由持续按住一个键触发。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "_KeyUp(key)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发一个按键释放事件。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "KeyPress(key) 和 KeyPress(key, ctrl, shift, alt, osSuper)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发多个事件以模拟带可选修饰键的按键按下。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TypeString(string) 和 TypeString(string, ctrl, shift, alt, osSuper)"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 触发一系列字符事件，可选修饰键。其他按键事件不会被触发。"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
