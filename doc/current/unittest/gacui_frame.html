<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Snapshots and Frames -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/article.css" />
<script src="/vczh-libraries-doc-zh/doc/current/scripts/rootView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/directoryView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/articleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "unittest",
    "gacui_frame"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "单元测试",
      "selected": false,
      "path": [
        "unittest",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "在单元测试框架中运行 GacUI",
          "selected": false,
          "path": [
            "unittest",
            "gacui"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "快照与帧",
              "selected": true,
              "path": [
                "unittest",
                "gacui_frame"
              ]
            },
            {
              "icon": " ",
              "name": "IO 交互",
              "selected": false,
              "path": [
                "unittest",
                "gacui_io"
              ]
            },
            {
              "icon": " ",
              "name": "访问控件",
              "selected": false,
              "path": [
                "unittest",
                "gacui_controls"
              ]
            },
            {
              "icon": " ",
              "name": "快照查看器",
              "selected": false,
              "path": [
                "unittest",
                "gacui_snapshots"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "快照与帧",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            如果你让单元测试框架从 GacUI XML 资源创建一个窗口，\n            您可以设置第 4 个参数的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUIUnitTest_StartFast_WithResourceAsText"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 提供一些回调函数。\n            类型是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUIUnitTest_Installer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 并且它有这些成员：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Func<void()> initialize;"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 它在窗口创建之前被调用。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Func<void(GuiWindow*)> installWindow;"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 它在窗口打开之前被调用。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Func<void()> finalize;"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 它在窗口关闭后被调用。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Nullable<UnitTestScreenConfig> config;"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 更多配置，包括字体列表、屏幕尺寸等。"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个测试用例通常以调用开始： "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUIUnitTest_SetGuiMainProxy"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 创建了多个框架。\n            建议您遵循以下规则：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "第一个帧的名称应为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Ready"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "其他帧的名称描述了前一帧中所执行的操作。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "在每个可见帧中，UI 变化必须被触发。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "由于每个IO操作在GacUI应用程序中所有事件处理完毕后才完成，如果一个操作调用了任何阻塞函数，应将其包装在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "当执行一个操作时，如果副作用是立即发生的，断言应放置在操作之后。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "当执行一个操作时，如果副作用是异步但快速发生的，断言应放置在下一帧的开始处。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "尽可能只保留上一帧的调用， "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "window->Close();"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 函数。此规则有时可能与前一条规则冲突，前一条规则优先级更高。"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "关于可见 UI 变化",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可见的 UI 变化是指导致 GacUI 刷新您应用程序中任何窗口的更改。\n                这包括更改文本、大小、布局；显示或隐藏窗口或控件；启用或禁用控件；在控件中选择或输入任何内容等。\n                单元测试框架将检测在某一帧中是否发生了任何可见的UI更改，\n                并且如果不存在，则测试失败。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT:"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不要仅为了断言而创建一个框架，因为它不会引起任何可见的 UI 变化。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "关于阻塞函数",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                阻塞函数是指不会返回但应用程序仍在运行的任何函数。\n                例如， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowDialog"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModalAndDelete"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "InvokeInMainThreadAndWait"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", etc.\n                任何在帧内进行的IO交互，只有在GacUI处理完所有事件后才会返回。\n                例如， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "protocol->LClick(location);"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " on a button only returns after "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Clicked"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及所有其他鼠标事件都被处理。\n                如果在任何此类事件中调用了阻塞函数，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LClick"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 阻塞当前帧，\n                并且单元测试框架检测到此类操作并使测试失败。\n                在这种情况下，调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LClick"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在……中 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "InvokeInMainThread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 而是。\n                "
              },
              {
                "kind": "Program",
                "code": "GetApplication()->InvokeInMainThread(window, [=]()\n{\n    protocol->LClick(location);\n});",
                "language": "c++"
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
