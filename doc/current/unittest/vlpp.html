<!DOCTYPE html>

<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {

    "vlpp"

};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "单元测试",
      "selected": false,
      "path": [
        "unittest",
        "home"
      ],
      "subNodes": [
        {
          "icon": " ",
          "name": "使用单元测试框架",
          "selected": true,
          "path": [
            "unittest",
            "vlpp"
          ]
        },
        {
          "icon": "+",
          "name": "在单元测试框架中运行 GacUI",
          "selected": false,
          "path": [
            "unittest",
            "gacui"
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "使用单元测试框架",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            启动单元测试框架的最简单方式如下：\n            "
          },
          {
            "kind": "Program",
            "code": "#include <Vlpp.h>\nusing namespace vl;\nusing namespace vl::unittest;\n\n#ifdef VCZH_MSVC\nint wmain(int argc , wchar_t* argv[])\n#else\nint main(int argc, char** argv)\n#endif\n{\n\tint result = unittest::UnitTest::RunAndDisposeTests(argc, argv);\n\tvl::FinalizeGlobalStorage();\n#ifdef VCZH_CHECK_MEMORY_LEAKS\n\t_CrtDumpMemoryLeaks();\n#endif\n\treturn result;\n}",
            "language": "c++"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            以这种方式，您可以传递 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/D"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/R"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/C"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/F"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 直接到你的单元测试二进制文件\n            并且它们将由单元测试框架正确处理。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            您可以为测试用例创建多个cpp文件，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/F"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 将自动对其作出反应。\n            一个典型的测试文件会是：\n            "
          },
          {
            "kind": "Program",
            "code": "#include <Vlpp.h>\nusing namespace vl;\nusing namespace vl::unittest;\n\nvoid AnError()\n{\n    CHECK_FAIL(L\"Not Implemented!\");\n}\n\nvoid AnException()\n{\n    throw Exception(L\"A message\");\n}\n\nTEST_FILE\n{\n    TEST_CASE(L\"This is a test case\")\n    {\n        TEST_ASSERT(1 + 1 == 2);\n    });\n\n    TEST_CATEGORY(L\"This is a test category\")\n    {\n        TEST_CASE(L\"This is another test case\")\n        {\n            TEST_ERROR(AnError());\n            TEST_EXCEPTION(AnException(), Exception, [](const Exception& e)\n            {\n                TEST_ASSERT(e.Message() == L\"A message\");\n            });\n        });\n    });\n}",
            "language": "c++"
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TEST_ASSERT(condition);"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 接受一个表达式，如果求值为 false 则失败。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TEST_ERROR(statement);"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 接受一个语句，如果未抛出异常则失败，或继承自 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Error"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ". 此类错误通常由 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CHECK_ERROR"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CHECK_FAIL"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TEST_EXCEPTION(statement,exception,handler);"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 执行语句，如果它不抛出异常或从……继承则失败 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "exception"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ". 处理程序将在该异常上被调用以进行额外的断言。"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            请注意，这些是宏，逗号可能会被意外解释。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_CATEGORY"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以用于分组其他 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_CATEGORY"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_CASE"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_ASSERT"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_ERROR"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_EXCEPTION"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 只能在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_CASE"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_CASE_ASSERT(condition);"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 是一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_CASE"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 仅包含一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TEST_ASSERT"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            如果你得到 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TestA.cpp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TestB.cpp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TestC.cpp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            使用 no "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/F"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 将使用……在全部三个文件中运行测试 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/F:Test*.cpp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 将使用……在全部三个文件中运行测试 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/F:TestA.cpp /F:TestB.cpp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 将运行测试在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TestA.cpp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TestB.cpp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 仅。\n        "
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
