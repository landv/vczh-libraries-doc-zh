<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Snapshot Viewer -- GPU Accelerated C++ User Interface (vczh)</title>

<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />

<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "unittest",
    "gacui_snapshots"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "单元测试",
      "selected": false,
      "path": [
        "unittest",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "在单元测试框架中运行 GacUI",
          "selected": false,
          "path": [
            "unittest",
            "gacui"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "快照与帧",
              "selected": false,
              "path": [
                "unittest",
                "gacui_frame"
              ]
            },
            {
              "icon": " ",
              "name": "IO 交互",
              "selected": false,
              "path": [
                "unittest",
                "gacui_io"
              ]
            },
            {
              "icon": " ",
              "name": "访问控件",
              "selected": false,
              "path": [
                "unittest",
                "gacui_controls"
              ]
            },
            {
              "icon": " ",
              "name": "快照查看器",
              "selected": true,
              "path": [
                "unittest",
                "gacui_snapshots"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "快照查看器",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            After running the GacUI unit test,\n            snapshots will be stored in a folder specified by "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "UnitTestFrameworkConfig::snapshotFolder"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ",\n            which is passed to "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUIUnitTest_Initialize"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " function.\n            You can write your own snapshot viewer to render any snapshot from a test run like this.\n            "
          },
          {
            "kind": "Program",
            "code": "#include <GacUI.UnitTest.UI.h>\n#include <Windows.h>\n\nusing namespace vl;\nusing namespace vl::filesystem;\nusing namespace vl::presentation;\nusing namespace vl::presentation::controls;\nusing namespace vl::presentation::unittest;\nusing namespace gaclib_controls;\n\nvoid GuiMain()\n{\n    theme::RegisterTheme(Ptr(new darkskin::Theme));\n    {\n        // you can use GetApplication()->GetExecutablePath() if hardcoding a relative path to the folder contains the executable is possible.\n        FilePath snapshotFolderPath = ...;\n        UnitTestSnapshotViewerAppWindow window(Ptr(new UnitTestSnapshotViewerViewModel(snapshotFolderPath)));\n        window.ForceCalculateSizeImmediately();\n        window.MoveToScreenCenter();\n        window.WindowOpened.AttachLambda([&](auto&&...)\n        {\n            window.ShowMaximized();\n        });\n        GetApplication()->Run(&window);\n    }\n}\n\nint CALLBACK WinMain(HINSTANCE hInstance, HINSTANCE hPrevInstance, LPSTR lpCmdLine, int CmdShow)\n{\n    return SetupWindowsDirect2DRenderer();\n}",
            "language": "c++"
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "UnitTestSnapshotViewerAppWindow"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 以及 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "UnitTestSnapshotViewerViewModel"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " are defined in "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUI.UnitTest.UI"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
