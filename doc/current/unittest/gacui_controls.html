<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Accessing Controls -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/article.css" />
<script src="/vczh-libraries-doc-zh/doc/current/scripts/rootView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/directoryView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/articleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "unittest",
    "gacui_controls"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "单元测试",
      "selected": false,
      "path": [
        "unittest",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "在单元测试框架中运行 GacUI",
          "selected": false,
          "path": [
            "unittest",
            "gacui"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "快照与帧",
              "selected": false,
              "path": [
                "unittest",
                "gacui_frame"
              ]
            },
            {
              "icon": " ",
              "name": "IO 交互",
              "selected": false,
              "path": [
                "unittest",
                "gacui_io"
              ]
            },
            {
              "icon": " ",
              "name": "访问控件",
              "selected": true,
              "path": [
                "unittest",
                "gacui_controls"
              ]
            },
            {
              "icon": " ",
              "name": "快照查看器",
              "selected": false,
              "path": [
                "unittest",
                "gacui_snapshots"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "访问控件",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当一个窗口或自定义控件从 GacUI XML 资源创建时，\n            并且您需要特定子对象的指针，\n            你不必 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "public"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 它们。\n            这里列出了通过其访问特定控件、组合或组件的函数： "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ref.Name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 属性，\n            或通过其文本访问控件，\n            在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "vl::presentation::controls"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " namespace.\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "FindObjectByName(rootObject, name)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The first parameter must be an object that created by an <Instance/>, e.g. a window or a custom control.\n                The second parameter must be an object that directly inside that particular <Instance/> with "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ref.Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 分配的属性。\n                如果没有找到任何内容，函数会崩溃。\n                "
              },
              {
                "kind": "Program",
                "code": "auto button = FindObjectByName(window, L\"buttonSomething\");",
                "language": "c++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "TryFindObjectByName(rootObject, name)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                与……相同 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FindObjectByName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，但如果找不到任何内容，则返回 null。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "FindObjectByName(rootObject, name1, name2, ...)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这是链式调用的快捷方式：to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "... FindObjectByName(FindObjectByName(rootObject, name1), name2) ..."
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                当你的目标对象位于窗口中的嵌套自定义控件内时，它很有用，\n                您需要提供所有内容 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ref.Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 层次结构中的属性。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT:"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 此类自定义控件必须通过 <Instance/> 创建。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "FindControlByText<Type>(control, text)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                第一个参数必须是一个控件\n                这是目标子控件的文本。\n                如果没有找到与类型和文本匹配的内容，函数会崩溃。\n                否则它将返回所有匹配控件中的一个随机控件。\n                与……不同 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FindObjectByName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，你可以使用此函数搜索嵌套的自定义控件。\n                "
              },
              {
                "kind": "Program",
                "code": "auto button = FindControlByText<GuiButton>(window, L\"Click Me!\");",
                "language": "c++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "TryFindControlByText<Type>(control, text)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                与……相同 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FindControlByText"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，但如果找不到任何内容，则返回 null。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
