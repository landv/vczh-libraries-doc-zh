<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Accessing Controls -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/article.css" />
<script src="/vczh-libraries-doc-zh/doc/current/scripts/rootView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/directoryView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/articleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "unittest",
    "gacui_controls"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "单元测试",
      "selected": false,
      "path": [
        "unittest",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "在单元测试框架中运行 GacUI",
          "selected": false,
          "path": [
            "unittest",
            "gacui"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "快照与帧",
              "selected": false,
              "path": [
                "unittest",
                "gacui_frame"
              ]
            },
            {
              "icon": " ",
              "name": "IO 交互",
              "selected": false,
              "path": [
                "unittest",
                "gacui_io"
              ]
            },
            {
              "icon": " ",
              "name": "访问控件",
              "selected": true,
              "path": [
                "unittest",
                "gacui_controls"
              ]
            },
            {
              "icon": " ",
              "name": "快照查看器",
              "selected": false,
              "path": [
                "unittest",
                "gacui_snapshots"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "访问控件",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            When a window or a custom control is created from GacUI XML Resource,\n            and you need the pointer to a specific sub object,\n            you don't have to "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "public"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " them.\n            Here are functions to access a specific control, composition or component by its "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ref.Name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " attribute,\n            or to access a control by its text,\n            defined in the "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "vl::presentation::controls"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " namespace.\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "FindObjectByName(rootObject, name)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The first parameter must be an object that created by an <Instance/>, e.g. a window or a custom control.\n                The second parameter must be an object that directly inside that particular <Instance/> with "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ref.Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " attribute assigned.\n                If nothing is found, the function crashes.\n                "
              },
              {
                "kind": "Program",
                "code": "auto button = FindObjectByName(window, L\"buttonSomething\");",
                "language": "c++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "TryFindObjectByName(rootObject, name)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                与……相同 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FindObjectByName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，但如果找不到任何内容，则返回 null。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "FindObjectByName(rootObject, name1, name2, ...)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                This is a shortcut of a chain call: to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "... FindObjectByName(FindObjectByName(rootObject, name1), name2) ..."
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                It is useful when your target object is inside nested custom controls in a window,\n                you need to provide all "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ref.Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " attributes in the hierarchy.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT:"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " such custom controls must be created by <Instance/>.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "FindControlByText<Type>(control, text)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The first parameter must be a control.\n                The is the text of the target sub control.\n                If nothing is found matching the type and the text, the function crashes.\n                Otherwise it would return a random one within all matching controls.\n                Unlike "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FindObjectByName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", you can use this function to search into nested custom controls.\n                "
              },
              {
                "kind": "Program",
                "code": "auto button = FindControlByText<GuiButton>(window, L\"Click Me!\");",
                "language": "c++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "TryFindControlByText<Type>(control, text)",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                与……相同 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FindControlByText"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，但如果找不到任何内容，则返回 null。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
