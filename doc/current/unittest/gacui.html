  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "在单元测试框架中运行 GacUI",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            启动单元测试框架的最简单方式如下：\n            "
          },
          {
            "kind": "Program",
            "code": "#include <GacUI.UnitTest.h>\nusing namespace vl;\nusing namespace vl::unittest;\nusing namespace vl::presentation::unittest;\n\n#ifdef VCZH_MSVC\nint wmain(int argc , wchar_t* argv[])\n#else\nint main(int argc, char** argv)\n#endif\n{\n    UnitTestFrameworkConfig config;\n    config.snapshotFolder = L\"...\";\n    config.resourceFolder = L\"...\";\n    GacUIUnitTest_Initialize(&config);\n    int result = unittest::UnitTest::RunAndDisposeTests(argc, argv);\n    GacUIUnitTest_Finalize();\n#ifdef VCZH_CHECK_MEMORY_LEAKS\n    _CrtDumpMemoryLeaks();\n#endif\n    return result;\n}",
            "language": "c++"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个典型的测试文件会是：\n            "
          },
          {
            "kind": "Program",
            "code": "#include <GacUI.UnitTest.h>\nusing namespace vl;\nusing namespace vl::presentation;\nusing namespace vl::presentation::controls;\nusing namespace vl::presentation::unittest;\n\nTEST_FILE\n{\n    const auto resourceSingleButton = LR\"GacUISrc(\n<Resource>\n  <Instance name=\"MainWindowResource\">\n    <Instance ref.Class=\"gacuisrc_unittest::MainWindow\">\n      <Window ref.Name=\"self\" Text=\"GuiButton\" ClientSize=\"x:320 y:240\">\n        <Button ref.Name=\"button\" Text=\"This is a Button\">\n          <ev.Clicked-eval>...</ev.Clicked-eval>\n        </Button>\n      </Window>\n    </Instance>\n  </Instance>\n</Resource>\n)GacUISrc\";\n\n    TEST_CASE(L\"ClickOnMouseUp\")\n    {\n        GacUIUnitTest_SetGuiMainProxy([](UnitTestRemoteProtocol* protocol, IUnitTestContext*)\n        {\n            protocol->OnNextIdleFrame(L\"Ready\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                auto button = FindObjectByName<GuiButton>(window, L\"button\");\n                auto location = protocol->LocationOf(button);\n                protocol->LClick(location);\n            });\n            protocol->OnNextIdleFrame(L\"Close\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                window->Hide();\n            });\n        });\n        GacUIUnitTest_StartFast_WithResourceAsText<darkskin::Theme>(\n            WString::Unmanaged(L\"Controls/Basic/GuiButton/ClickOnMouseUp\"),\n            WString::Unmanaged(L\"gacuisrc_unittest::MainWindow\"),\n            resourceSingleButton\n            );\n    });\n}",
            "language": "c++"
          },
          {
            "kind": "Text",
            "text": "\n            或者如果你正在加载一个现有的窗口而不是从 GacUI XML 资源创建一个：\n            "
          },
          {
            "kind": "Program",
            "code": "#include <GacUI.UnitTest.h>\nusing namespace vl;\nusing namespace vl::presentation;\nusing namespace vl::presentation::controls;\nusing namespace vl::presentation::unittest;\n\nTEST_FILE\n{\n    TEST_CASE(L\"ClickOnMouseUp\")\n    {\n        GacUIUnitTest_SetGuiMainProxy([](UnitTestRemoteProtocol* protocol, IUnitTestContext*)\n        {\n            protocol->OnNextIdleFrame(L\"Ready\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                auto button = FindObjectByName<GuiButton>(window, L\"button\");\n                auto location = protocol->LocationOf(button);\n                protocol->LClick(location);\n            });\n            protocol->OnNextIdleFrame(L\"Close\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                window->Hide();\n            });\n        });\n        GacUIUnitTest_LinkGuiMainProxy([=](\n            vl::presentation::unittest::UnitTestRemoteProtocol* protocol,\n            vl::presentation::unittest::IUnitTestContext* context,\n            const vl::presentation::unittest::UnitTestMainFunc& previousMainProxy\n            )\n        {\n            {\n                vl::presentation::remoteprotocol::ControllerGlobalConfig globalConfig;\n#if defined VCZH_WCHAR_UTF16\n                globalConfig.documentCaretFromEncoding = vl::presentation::remoteprotocol::CharacterEncoding::UTF16;\n#elif defined VCZH_WCHAR_UTF32\n                globalConfig.documentCaretFromEncoding = vl::presentation::remoteprotocol::CharacterEncoding::UTF32;\n#endif\n                protocol->GetEvents()->OnControllerConnect(globalConfig);\n            }\n            auto theme = vl::Ptr(darkskin::Theme);\n            vl::presentation::theme::RegisterTheme(theme);\n            {\n                gacuisrc_unittest::MainWindow window;\n                window.MoveToScreenCenter();\n                previousMainProxy(protocol, context);\n                vl::presentation::controls::GetApplication()->Run(&window);\n            }\n            vl::presentation::theme::UnregisterTheme(theme->Name);\n        });\n        GacUIUnitTest_Start(WString::Unmanaged(L\"Controls/Basic/GuiButton/ClickOnMouseUp\"));\n    });\n});",
            "language": "c++"
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "关于快照和帧",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此测试用例将在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestFrameworkConfig::snapshotFolder"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                在路径下 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Controls/Basic/GuiButton"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                将会有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClickOnMouseUp.json"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 并且两个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClickOnMouseUp/frame_*.json"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，以及其他一些 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClickOnMouseUp.*.json"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 文件。\n                如果你 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "git 提交"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 他们，\n                在运行一个测试用例后，你可以轻松找出哪些测试用例受到了影响。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在此测试用例中，单元测试框架执行以下操作：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "编译资源并运行 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "gacuisrc_unittest::MainWindow"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 作为主窗口，不提供任何参数。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "等待布局完成。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "将当前界面的快照保存到 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "frame_0.json"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "单击按钮。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "等待布局完成。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "将当前界面的快照保存到 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "frame_1.json"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "退出。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                每个框架都需要进行一些可见的UI更改，\n                单元测试框架将检测并失败，如果未做出任何可见的用户界面更改。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                每个框架不应直接调用阻塞函数。\n                例如，如果一个按钮显示一个对话框，\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowDialog"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModalAndDelete"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数仅在对话框关闭后返回，\n                这些函数是阻塞函数。\n                当点击显示对话框的按钮时，\n                您应该使用：\n                "
              },
              {
                "kind": "Program",
                "code": "GetApplication()->InvokeInMainThread(window, [=]()\n{\n    protocol->LClick(location);\n});",
                "language": "c++"
              },
              {
                "kind": "Text",
                "text": "\n                下一帧将在对话框显示后立即开始，\n                然后您可以与它交互。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModalAsync"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 没有这样的限制。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                因此，框架的标题应描述操作前UI的外观。\n                或者只是描述前一帧所做的操作，\n                在执行帧内代码之前，作为快照结合标题名称进行捕获。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "使用图像",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestFrameworkConfig::resourceFolder"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " GacUI 资源在编译时是否直接生效？\n                如果需要添加其他资源文件，例如图像，你可以将它们放在这里。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n             以下代码展示了如何在资源中引用图像文件：\n                "
              },
              {
                "kind": "Program",
                "code": "<Resource>\n  <Folder name=\"UnitTestConfig\" content=\"Link\">ListViewImagesData.xml</Folder>\n  <Folder name=\"ListViewImages\" content=\"Link\">ListViewImagesFolder.xml</Folder>\n  ...\n</Resource>",
                "language": "xml"
              },
              {
                "kind": "Text",
                "text": "\n                通过这样说， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesData.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesFolder.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 应置于 under "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestFrameworkConfig::resourceFolder"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesData.xml"
                  }
                ]
              },
              {
                "kind": "Program",
                "code": "<Folder>\n  <Xml name=\"ImageData\">\n    <ImageData>\n      <Image Path=\"ListViewImages/LargeImages/Cert\" Format=\"Png\" Width=\"32\" Height=\"32\"/>\n      ...\n    </ImageData>\n  </Xml>\n</Folder>",
                "language": "xml"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesFolder.xml"
                  }
                ]
              },
              {
                "kind": "Program",
                "code": "<Folder>\n  <Folder name=\"LargeImages\">\n    <Image name=\"Cert\" content=\"File\">Cert_32.png</Image>\n    ...\n  </Folder>\n  ...\n</Folder>",
                "language": "xml"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                单元测试框架实际上不会读取图像文件，\n                但为了执行UI布局，\n                它将改而读取 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestConfig/ImageData"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 搜索图像的元数据。\n                在此示例中，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "res://ListViewImages/LargeImages/Cert"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将匹配记录 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Format=\"Png\" Width=\"32\" Height=\"32\""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};

  window["MVC-Resources.mvcViews"] = mvcViews;

  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;

    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));

      "(function(){" + scriptTag.innerHTML + "})()"

}
