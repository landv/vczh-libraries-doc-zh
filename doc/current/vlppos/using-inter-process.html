                "kind": "Text",
                "text": "\n                小型通道客户端遵循以下结构：\n                "
              },
              {
                "kind": "Program",
                "code": "using namespace vl;\r\nusing namespace vl::collections;\r\nusing namespace vl::inter_process;\r\n\r\nconstexpr const wchar_t* ChatChannelName = L\"Chat\";\r\n\r\nstruct WStringListSerializer\r\n{\r\n    using SourceType = List<WString>;\r\n    using DestType = WString;\r\n    using ContextType = std::nullptr_t;\r\n\r\n    static void Serialize(const ContextType&, const SourceType& source, DestType& dest)\r\n    {\r\n        dest = WString::Empty;\r\n        for (auto&& item : source)\r\n        {\r\n            dest += itow(item.Length()) + L\":\" + item;\r\n        }\r\n    }\r\n\r\n    static void Deserialize(const ContextType&, const DestType& dest, SourceType& source)\r\n    {\r\n        source.Clear();\r\n        const wchar_t* reading = dest.Buffer();\r\n        const wchar_t* end = reading + dest.Length();\r\n        while (reading < end)\r\n        {\r\n            auto delimiter = wcschr(reading, L':');\r\n            CHECK_ERROR(delimiter && delimiter < end, L\"Invalid package.\");\r\n\r\n            auto length = wtoi(WString::CopyFrom(reading, (vint)(delimiter - reading)));\r\n            CHECK_ERROR(length >= 0 && delimiter + 1 + length <= end, L\"Invalid package length.\");\r\n\r\n            source.Add(WString::CopyFrom(delimiter + 1, length));\r\n            reading = delimiter + 1 + length;\r\n        }\r\n    }\r\n};\r\n\r\nusing ChatChannelClientBase =\r\n    NetworkProtocolChannelClient<WString, WStringListSerializer>;\r\n\r\nclass ChatClient\r\n    : public ChatChannelClientBase\r\n    , public virtual IChannelReader<WString>\r\n{\r\nprivate:\r\n    IChannelClient<WString>::ChannelMap channelNames;\r\n    IChannel<WString>* chat = nullptr;\r\n\r\npublic:\r\n    ChatClient(Ptr<INetworkProtocolClient> transport)\r\n        : ChatChannelClientBase(transport)\r\n    {\r\n        channelNames.Add(ChatChannelName, nullptr);\r\n        auto&& channels = GetChannels();\r\n        auto index = channels.Keys().IndexOf(ChatChannelName);\r\n        CHECK_ERROR(index != -1, L\"Missing chat channel.\");\r\n        chat = channels.Values()[index];\r\n        chat->Initialize(this);\r\n    }\r\n\r\n    const IChannelClient<WString>::ChannelNameList& OnGetChannelNames() override\r\n    {\r\n        return channelNames.Keys();\r\n    }\r\n\r\n    void OnConnected(vint clientId) override\r\n    {\r\n        // Record the assigned positive client id if the feature needs it.\r\n    }\r\n\r\n    void OnRead(vint senderClientId, const WString& package) override\r\n    {\r\n        // Handle one typed package from senderClientId.\r\n    }\r\n\r\n    void Send(vint receiverClientId, const WString& package)\r\n    {\r\n        bool disconnected = false;\r\n        chat->SendToClient(receiverClientId, package);\r\n        chat->BatchWrite(disconnected);\r\n        if (disconnected)\r\n        {\r\n            // Stop using this client.\r\n        }\r\n    }\r\n};",
                "language": "C++"

                      {
                        "kind": "Text",
                        "text": ": 开始接受，调用 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OnClientConnected"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 与 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Ptr<INetworkProtocolConnection>"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 用于接受的传输连接，停止所有已拥有连接并报告已停止状态。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                连接-接入回调携带生产者的现有拥有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 通过异步套接字、HTTP 请求、网络协议和通道层。\n                重写应接受这一点 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 并向前传递或存储它而不构造另一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 从回调参数或从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": ".Obj()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                Use "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": ".Obj()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 仅当现有操作需要临时原始指针时；这样做不会转移所有权。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "InstallCallback"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 应调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OnInstalled"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 通过连接。\n                传递 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "nullptr"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 卸载回调。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BeginReadingLoopUnsafe"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 开始异步接收消息，但调用者必须容忍在安装回调后已接收数据的实现。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Stop"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是关闭边界；在此返回后，挂起的传输回调不应再访问已停止的对象。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                原始客户端必须从返回一个连接对象 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetConnection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，但在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "WaitForServer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 结束在合同之外。\n                原始服务器在报告客户端连接回调之前不应 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Start"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或之后 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Stop"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果连接丢失，相同的连接对象不会重新连接；重新连接的传输应创建一个新的连接对象。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在存在原始传输后，重用通道桥接而不是重新实现通道路由：\n                "
              },
              {
                "kind": "Program",
                "code": "class MyConnection : public Object, public virtual INetworkProtocolConnection\r\n{\r\n    // Store one callback, frame transport bytes into WString messages,\r\n    // call OnReadString / OnLocalError / OnDisconnected, and drain callbacks in Stop.\r\n};\r\n\r\nclass MyClient : public Object, public virtual INetworkProtocolClient\r\n{\r\n    // Own one MyConnection and implement WaitForServer / GetStatus.\r\n};\r\n\r\nclass MyServer : public Object, public virtual INetworkProtocolServer\r\n{\r\n    // Accept MyConnection objects and pass their existing owning Ptr\r\n    // unchanged to OnClientConnected.\r\n};\r\n\r\nusing MyChannelServer =\r\n    NetworkProtocolChannelServer<MyPackage, MyPackageListSerializer, MyServer>;\r\n\r\nusing MyChannelClient =\r\n    NetworkProtocolChannelClient<MyPackage, MyPackageListSerializer>;",
                "language": "C++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "默认通道桥接",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NetworkProtocolChannelServer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NetworkProtocolChannelClient"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NetworkProtocolLocalChannelClient"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将通道批次转换为原始数据 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "WString"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 协议消息。\n                桥接需要一个序列化器，其中：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TSerialization::SourceType"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "collections::List<TPackage>"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TSerialization::DestType"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WString"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TSerialization::ContextType"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 存储可选的序列化状态，或 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "std::nullptr_t"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 当不需要状态时。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Serialize"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 将包列表转换为一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WString"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Deserialize"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 转换一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WString"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 返回包列表。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                桥接使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NetworkPackage"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 作为原始文本包装器。\n                它的字符串形状是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "clientId,extraClientId1,...;channelName;messageBody"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                对于客户端到服务器的消息， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "clientId"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是直接接收者 ID；空 ID 表示广播，额外的 ID 是被阻止的广播接收者。\n                对于服务器到客户端的消息， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "clientId"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是正数发送者ID。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                网络通道客户端通过发送一个握手包来连接，该握手包包含空的客户端ID、空的通道名称以及所有支持的通道名称，用分隔符连接。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "!"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                服务器验证名称，分配一个正的客户端ID，记录通道成员资格，并在空通道响应中将ID返回。\n                那之后，仅当发送方和接收方成员资格与频道名称匹配时，才会传递正常频道包。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在 Windows 命名管道上的通道服务器可以这样声明：\n                "
              },
              {
                "kind": "Program",
                "code": "#include <vlppos.h>\r\n#include <VlppOS.Windows.h>\r\n\r\nusing namespace vl;\r\nusing namespace vl::inter_process;\r\n\r\nclass ChatServer\r\n    : public NetworkProtocolChannelServer<WString, WStringListSerializer, named_pipe::NamedPipeServer>\r\n{\r\npublic:\r\n    ChatServer(const WString& pipeName)\r\n        : NetworkProtocolChannelServer<WString, WStringListSerializer, named_pipe::NamedPipeServer>(pipeName)\r\n    {\r\n    }\r\n\r\n    WaitForClientResult OnClientConnected(\r\n        vint clientId,\r\n        const IChannelClient<WString>::ChannelNameList& availableChannels,\r\n        Ptr<IChannelClient<WString>> localClient) override\r\n    {\r\n        return availableChannels.Contains(ChatChannelName)\r\n            ? WaitForClientResult::Accept\r\n            : WaitForClientResult::Reject;\r\n    }\r\n};\r\n\r\nauto server = Ptr(new ChatServer(L\"ExamplePipe\"));\r\nserver->Start();",
                "language": "C++"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "便携式异步套接字实现",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                类型在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::inter_process::async_tcp_socket"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 构建一个便携式、仅支持回环的异步TCP字节、HTTP/1.1请求和小型HTTP服务栈。\n                平台中立的工厂选择 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "windows_socket::AsyncSocketServer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AsyncSocketClient"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "linux_socket::AsyncSocketServer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AsyncSocketClient"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，或 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "macos_socket::AsyncSocketServer"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AsyncSocketClient"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在应用程序组合边界处。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "直接长度定界传输",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "async_tcp_socket::NetworkProtocolServer<TAsyncSocketServer>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "async_tcp_socket::NetworkProtocolClient<TAsyncSocketClient>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当双方都使用 VlppOS 且无需 HTTP 兼容时。\n                    一个逻辑连接对应一个物理 TCP 套接字。\n                    每个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WString"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是用其字符数和原生 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "wchar_t"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 字节，因此在具有不同 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "wchar_t"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 表示。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这些模板从转发的构造函数参数中构建其套接字后端，因此请为目标选择具体类型：\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "windows_socket::AsyncSocketServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AsyncSocketClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "linux_socket::AsyncSocketServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AsyncSocketClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，或\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "macos_socket::AsyncSocketServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AsyncSocketClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，并将端口传递给协议适配器。\n                    它们不接受注入的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Ptr<IAsyncSocketServer>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 或 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Ptr<IAsyncSocketClient>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IAsyncSocketServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IAsyncSocketClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IAsyncSocketConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IAsyncSocketCallback"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 暴露底层的有序全双工字节流。\n                    返回接口的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CreateDefaultAsyncSocketServer(port)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CreateDefaultAsyncSocketClient(port)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 工厂用于消耗这些套接字接口的代码，包括注入的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SocketHttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SocketHttpClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 下面的依赖项。\n                    每个套接字都通过其不可变的回环端口暴露 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetPort"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，并且 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IAsyncSocketClient::CreateSameEndpointClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 在同一端点的另一个物理通道上创建一个新的客户端。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "HTTP 兼容套接字传输",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "async_tcp_socket::SocketHttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "async_tcp_socket::SocketHttpClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当传输必须使用 VlppOS HTTP 传输协议或与 Windows HTTP 实现互操作时。\n                    它们实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 通过便携式迷你HTTP堆栈。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    公共构造表面保持原生套接字组合的显式性：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "SocketHttpServer(\r\n    Ptr<IAsyncSocketServer> socketServer,\r\n    const WString& urlPrefix\r\n    );\r\n\r\nSocketHttpClient(\r\n    Ptr<IAsyncSocketClient> socketClient,\r\n    const WString& server,\r\n    const WString& urlPrefix\r\n    );",
                    "language": "C++"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    服务器适配器使用注入的监听器，从不创建另一个监听器。\n                    客户端使用注入的客户端作为其第一个物理通道并调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CreateSameEndpointClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 对于全双工轮询和恢复所需的附加通道。\n                    服务器名称必须选择回环，且URL前缀对于源根为空或以开始。 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "/"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    适配器使用相同的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "/VlppInterProcess/Connect"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "/VlppInterProcess/Request/{token}"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "/VlppInterProcess/Response/{token}"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 路由作为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "windows_http::HttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "windows_http::HttpClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    该协议没有消息级别的交付确认、去重、心跳或断开连接路由，因此不应被视为精确一次交付\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "便携式迷你 HTTP 请求辅助工具",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "async_tcp_socket::HttpRequest"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HttpResponse"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HttpRequestServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HttpRequestClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HttpRequestConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 提供较低的 HTTP/1.1 消息层。\n                    当代码需要完整的二进制安全请求和响应对象，并且直接控制每个连接时使用它们。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "async_tcp_socket::SocketHttpServerApi"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SocketHttpRequestContext"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SocketHttpClientApi"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 添加前缀分派和请求/响应便捷功能。\n                    服务器 API 接收 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "(socketServer, urlPrefix)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，并且多个 API 仅在接收到完全相同的服务器对象时才共享一个监听器。\n                    Override "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "OnHttpRequestReceived"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，检查相对路径、查询或UTF-8正文，并用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Respond"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RespondStatus"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RespondBytes"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RespondUtf8"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 或 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Cancel"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    客户端 API 接收 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "(socketClient, server)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 并将异步操作加入队列。 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HttpQuery"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 调用。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SocketHttpClientApi"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "windows_http::HttpRequest"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HttpResponse"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HttpError"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 值类型，但这些类型是平台中立的，此处使用它们不会调用 WinHTTP。\n                    本节中的 TCP、HTTP 和 Mini HTTP 实现是本地测试、验证和演示基础设施，而非生产级 Web 堆栈。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Windows 实现",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                命名管道和传统的 HTTP.sys/WinHTTP 传输仅限于 Windows。\n                它们可用于本地测试，并作为原始协议合约的参考实现，但不应使可移植的功能代码依赖它们，也不应将其视为生产通信栈。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "命名管道传输",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::named_pipe::NamedPipeServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::named_pipe::NamedPipeClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 派生自 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::named_pipe::NamedPipeConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 并实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::named_pipe::NamedPipeConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    服务器在中启动重叠命名管道接受。 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Start"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 并拥有已接受的连接和待处理的连接。\n                    客户端打开 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\\\\.\\pipe\\NAME"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，等待服务器并切换管道到消息读取模式。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SendString"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 框架一个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WString"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 带长度数据。\n                    实现分块写入，因为Windows命名管道消息限制为64K字节。\n                    破碎管道情况会变成断开连接事件，致命的本地管道故障会变成 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "OnLocalError"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 然后断开连接。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "HTTP 传输",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 派生自 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServerApi"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 并实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 同时实现 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocolConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    此传输是基于 Windows HTTP API 的原始协议实现，而非通用的 Web 框架。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    原始 HTTP 协议在配置的基 URL 下使用这些路由：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GET /VlppInterProcess/Connect"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 创建一个逻辑连接并返回每个连接的请求和响应 URL。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "POST /VlppInterProcess/Request/GUID"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 是客户端维护的长轮询请求，用于接收服务器到客户端的消息。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "POST /VlppInterProcess/Response/GUID"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 发送客户端到服务器的消息，并可能接收一个排队的服务器到客户端消息。"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpClient::WaitForServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 发送连接请求，验证返回的URL，记录并报告连接状态。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BeginReadingLoopUnsafe"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 启动长轮询请求循环。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SendString"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 发布到响应URL。\n                    连接和响应失败会有限次数重试；请求失败则在客户端仍在运行时持续重试。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 创建一个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServerConnection"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 每个连接请求。\n                    服务器到客户端的消息会尽可能通过挂起的长轮询请求返回，否则将被排队，直到下一次请求。\n                    客户端到服务器的请求体作为传入字符串分派。\n                    当服务器停止时，挂起的长轮询请求将被取消，连接回调将收到断开连接的通知。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Windows HTTP 助手 API",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpClientApi"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServerApi"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是由 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 以及 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    当 Windows 功能需要异步 HTTP 请求和响应行为但又不采用原始的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocol"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 传输形状。\n                "
                  }
                ]
              },
              {
