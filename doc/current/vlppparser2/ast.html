        }

    }
  ]

  const article = {
  "index": false,
  "numberBeforeTitle": false,

    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个AST定义由多个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Enum"
              }

          },
          {
            "kind": "Text",
            "text": " 以及 "

          {
            "kind": "Strong",

              {
                "kind": "Text",
                "text": "Class"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            A "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",

              }

          {
            "kind": "Text",
            "text": " 可以放在任何类型定义之前，使其在另一个 AST 定义文件中可见。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            可以使用……编写单行注释 "
          },
          {
            "kind": "Strong",

          }

            "kind": "Paragraph",
            "content": [

            "kind": "Paragraph",
            "content": [

                    "kind": "ContentListItem",

                        "kind": "Text",
                        "text": ": vl::glr::ParsingToken"

                    "kind": "ContentListItem",

                      {
                        "kind": "Strong",
                        "content": [

                    "kind": "ContentListItem",

                        "kind": "Strong",

                            "kind": "Text",

                      },
                      {
                        "kind": "Text",
                        "text": ": vl::Ptr<ClassType>"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "数组转换为类类型"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": vl::collections::List<vl::Ptr<ClassType>>"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                A "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@ambiguous"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以在类定义之前使用，\n                表示此类型的任何语法规则都允许产生歧义的结果。\n                这种规则的类型被重写为 "

                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClassTypeToResolve"

                "kind": "Text",
                "text": "，\n                带一个成员 "
              },

                "kind": "Strong",
                "content": [

                    "kind": "Text",
                    "text": "var candidates : ClassType[];"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 存储所有可能由相同输入产生的结果。\n                子类型到模糊类型的规则不允许自动模糊，\n                但你可以显式指定类型，以使此规则使用模糊的基类型。\n            "
              }
            ]
          }

      }
    ]
  }

  window["MVC-Resources.directoryInfo"] = directoryInfo;

    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
