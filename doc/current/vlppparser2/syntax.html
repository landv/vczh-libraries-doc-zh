                    "kind": "Text",

                    "kind": "Text",
                    "text": "!RuleName"

      {

        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当您希望在匹配规则时排除某些内容时，可以使用开关。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "switch A, !B, ...;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 必须出现在语法定义的最顶部，以声明此文件中使用的所有开关。\n                开关对所有语法文件可见，因此它们的名称必须在全球范围内唯一。\n                每个开关都有其默认值，这里 "

                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A"
                  }

              {

                "kind": "Strong",

                    "kind": "Text",
                    "text": "B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 为关闭状态。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果我们想要实现某些仅在特定开关开启或关闭时才可用的语法：\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "?(Condition1:Syntax1 | Condition2:; | ...)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                这是一种启用开关的替代语法。\n                每个分支仅在满足其条件时才可用。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                一个条件可能看起来像\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(A && !B | !C) && D"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在启用切换的替代语法中，\n                每个分支按顺序进行测试，\n                只有第一个满足条件的分支会被选中。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\";\""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 表示语法无效。\n                当它被选中时，整个子句将被禁用。\n                如果此类选择的无效语法位于另一个备选语法中，\n                只有该分支变得无效。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                要为一段语法指定开关值：\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "!(!A, B, ...; Syntax)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                仅在内部 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Syntax"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 引用的开关已分配新值。\n                在此示例中， "

              {
                "kind": "Strong",
                "content": [

                    "kind": "Text",
                    "text": "A"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 变成关闭状态，并且 "

              {

                    "text": "B"

              },
              {
                "kind": "Text",
                "text": " 变成开启状态。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                带有新值的开关将被纳入考虑。 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Syntax"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 递归地进行，直到遇到另一个 switch 值赋值。\n            "
              }
            ]
          }
        ]
