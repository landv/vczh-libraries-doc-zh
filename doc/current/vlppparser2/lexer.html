<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Lexer Definition -- GPU Accelerated C++ User Interface (vczh)</title>
<link rel="shortcut icon" href="/vczh-libraries-doc-zh/doc/current/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/global.css" />
<link rel="stylesheet" type="text/css" href="/vczh-libraries-doc-zh/doc/current/article.css" />
<script src="/vczh-libraries-doc-zh/doc/current/scripts/rootView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/directoryView.js"></script>
<script src="/vczh-libraries-doc-zh/doc/current/scripts/articleView.js"></script>

</head>
<body>
<div id="MVC-ViewContainer"></div>
<script lang="javascript">
{
  const mvcModel = {
  "path": [
    "vlppparser2",
    "lexer"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "Vlpp Parser2",
      "selected": false,
      "path": [
        "vlppparser2",
        "home"
      ],
      "subNodes": [
        {
          "icon": " ",
          "name": "AST Definition",
          "selected": false,
          "path": [
            "vlppparser2",
            "ast"
          ]
        },
        {
          "icon": " ",
          "name": "Lexer Definition",
          "selected": true,
          "path": [
            "vlppparser2",
            "lexer"
          ]
        },
        {
          "icon": " ",
          "name": "Syntax Definition",
          "selected": false,
          "path": [
            "vlppparser2",
            "syntax"
          ]
        },
        {
          "icon": " ",
          "name": "Generated APIs",
          "selected": false,
          "path": [
            "vlppparser2",
            "apis"
          ]
        },
        {
          "icon": "+",
          "name": "参考",
          "selected": false,
          "path": [
            "vlppparser2",
            "ref"
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "词法分析器定义",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            词法定义由多个标记组成。\n            非废弃标记的名称可用于语法定义中。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            可以使用……编写单行注释 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "//"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个标记可以由以下定义：\n            "
          },
          {
            "kind": "Program",
            "code": "TokenName           :REGEX",
            "language": "Lexer"
          },
          {
            "kind": "Text",
            "text": "\n            空格允许出现在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\":\""
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 但之后，之后的一切 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\":\""
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在此行中被视为定义标记的正则表达式。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个被丢弃的令牌可以定义为：\n            "
          },
          {
            "kind": "Program",
            "code": "discard TokenName   :REGEX",
            "language": "Lexer"
          },
          {
            "kind": "Text",
            "text": "\n            这样的标记将被识别并从输入中移除。\n            您可以使用它来添加注释或空格。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个标记片段可以由以下定义：\n            "
          },
          {
            "kind": "Program",
            "code": "$FragmentName       :REGEX",
            "language": "Lexer"
          },
          {
            "kind": "Text",
            "text": "\n           这不是一个标记，\n           但它可以在其他正则表达式中使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "{$FragmentName}"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n           在该位置粘贴片段，以避免在各处重复相同的模式。\n           这是在 C++ 中定义整数、十六进制和二进制字面量的示例：\n            "
          },
          {
            "kind": "Program",
            "code": "$CPP_NUMBER_POSTFIX  :[uU]|[lL]|[uU][lL]|[lL][uU]|[lL][lL]|[uU][lL][lL]|[lL][uU][lL]|[lL][lL][uU]|i8|ui8|i16|ui16|i32|ui32|i64|ui64\nINT                  :(/d+('/d+)*)({$CPP_NUMBER_POSTFIX})?\nHEX                  :0[xX][0-9a-fA-F]+({$CPP_NUMBER_POSTFIX})?\nBIN                  :0[bB][01]+({$CPP_NUMBER_POSTFIX})?",
            "language": "Lexer"
          },
          {
            "kind": "Text",
            "text": "\n            标记片段只是简单地复制粘贴，这就是为什么 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\"()\""
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在这里需要。\n        "
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
</body>
</html>
