};
  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "VlppReflection 简介",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            VlppReflection 为 C++ 类型提供运行时反射。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            如果一个项目包含 VlppReflection 源代码，\n            这并不一定意味着项目在运行时使用了反射。\n            因为可反射类必须继承自 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Description<T>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " or "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "AggregatableDescription<T>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            在 VlppReflection 中定义的。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            相同的源代码可用于编译器或代码生成器中，\n            通常这类工具会使用运行时反射。\n            因此，定义可反射 C++ 类型的源代码必须编译\n            无论天气 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "VCZH_DEBUG_NO_REFLECTION"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可开启或关闭，\n            以便让不需要运行时反射的消费者共享相同的代码。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "使用反射的 Gaclib 项目",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                In "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VlppParser"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 项目，从生成的 C++ 代码 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ParserGen.exe"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将移除类型注册代码\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VCZH_DEBUG_NO_REFLECTION"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 为开启状态。\n                从语法生成的所有 AST 类都是可反射的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                In "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Workflow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 项目、编译和运行工作流脚本依赖于反射。\n                因此它们被移动到了独立的文件中。\n                当你只使用工作流脚本生成的 C++ 代码时，\n                仅包含文件的一部分并设置 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VCZH_DEBUG_NO_REFLECTION"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " on.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                In "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacUI"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 项目、类型注册和 GacUI XML 资源编译器使用反射，\n                因此它们被移动到了独立的文件中。\n                当你不需要为控件动态加载资源时，\n                仅包含文件的一部分并设置 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VCZH_DEBUG_NO_REFLECTION"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " on.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                设置 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VCZH_DEBUG_NO_REFLECTION"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " on 减少了可反射的 C++ 类型的大小\n                和显著减少了90%的GacUI应用程序可执行文件大小。\n                这大大提升了性能。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "编写可反射的 C++ 类型",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "在命名空间 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "::vl::reflection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在 API 命名约定中， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VlppReflection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "class"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 用于引用类型，以及 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "struct"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 用于数据类型。\n                引用类型只能创建并存储在指针中，它包含字段、方法、属性、事件，还允许继承。\n                数据类型只包含数据，没有方法和事件，也不允许继承。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                C++ 基本类型、重要类型和容器来自 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Vlpp"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 都是可反射的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可反射的C++类必须继承自 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Description<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AggregatableDescription<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                要使类成员可反射，该成员中使用的类型也应是可反射的。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "函数对象和容器",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "在命名空间 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "::vl::reflection::description"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于函数对象，仅 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Func<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 支持反射。大多数容器都支持反射\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个函数对象被包装时，一个实例 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValueFunctionProxy"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已创建。\n                当一个打包函数对象被解包时，\n                你没有得到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Func<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象在装箱之前，\n                而是您会得到一个新的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Func<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 调用此对象的实体 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValueFunctionProxy"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 实例。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个容器被框选时，一个实例的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValueEnumerable"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValueList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValueDictionary"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已创建。\n                它取决于容器的类型。\n                此实例在装箱之前引用了容器。\n                它可以更新容器，\n                因此，当容器被删除时，调用此实例会导致崩溃。\n                当一个打包容器被解包时，\n                您会得到容器的一个副本。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "装箱和拆箱",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "在命名空间 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "::vl::reflection::description"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于非泛型类型和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "WString"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BoxValue"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnboxValue"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 建议使用\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于函数对象和容器，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BoxParameter"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnboxParameter"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是必需的。\n                这两个函数也可以对非泛型类型进行装箱和拆箱，并且 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "WString"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                但它不如 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BoxValue"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnboxValue"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "何时使用反射",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果可以，不建议您在运行时使用反射。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                反射主要用于编译和运行工作流脚本。\n                A工作流脚本类甚至可以从多个可反射的C++类继承（必须从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AggregatableDescription"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ").\n                为了执行 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "dynamic_cast"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 正确地，\n                建议您使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SafeAggregationCast<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数，存在于所有可反射的 C++ 类中。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                运行工作流脚本需要反射功能可用，\n                但运行从工作流脚本生成的 C++ 代码时则不会。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                In "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacUI"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，所有 GacUI XML 资源文件中的控件在编译时都会转换为工作流脚本文件。\n                为了创建这些控件，\n                建议直接使用由它们生成的 C++ 代码。\n                这些都是由 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacBuild.ps1"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您可以在运行时加载编译后的资源文件和脚本文件以创建控件，\n                但不建议这样做。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当不需要运行时反射时，您必须设置 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "VCZH_DEBUG_NO_REFLECTION"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " on.\n                这是 C++ 编译器的预处理器定义。\n                您还可以使用检测此选项 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "#ifdef VCZH_DEBUG_NO_REFLECTION"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "#ifndef VCZH_DEBUG_NO_REFLECTION"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
