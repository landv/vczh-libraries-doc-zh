  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "<Xml>",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/Release/blob/master/SampleForDoc/GacUI/XmlRes/kb_xmlres_data/XmlPage.xml",
            "content": [

                "kind": "Text",
                "text": "这里"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            是本主题中使用的示例。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Xml/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 像……一样工作 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Text/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            但有几个不同之处：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "它可以分配给接受的属性 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "system::xml::XmlDocument^"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            预定义的 GacUI 对象中没有属性可以接受 XML，\n            它被设计用来存储静态结构化数据。\n            另一个选择是使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Script>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 并在工作流脚本中编写它们。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在示例中，\n            XML 由一段 Workflow 脚本读取，\n            并将数据加载到列表视图控件中。\n            Workflow 中未引入 XML 辅助函数和 Linq，\n            因此，这段代码在 C++ 中会简单得多。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            首先我们在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "res://MainWindow/XmlPage/IDE"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ":\n            "
          },
          {
            "kind": "Program",
            "code": "<Xml name=\"IDE\">\r\n  <IDEs>\r\n    <IDE name=\"Visual Studio\" dev=\"Microsoft\" />\r\n    <IDE name=\"Visual Studio Code\" dev=\"Microsoft\" />\r\n    <IDE name=\"XCode\" dev=\"Apple\" />\r\n    <IDE name=\"CLion\" dev=\"JetBrains\" />\r\n    <IDE name=\"C++ Builder\" dev=\"Embarcadero\" />\r\n    <IDE name=\"Eclipse\" dev=\"Eclipse Foundation\" />\r\n  </IDEs>\r\n</Xml>"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            然后我们定义一个类来存储数据，\n            带有一个读取XML并填充到可观察列表的函数。\n            "
          },
          {
            "kind": "Program",
            "code": "module sharedscript;\r\n\r\nusing system::*;\r\nusing system::xml::*;\r\n\r\nnamespace sample\r\n{\r\n  class IDE\r\n  {\r\n    prop Name: string = \"\" {}\r\n    prop Developer: string = \"\" {}\r\n  }\r\n\r\n  func Fill(doc: XmlDocument^, ides: observe IDE^[]): void\r\n  {\r\n    for (nodeIde in doc.rootElement.subNodes)\r\n    {\r\n      var xIde = cast (XmlElement^) nodeIde;\r\n      var oIde = new IDE^();\r\n      for (att in xIde.attributes)\r\n      {\r\n        switch (att.name)\r\n        {\r\n          case \"name\": { oIde.Name = att.value; }\r\n          case \"dev\": { oIde.Developer = att.value; }\r\n        }\r\n      }\r\n      ides.Add(oIde);\r\n    }\r\n  }\r\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在示例中，\n            一个变量。 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "var ides: observe IDE^[] = {};"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 使用 添加到标签页 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<ref.Members/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            您可以在该标签中编写任意数量的类成员。\n            如果你需要在构造函数或析构函数中写一些内容，\n            您也可以使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<ref.Ctor/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " or "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<ref.Dtor/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            它们接受一个工作流语句，或一对花括号包含多个语句。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            现在我们需要将这个可观察列表绑定到一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "BindableListView"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ":\n            "
          },
          {
            "kind": "Program",
            "code": "<BindableListView View=\"Detail\" HorizontalAlwaysVisible=\"false\" VerticalAlwaysVisible=\"false\" env.ItemType=\"sample::IDE^\">\r\n  <att.BoundsComposition-set AlignmentToParent=\"left:0 top:0 right:0 bottom:0\"/>\r\n  <att.ItemSource-bind>self.ides</att.ItemSource-bind>\r\n\r\n  <att.Columns>\r\n    <ListViewColumn Text=\"IDE\" TextProperty=\"Name\" Size=\"180\"/>\r\n    <ListViewColumn Text=\"Developer\" TextProperty=\"Developer\" Size=\"240\"/>\r\n  </att.Columns>\r\n</BindableListView>"
          },
          {
            "kind": "Text",
            "text": "\n            这里有三件重要的事情：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ItemSource"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    此属性接受任何集合类型，\n                    并且列表视图项将与集合中的项一对一映射创建。\n                    如果它是一个可观察集合，就像这个示例一样，\n                    当向此可观察集合中添加或移除项时，\n                    列表视图项将自动更改。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "env.ItemType"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    项目中的类型名称是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ItemSource"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TextProperty"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " in "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ListViewColumn"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    一个属性在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "env.ItemType"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    For "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BindableDataGrid"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    如果您为列指定了编辑器模板或可视化器模板，\n                    您可以以任何方式表示数据，因此该属性不必是非字符串属性。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            最后，我们创建一个按钮。\n            通过单击它，\n            它将所有数据加载到 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ides"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可观察集合\n            以便列表视图能够感知到更改并创建列表视图项：\n            "
          },
          {
            "kind": "Program",
            "code": "<Button ref.Name=\"buttonLoad\" Text=\"Click Me To Load Data\">\r\n  <att.BoundsComposition-set AlignmentToParent=\"left:0 top:0 right:0 bottom:0\"/>\r\n  <ev.Clicked-eval><![CDATA[\r\n    {\r\n      var doc = cast (system::XmlDocument^) self.ResolveResource('res', 'MainWindow/XmlPage/IDE', true);\r\n      Fill(doc, self.ides);\r\n      buttonLoad.Enabled = false;\r\n    }\r\n  ]]></ev.Clicked-eval>\r\n</Button>"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这是它的显示效果：\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "源代码： "
                  },
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/blob/master/SampleForDoc/GacUI/XmlRes/kb_xmlres_data/XmlPage.xml",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "kb_xmlres_data"
                      }
                    ]
                  }
                ]

              {
                "kind": "ContentListItem",

                  {
                    "kind": "Image",
                    "src": "/gacui/kb_xmlres_tag_xml.gif"
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
};
