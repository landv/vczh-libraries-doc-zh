  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "<Animation>",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUI XML 资源"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被转换为资源二进制文件：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "此资源在资源二进制文件中不存在。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "等效的工作流脚本将包含在资源二进制文件的工作流程序集部分中。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    如果你使用了指定在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GacGenConfig/Cpp"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    工作流程序集也不包含在资源二进制文件中，\n                    因为你应该使用生成的C++代码。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            <Animation/> 创建一个帮助器以创建实例 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "presentation::controls::IGuiAnimation^"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            创建的动画对选定类中的选定字段执行可自定义的变换。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            通常一个 <Animation/> 看起来是这样的：\n            "
          },
          {
            "kind": "Program",
            "code": "<Animation name=\"RESOURCE_NAME\">\r\n  <Gradient ref.Class=\"ANIMATION_CLASS\" Type=\"STATE_CLASS\">\r\n    <Interpolation>\r\n      <![CDATA[\r\n        DEFAULT_INTERPOLATION_FUNCTION\r\n      ]]>\r\n    </Interpolation>\r\n    <Targets>\r\n      <Target Name=\"FIELD_1\"/>\r\n      <Target Name=\"FIELD_2\">\r\n        <Interpolation>\r\n          <![CDATA[\r\n            INTERPOLATION_FUNCTION_FOR_THIS_FIELD\r\n          ]]>\r\n        </Interpolation>\r\n      </Target>\r\n    </Targets>\r\n  </Gradient>\r\n</Animation>"
          },
          {
            "kind": "Text",
            "text": "\n            它生成一个名为 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ANIMATION_CLASS"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ":\n            "
          },
          {
            "kind": "Program",
            "code": "class ANIMATION_CLASS\r\n{\r\n    prop Begin: STATE_CLASS^ {}\r\n    prop End: STATE_CLASS^{}\r\n    prop Current: STATE_CLASS^{}\r\n\r\n    new (current: STATE_CLASS^) { ... }\r\n    func CreateAnimation(target: STATE_CLASS^, time: UInt64): IGuiAnimation^ { ... }\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            While "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "STATE_CLASS"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 必须是已存在的类，\n            可以使用 <Script/> 创建：\n            "
          },
          {
            "kind": "Program",
            "code": "class STATE_CLASS\r\n{\r\n    prop FIELD_1: TYPE{}\r\n    prop FIELD_2: TYPE{}\r\n}"
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "TYPE"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 必须是整数类型、浮点数类型或颜色类型。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IMPORTANT"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ": 为了对 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ANIMATION_CLASS::Current"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            所有字段在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "STATE_CLASS"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 建议作为带有事件的属性。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当创建时， "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ANIMATION_CLASS"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            一个实例 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "STATE_CLASS"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 必须是初始状态。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当调用时， "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "CreateAnimation"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            当前状态变为开始状态，\n            第一个参数成为结束状态，\n            第二个参数是动画的持续时间，以毫秒为单位。\n            返回的动画对象可以使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "AddAnimation"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " or "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "KillAnimation"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 根对象的。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            插值函数接受一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "double"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在 0 和 1 之间，\n            返回一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "double"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在 0 和 1 之间。\n            它可能是一个函数名，\n            一个lambda表达式，\n            或任何 "
          },
          {
            "kind": "PageLink",
            "href": "/workflow/lang/expr.html",
            "content": [
              {
                "kind": "Text",
                "text": "工作流表达式"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 返回一个函数。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当动画正在播放时，\n            参数是当前播放时间除以动画长度。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            插值函数的返回值用于确定 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Current"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 属性。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/Release/blob/master/SampleForDoc/GacUI/XmlRes/kb_animation/Resource.xml",
            "content": [
              {
                "kind": "Text",
                "text": "这里"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            是 <Animation> 的一个示例。\n            它在单选按钮的控件模板上创建动画。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这是状态类：\n            "
          },
          {
            "kind": "Program",
            "code": "class RadioButtonTemplateState\r\n{\r\n  prop Length : double = 0 {}\r\n  prop Text : Color = {} {}\r\n  prop Border : Color = {} {}\r\n  prop Background : Color = {} {}\r\n  ...\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            在这个类中，\n            定义了六个静态函数，用于返回不同按钮状态的配置。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这是动画效果：\n            "
          },
          {
            "kind": "Program",
            "code": "<Animation name=\"RadioButtonTemplateAnimation\">\r\n  <Gradient ref.Class=\"sample::RadioButtonTemplateAnimation\" Type=\"sample::RadioButtonTemplateState\">\r\n    <Interpolation><![CDATA[\r\n      func (x: double): double\r\n      {\r\n        if (x < 0.5) { return x * x * 2; } else { return 1 - (1 - x) * (1 - x) * 2; }\r\n      }\r\n    ]]></Interpolation>\r\n    <Targets>\r\n      <Target Name=\"Length\"/>\r\n      <Target Name=\"Text\"/>\r\n      <Target Name=\"Border\"/>\r\n      <Target Name=\"Background\"/>\r\n    </Targets>\r\n  </Gradient>\r\n</Animation>"
          },
          {
            "kind": "Text",
            "text": "\n            插值函数使动画在前半段运行得越来越快，\n            和在后半段越来越慢。\n            它通过转移动画进度来实现这一点 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "x"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            范围从 0 到 1\n            到另一个0到1之间的值。\n            其导数的图像看起来像一座山。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当按钮状态改变时，\n            自定义成员函数 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "OnStateChanged"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被调用，\n            这会终止当前的动画并开始一个新的动画。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当动画正在运行时，\n            属性的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "self.animationBuilder.Current"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被更改。\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "self.animationBuilder"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 是类型为 的自定义成员字段。 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "sample::RadioButtonTemplateAnimation^"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            现在我们只需要将大小和颜色绑定到 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "self.animationBuilder.Current"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            以及 UI 在动画运行时会移动。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这是它的显示效果：\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "源代码： "
                  },
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/blob/master/SampleForDoc/GacUI/XmlRes/kb_animation/Resource.xml",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "kb_animation"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Image",
                    "src": "/gacui/kb_animation.gif"
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
};

    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
