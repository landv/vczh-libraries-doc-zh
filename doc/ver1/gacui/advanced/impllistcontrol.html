            "content": [

                            "content": [
                              {

                                "text": "SetCallback"

                            "text": "：\n                            当它附加到列表控件时，会调用此方法。\n                            仅一个回调将被安装到 "

                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "ReloadVisibleStyles"

                            "text": "：\n                            为可见项重新创建所有UI对象。\n                            项目不需要立即重新创建，\n                            但是所有项目的 UI 对象都应在调用此方法时被释放。\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetVisibleStyle"

                          },

                            "kind": "Text",
                            "text": " 和 "

                            "content": [
                              {
                                "kind": "Text",
                                "text": "GetVisibleIndex"

                            "text": ".\n                        "

                            "kind": "Strong",

                                "text": "OnViewChanged"

                                "text": "IItemArranger"

                            "text": "\n                            可见部分是什么 "

                            "text": ".\n                        "
                          }

                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "IItemArranger"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 只能为此区域中的项目创建 UI 对象，\n                            以减少内存压力并提高性能。\n                            "

                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "IItemArranger"
                              }
                            ]
                          },

                            "kind": "Text",
                            "text": " 如果性能不重要，也可以为所有项创建UI对象。\n                            所有已创建 UI 对象的项目都是 "

                            "content": [

                            "text": ".\n                        "
                          }

                        "content": [

                            "kind": "Text",

                            "content": [

                                "text": "IItemArrangerCallback::RequestItem"

                            "kind": "Text",
                            "text": " 和 "

                            "content": [

                                "kind": "Text",
                                "text": "IItemArrangerCallback::ReleaseItem"

                            ]
                          },

                            "kind": "Text",
                            "text": ".\n                        "
                          }
                        ]

                            "text": ".\n                            "

                            "content": [

                                "text": "下一个项目"

                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ".\n                        "
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "EnsureItemVisible"

                      {
                        "kind": "Text",
                        "text": "：\n                        当列表控件想要滚动到某个区域以使给定项可见时，会调用此方法。\n                        "

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IItemArrangerCallback::SetViewLocation"

                      },
                      {
                        "kind": "Text",
                        "text": " 通常被称为响应。\n                        "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OnViewChanged"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 可以在 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "SetViewLocation"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GetAdoptedSize"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        返回项目可见区域的合理大小，\n                        如果列表控件用作组合框的下拉列表。\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "GuiListControl::IItemArrangerCallback，项目布局",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此界面中涉及的所有位置、大小和边距均为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "virtual"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IItemArranger"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 只需提供项目布局即可 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LeftDown"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 方向。\n                该 \n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/components/controls/list/guilistcontrol.html#Axis-AxisChanged-",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Axis"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                属性将由列表控件使用\n                调整所有可见项的位置和大小，以将其布局到预期的方向。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "RequestItem"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        要求列表控件为特定项创建一个项模板实例。\n                        通过调用释放的项目模板实例 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ReleaseItem"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\n                        可以用于不同的项目。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ReleaseItem"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        要求列表控件为特定项释放一个项模板实例。\n                        如果需要，项模板实例稍后将从内存中删除，\n                        调用此方法后，指针不应再使用。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "SetViewLocation"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        告诉列表控件可见区域的左上角位置。\n                        但列表控件可能会将可见区域移动到由\n                        如果它认为这样更好。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GetStylePreferredSize"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        读取的大小为 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "PreferredBounds"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 由列表控件包含的组合属性。\n                        "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IMPORTANT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 结果是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "virtual"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        不要直接使用此属性，\n                        请改用此方法。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "SetStyleAlignmentToParent"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ":\n                        Update the "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "AlignmentToParent"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 列表控件中包含的组合属性。\n                        "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IMPORTANT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 结果是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "virtual"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        不要直接使用此属性，\n                        请改用此方法。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GetStyleBounds"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ":\n                        Read the "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Bounds"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 列表控件中包含的组合属性。\n                        "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IMPORTANT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 结果是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "virtual"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        不要直接使用此属性，\n                        请改用此方法。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "SetStyleBounds"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ":\n                        Update the "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Bounds"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 列表控件中包含的组合属性。\n                        "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IMPORTANT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 结果是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "virtual"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        不要直接使用此属性，\n                        请改用此方法。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "GetContainerComposition"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        获取组合以作为容器来存储所有项目的 UI 对象。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OnTotalSizeChanged"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        调用此方法以通知列表控件\n                        "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IItemArranger::GetTotalSize"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 已被更改。\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "正确使用 IItemProvider::RequestView",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                列表控件可以重写 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OnStyleInstalled"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiListControl"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                当项模板实例绑定到列表项时，会调用此方法。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                新的列表控件类通常会为项定义一个新的项模板类。\n                新的项模板类添加了新属性，用于定义此新列表控件中的项应如何显示。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可以定义一个或多个视图来读取或写入此特定列表控件类的项的详细信息。\n                然后列表控件类可以调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "RequestView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 用于使用唯一标识符字符串的视图，\n                将数据从视图绑定到项模板实例。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如：\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiTextList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 定义 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ITextItemView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " view 添加到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Checked"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性到项目。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IItemArranger"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也可以定义自己的视图。\n                例如，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewColumnItemArranger"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 定义 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IColumnItemView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                从列表控件中读取列\n                渲染列标题。\n                任何使用列表控件的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewColumnItemArranger"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 应确保\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IColumnItemView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已实现并可从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IItemProvider::RequestView"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您可以为任何目的定义自己的视图，\n                只要它仅用于读取或写入项目详细信息。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "项目数据绑定",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                一个可数据绑定的列表控件可以从实现以下接口的项源中读取或写入项： "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr<IValueEnumerable>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                此对象也可以实现任何派生接口，例如：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IValueReadonlyList"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IValueList"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "IValueObservableList"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                如果项目源实现了， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IValueObservableList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                然后，当项目更改时，列表控件应自动更新。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/properties.html#Property-Name-func-data-Object-PROPERTY-TYPE",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    可读属性类型\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/properties.html#Writable-Property-Name-func-data-Object-value-PROPERTY-TYPE-isWrite-bool-PROPERTY-TYPE",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    可写属性类型\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                可用于让用户告诉您如何从项目中访问详细信息。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::controls::ReadProperty"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::controls::WriteProperty"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                可以用于C++中的这些属性类型。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "示例",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                强烈建议您阅读源代码的\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiTextList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiBindableTextList"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                在创建您自己的列表控件类之前。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
