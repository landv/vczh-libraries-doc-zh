          {
            "kind": "Program",
            "code": "class MyAnimation\r\n{\r\n    prop Current: STATE_CLASS^{}\r\n    new (current: STATE_CLASS^){}\r\n    func CreateAnimation(target: STATE_CLASS^, time: UInt64);\r\n}"

            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Color"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            通过创建一个 "
          },

            "kind": "Strong",
            "content": [

        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在动画中操作字段的第一步是 "

                "href": "/gacui/xmlres/tag_animation.html",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Animation/>"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                仅由 a 提及的字段 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Target/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 标签可以是动画的。\n                所有动画字段必须关联一个插值函数。\n                还有一个用于默认插值函数的位置，\n                将应用于所有动画字段，除非指定了其中一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Target/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                插值函数是函数类型中的工作流表达式，\n                哪个需要一个 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "double"

              },

                "kind": "Text",

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "double"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                函数参数是动画的进度从 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0"
                  }
                ]

              {
                "kind": "Text",
                "text": " to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果动画时长为10秒，\n                然后 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是开始，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是结尾，\n                和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0.4"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 表示 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "10 秒 * 0.4"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在第4秒结束时。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                返回值是动画从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果起始状态是 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "5"

              {

                "content": [

                "content": [
                  {
                    "kind": "Text",
                    "text": "5"

              },
              {
                "kind": "Text",

              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "1"

                ]
              },
              {

                  {
                    "kind": "Text",
                    "text": "15"

              },
              {

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0.4"

              },
              {

                  {
                    "kind": "Text",
                    "text": "5 + (15 - 5) * 0.4"

              {
                "kind": "Text",
                "text": " 哪个是 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "9"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                插值计算为，\n                给定动画的进度，字段应放置的位置。\n                如果需要一个线性插值函数，\n                然后直接返回参数。\n                这样的函数通常为：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        for "
                      },
                      {
                        "kind": "PageLink",
                        "href": "/workflow/lang/expr.html#Ordered-lambda-expression-1-2-",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "有序lambda表达式"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\n                        : "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "[$1]"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        for "
                      },
                      {
                        "kind": "PageLink",
                        "href": "/workflow/lang/expr.html#Lambda-expression-func-x-int-y-int-int-return-x-y-",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "lambda 表达式"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\n                        : 例如： "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "func (progress: double) : double { return progress; }"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                有时最好使字段在前半段加速，后半段减速，\n                这样的函数可以很容易地使用：\n                "
              },
              {
                "kind": "Program",
                "code": "func (x: double): double\r\n{\r\n    if (x < 0.5) { return x * x * 2; } else { return 1 - (1 - x) * (1 - x) * 2; }\r\n}"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "运行动画",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Animation/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 生成的类，\n                有一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CreateAnimation(状态, 时间)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数，\n                这意味着动画从当前状态开始，\n                和朝向 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "state"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "time"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 毫秒。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                调用此函数不会使动画运行，\n                而是返回一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(vl::)presentation::controls::IGuiAnimation^"

              },
              {
                "kind": "Text",
                "text": " 对象。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " of\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(vl::)presentation::controls::GuiInstanceRootObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                控制动画的运行方式。\n                此类是所有 UI\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/instance/root_instance.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    根实例\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                so "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "self.AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "self.KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                可在 XML 中访问。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AddAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 添加一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象到UI对象，\n                并立即开始动画。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 停止一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已添加到 UI 对象中的对象\n                并立即停止动画。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于需要多次从一个状态切换到另一个状态的动画，\n                就像按钮在鼠标进入和离开时一样，\n                控制动画存在一种模式：\n                "
              },
              {
                "kind": "Program",
                "code": "<ref.Members><![CDATA[\r\n    var myAnimation : MyAnimation^ = new MyAnimation(initial_state);\r\n    var lastAnimation : IGuiAnimation^ = null;\r\n]]></ref.Members>\r\n...\r\nvar newAnimation = myAnimation.CreateAnimation(newState, animationLengthInMilliseconds);\r\nKillAnimation(lastAnimation);\r\nlastAnimation = newAnimation;\r\nAddAnimation(lastAnimation);"
              },
              {
                "kind": "Text",
                "text": "\n                当动画运行时，状态需要转移到新状态，\n                这段代码将停止当前正在运行的动画。\n                并用一个新的替换它。\n                新的动画将当前状态从当前位置移动到新状态，\n                并且它应该看起来平滑。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "KillAnimation"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以接受 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                并且它什么也不做。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "管理多个动画",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                对于每个动画，很容易多次复制上述模式\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                请记住，\n                创建的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "lastAnimation"
                  }
                ]
              },
