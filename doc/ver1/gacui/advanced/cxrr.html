            "kind": "PageLink",
            "href": "/gacui/xmlres/cxrr.html",

              {
                "kind": "Text",
                "text": "\n                在另一个 XML 中使用一些资源\n            "
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            有3种类型的资源：\n            "
          },

            "kind": "List",
            "ordered": false,
            "items": [

                  },

                      {
                        "kind": "Text",

                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {

                "content": [
                  {
                    "kind": "Text",

                  }
                ]
              },
              {

      },
      {
        "kind": "Topic",
        "title": "XML 资源头",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                要使 GacUI XML 资源能够依赖或被另一个资源依赖，\n                在中需要一个标题 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacGenConfig/Metadata"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 像这样：\n                "
              },
              {
                "kind": "Program",
                "code": "<Resource>\r\n  <Folder name=\"GacGenConfig\">\r\n    <Xml name=\"Metadata\">\r\n      <ResourceMetadata Name=\"EditorRibbon\" Version=\"1.0\">\r\n        <Dependencies>\r\n          <Resource Name=\"EditorBase\"/>\r\n        </Dependencies>\r\n      </ResourceMetadata>\r\n    </Xml>\r\n    ...\r\n  </Folder>\r\n  ...\r\n</Resource>"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/ResourceMetadata/@Name"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        资源的名称。\n                        加载到应用程序中的所有资源应具有唯一名称或无名称。\n                        如果一个资源想要依赖另一个资源或被另一个资源依赖，\n                        它应该有一个名称。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/ResourceMetadata/@Version"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        唯一合法的值是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "1.0"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        它与 GacUI XML 资源编译器（GacGen32.exe 或 GacGen64.exe）绑定。\n                        为确保所有依赖资源均使用兼容版本的编译器进行编译，\n                        一个资源只能依赖于另一个具有完全相同版本的资源。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/ResourceMetadata/Dependencies/Resource/@Name"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        这里列出了当前资源所依赖的所有资源：\n                        名称必须匹配它们的 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/ResourceMetadata/@Name"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 在它们的元数据中。\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "使用依赖项编译资源",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "PageLink",
                "href": "https://github.com/vczh-libraries/Release/tree/master/Tools",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacBuild.ps1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                是唯一能够正确编译具有依赖关系的资源的工具。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您需要有一个名为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacUI.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ":\n                "
              },
              {
                "kind": "Program",
                "code": "<GacUI/>"
              },
              {
                "kind": "Text",
                "text": "\n                A GacUI XML资源及其所有依赖项必须放置在包含 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacUI.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                资源文件可以放在任何层级的子文件夹中。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                然后你可以调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacBuild.ps1 -FileName path/to/GacUI.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "PowerShell"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                包含的文件夹中的所有资源文件 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacUI.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将按依赖顺序找到并编译。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacBuild.ps1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 强制增量构建。\n                如果一个资源未被更改，\n                并且所有依赖项均未更改，\n                则资源将不会再次编译。\n                您可以使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacClear.ps1 -FileName path/to/GacUI.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 清除所有缓存，\n                下次 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GacBuild.ps1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将重新编译所有资源文件。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                生成的资源二进制文件、工作流二进制文件和 C++ 代码将放置在指定位置\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/cgc.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    在每个 GacUI XML 资源中指定\n                "
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "在您的 C++ 应用程序中加载资源依赖项",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::GetResourceManager()->LoadResourceOrPending(fileStream[, errors][, usage]);"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                是唯一加载已编译资源二进制文件的函数：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "fileStream"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ":\n                        It could be any "
                      },
                      {
                        "kind": "PageLink",
                        "href": "/vlppos/using-streams.html",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "vl::stream::IStream"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ",\n                        you could use "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "FileStream"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 这里用于从文件加载资源。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "errors"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "：\n                        如果资源无法加载，\n                        错误将存储在此列表中。\n                        调用此函数后返回一个空的错误列表，表示资源已正确加载。\n                        如果 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "errors"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 参数未被使用，\n                        如果存在任何错误，该函数将崩溃。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "usage"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ":\n                        It could be "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "InstanceClass"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果您将所有工作流二进制文件包含在此资源文件中，\n                        和 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "DataOnly"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果不是。\n                        包含工作流二进制的资源二进制可以使用\n                        "
                      },
                      {
                        "kind": "PageLink",
                        "href": "/gacui/xmlres/cgc.html",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "res://GacGenCppConfig/ResX86/Resource"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 和 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "res://GacGenCppConfig/ResX/Resource"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Workflow 二进制文件的内容对于 x86 或 x64 是不同的"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "，\n                        您需要加载正确的那个。\n                    "
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                通常，\n                如果您使用编译资源并用生成的 C++ 文件代替工作流二进制文件，\n                你只需要第一个参数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您不需要担心加载资源文件的顺序，\n                它们将在此函数中处理。\n                只需调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LoadResourceOrPending"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 用于所有它们。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LoadResourceOrPending"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 未准备所有依赖资源\n                导致延迟加载。\n                这样的资源将在所有依赖资源加载后自动加载。\n                您可以调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetResource"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 查看资源是否已被加载\n                如果它返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 但是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LoadResourceOrPending"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 成功，\n                这意味着某些依赖资源尚未准备就绪。\n                并且加载被延迟。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "删除资源文件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通过使用\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/xmlres/cgc.html",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CppResource"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " or "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CppCompressed"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "res://GacGenConfig/Cpp"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                您将为每个 GacUI XML 资源获得多个 CPP 文件。\n                将所有这些cpp文件链接到你的项目中，\n                资源二进制文件将被编译到你的可执行文件中。\n                当您的应用程序启动时，\n                所有资源将在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiMain"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "在依赖项中使用资源",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果有一个资源对象 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "res://path/to/the/resource"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                在一个名为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BaseResource"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                另一个依赖于它的GacUI XML资源可以使用\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "import-res://BaseResource/path/to/the/resource"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                这样的资源路径可以在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-uri 绑定"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                or in the "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ResolveResource"
                  }
