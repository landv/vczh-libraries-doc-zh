  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "数据绑定",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            GacUI 中的数据绑定依赖于 "
          },
          {
            "kind": "PageLink",
            "href": "/workflow/lang/bind.html",
            "content": [
              {
                "kind": "Text",
                "text": "工作流表达式"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            基本上，\n            如果表达式使用了属性，则该表达式是可观察的。\n            并且这些属性必须通过在对象上具有属性更改事件来使其可观察。\n            您仍然可以临时将某些事件组合到一个属性上，仅为了使此表达式可观察。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在 GacUI 资源 XML 中，\n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/xmlres/instance/properties.html#-bind",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-bind"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", \n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/xmlres/instance/properties.html#-format",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-format"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 和\n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/xmlres/instance/properties.html#-str",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-str"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            基于数据绑定。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "绑定到控件属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这是最基本的数据绑定类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果你将某些内容绑定到文本属性，该属性将在用户界面中显示，\n                e.g. "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Text"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Label/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                请确保：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "控件的布局被正确处理，以确保它们会重新排列自身，以确保不会发生文本渲染截断。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "如果应用程序可以发送给使用不同语言的人，请考虑使用 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Localization"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 从最开始。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                将视图模型绑定到控件也非常直接。\n                A "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ref.Paramter Name=\"Something\" Class=\"...\"/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 创建一个一旦窗口创建后将永不改变的属性。\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Something"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以通过以下方式绑定到控件属性：\n                "
              },
              {
                "kind": "Program",
                "code": "<AControl AProperty-bind=\"Something.X\"/>"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                使用数据绑定与您自己的对象也非常简单，例如：\n                "
              },
              {
                "kind": "Program",
                "code": "<Instance ref.Class=\"...\">\r\n    <ref.Members><![CDATA[\r\n        var myObject = new MyObject();\r\n    ]]></ref.Members>\r\n    <Window ref.Name=\"self\">\r\n        <AControl AProperty-bind=\"self.myObject.X\"/>\r\n    </Window>\r\n</Instance>"
              },
              {
                "kind": "Text",
                "text": "\n                由于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "myObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是窗口的一个成员，\n                您必须首先给窗口命名 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "self"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                让 XML 知道什么是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "myObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "组合属性之间的绑定",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "JUST DON'T DO THAT."
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                内置的布局算法已经使组合元素能够双向相互响应。\n                将组合中的一个属性绑定到另一个组合中的另一个属性（可能位于不同组合中）\n                可能导致反应永远无法结束。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这是一个非常糟糕的例子：\n                "
              },
              {
                "kind": "Program",
                "code": "<Bounds ref.Name=\"parent\" MinSizeLimitation=\"LimitToElementAndChildren\">\r\n    <Bounds ref.Name=\"child\"\r\n        PreferredMinSize-bind=\"{x:(parent.Bounds.x2 - parent.Bounds.x1} y:0}\"\r\n        AlignmentToParent=\"{left:1 top:1 right:1 bottom:1}\"\r\n        />\r\n</Bounds>"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "parent.Bounds"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改，\n                观察到的表达式被通知重新求值，\n                并导致 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "child.PreferredMinSize"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 更改。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "child.PreferredMinSize"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 引起 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "parent.Bounds"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 重新评估\n                因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "MinSizeLimitation=\"LimitToElementAndChildren\""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                现在父级变大了，因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "child.AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                导致 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "parent.Bounds"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 再次更改。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                循环是无限的，\n                当它开始发生时（通常是因为窗口边框正在拖动以调整大小），\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "parent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 很快就会变得非常大，以至于你无法再正常操作窗口。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "绑定到 ViewModel 属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您也可以通过使用将某些内容绑定回视图模型 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-set"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性：\n                "
              },
              {
                "kind": "Program",
                "code": "<Instance ref.Class=\"...\">\r\n    <ref.Parameter Name=\"Something\" Class=\"...\"/>\r\n    <Window ref.Name=\"self\">\r\n        <att.Something-set X-bind=\"aControl.AProperty\"/>\r\n        <AControl ref.Name=\"aControl\"/>\r\n    </Window>\r\n</Instance>"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-set"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 这里告诉 XML，\n                标签中引用的属性 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<att.Something/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                在从 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Something"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 窗口的属性，\n                哪个是视图模型？ "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ref.Parameter/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                Now when "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "aControl.AProperty"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改，\n                值将被更新为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Something.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 立即。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "双向绑定",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                双向绑定是一种特殊的绑定类型，\n                当两个属性相互更新时。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "PageLink",
                "href": "/gacui/components/ctemplates/commondatepickerlook.html",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<CommonDatePickerLook/>"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是一个很好的例子：\n                "
              },
              {
                "kind": "Program",
                "code": "<Instance ref.CodeBehind=\"false\" ref.Class=\"darkskin::DatePickerTemplate\" ref.Styles=\"res://DarkSkin/Style\">\r\n    <DatePickerTemplate ref.Name=\"self\" Date-bind=\"look.Date\" ...>\r\n        <CommonDatePickerLook ref.Name=\"look\" Date-bind=\"self.Date\" .../>\r\n    </DatePickerTemplate>\r\n</Instance>"
              },
              {
                "kind": "Text",
                "text": "\n                在此示例中，\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "self.Date"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改，值将更新为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "look.Date"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                when "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "look.Date"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改，值将更新为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "self.Date"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                这样的双向绑定使这两个属性保持同步，\n                通过使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "-bind"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 彼此两次。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这不会导致更新循环无限运行\n                因为这两个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Date"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 属性不会触发其属性更改事件\n                如果更新后的值与更新前的值相同。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                属性由 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "属性 名称 : 类型 {}"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 语法\n                不会触发 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NameChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 即使相同的值再次更新到属性。\n                但对于具有显式 getter 和 setter 的属性，\n                您必须正确处理设置器：\n                "
              },
              {
                "kind": "Program",
                "code": "class YourObject\r\n{\r\n    var name: string = \"\";\r\n\r\n    event NameChanged();\r\n\r\n    func GetName(): string\r\n    {\r\n        return name;\r\n    }\r\n\r\n    func SetName(value: string): void\r\n    {\r\n        if (name != value)\r\n        {\r\n            name = value;\r\n            NameChanged();\r\n        }\r\n    }\r\n\r\n    prop Name: string {GetName, SetName : NameChanged}\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                否则在此属性上使用双向绑定将触发无限循环。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
