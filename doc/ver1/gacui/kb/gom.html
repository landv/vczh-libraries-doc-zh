  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "GacUI 对象模型",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            大多数重要的 GacUI 对象可以分为：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Elements"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 元素是可渲染的图形对象，包括形状和文本。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Compositions"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 一个通过用户输入事件控制布局的组合，决定元素的边界。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Controls"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 控件提供应用程序最有可能需要的一组功能。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "控件模板"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 控件模板是为某种控件设计的，控制控件的外观。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "项目模板"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 项模板类似于控件模板，但用于控制控件中的重复部分，如列表项。"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "对象的组织结构",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                GacUI 在窗口中维护两个树形结构的对象。\n                边界和用户输入由 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiWindowComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "组合树",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiWindowComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是组合树的根对象。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    所有可见效果和用户输入都由组合树处理。\n                    一个组合可以有其他组合作为其子组合，\n                    并且它最多可以有一个元素作为其子元素。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当一个组合包含一个元素时，\n                    该元素填充了此组合的整个区域，\n                    告知此组合关于大小限制。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    一个组合可以选择监听所有子组合和子元素的大小约束。\n                    不同类型的组合有其自己的算法来控制子组合的放置位置，\n                    以便子组合可以被要求以列表、表格甚至更复杂的行为方式进行组织。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当一个组合被隐藏时，\n                    所有子组合也隐藏，\n                    但尺寸约束仍然存在，\n                    它们在进行布局时不会被忽略。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "控件树",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiWindow"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是控件树的根对象。\n                    控件控制其子控件的行为。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    例如，\n                    当控件被禁用时，\n                    所有子控件也被禁用。\n                    当一个控件更改其字体时，\n                    所有子控件也会更改其字体，\n                    除非那些被明确分配了其他字体的人。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当一个控件获得焦点时，\n                    它会从同一窗口中的最后一个控件移除焦点。\n                    在这种情况下，它的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "可聚焦组合"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 接收所有键盘输入。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "控件模板",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    可见效果由控制模板或项模板控制。\n                    控件在创建时只需分配一个控件模板，\n                    但是另一个控件模板可以重新分配给同一控件以替换旧的控件模板。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    控件模板是一个组合，\n                    但为了在控件执行某些工作或处理用户输入时创建可见效果，\n                    控件模板中还有其他一些专门针对控件设计的内容。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    如果你将控件模板分配给不正确的控件类型，\n                    它崩溃了。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "项目模板",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    一些列表控件也可以分配一个项目模板。\n                    当需要在该控件中显示多个列表项时，会创建多个指定项模板的实例。\n                    当列表项滚动出控件范围时，\n                    它的项模板已被删除。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    而不是依赖组合，\n                    列表控件具有其自身可配置的项目组织方式，\n                    确保当项目不可见时仅占用最小资源。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "将控件和组合放在一起",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    控件有一个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "边界组合"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和一个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "容器组合"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    由其控件模板显式指定的。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "边界组合"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是此控件的边界组合。\n                    当一个控件被放置在另一个控件或组合内时，\n                    该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "边界组合"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 放置在父控件或组合中。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "容器组合"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是一个用于存储控件的组合，这些控件希望被放置在这个控件内部。\n                    当一个控件或组合被放置在此控件内时，\n                    它们被放置在内部 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "容器组合"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 此控件的。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    每当您更改控件或组合的父子关系时，\n                    控件树和合成树会自动维护。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "生命周期",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个组合被删除时，\n                所有子组合也被删除。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个控件被删除时，\n                所有子控件也被删除。\n                删除控件内的所有组合也将被删除。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                大多数情况下你只需要删除一个窗口，\n                这将销毁所有内容。\n                但有时当你删除一个不是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "边界组合"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 控件的某些子项。\n                并且组合或控件在删除时仍可能保留在其父对象中，\n                如果只是调用它，可能会导致内存泄漏。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "delete"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " C++ 的运算符\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                为了防止所有这些问题，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SafeDeleteControl"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SafeDeleteComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 强烈建议使用。\n                它们处理所有可能的情况。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可以安全地删除一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiWindow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 通过使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "delete"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " C++ 的运算符\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "全局对象",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                GacUI应用程序中也存在一些全局对象。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiApplication"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 控制所有窗口的生命周期，\n                还提供了功能，使得UI线程和其他线程能够通信。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 暴露的操作系统功能。\n                当 GacUI 应用程序在不同平台上运行时，\n                不同 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 启动。\n                要将 GacUI 移植到新平台，\n                或在虚拟环境中运行 GacUI\n                （例如，在一个完全由您控制的窗口中运行所有 GacUI 对象，通常在开发游戏时）\n                您需要提供您自己的实现 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "INativeController"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "线程安全",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                所有 GacUI 对象及其方法都不是线程安全的，\n                和几乎所有的视图 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "只能由UI线程访问"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                即使是只读操作。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                一个例外是，\n                当一个组合或控件尚未添加到窗口时，\n                它可以通过非UI线程进行操作。\n                但是当多个线程同时访问同一对象时，它仍然不安全。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};

  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
