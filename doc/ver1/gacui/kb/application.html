  const article = {

    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A GacUI应用程序需要一个用户定义的函数 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "void GuiMain(void)"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            为了启动一个 GacUI 应用程序，\n            以下函数之一必须在入口函数中调用。\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    对于 Windows，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetupWindowsDirect2DRenderer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " or "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetupWindowsGDIRenderer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 必须在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WinMain"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    初始化必要的对象并调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiMain"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 使用不同的渲染技术。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    对于 macOS，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetupOSXCoreGraphicsRenderer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 必须在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "main"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    对于 Linux，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetupGGacRenderer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 必须在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "main"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被调用，\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 对象已就绪，\n            可以通过 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GetApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数。\n            一个典型的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数看起来像：\n            "
          },
          {
            "kind": "Program",
            "code": "void GuiMain()\r\n{\r\n    // 1. create a window, anything that inherits from GuiWindow works\r\n    MyWindow myWindow;\r\n\r\n    // 2. decide where to show the window, it could be any location in any monitor you like\r\n    myWindow.MoveToScreenCenter()\r\n\r\n    // 3. show the window as a main window of the application\r\n    GetApplication()->Run(&myWindow);\r\n\r\n    // 4. when the main window is closed, it gets here\r\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RegisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 必须在创建任何 UI 对象之前调用\n            "
          },
          {
            "kind": "PageLink",
            "href": "/gacui/kb/dtemplates.html",
            "content": [
              {
                "kind": "Text",
                "text": "注册一组默认控件模板"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            用于所有控件。\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RegisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "UnregisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以用于管理所有注册的主题。\n            单个主题对象不需要为所有控件提供控件模板，\n            但是所有注册的主题必须覆盖所有控件。\n            最后注册的主题具有最高优先级。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当使用创建一个主题时， "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GacUI XML 资源"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ",\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RegisterTheme"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 对于此主题，必须在关联的资源文件加载后调用。\n            很难确切知道时间\n            因此，GacUI 提供了一个高效的插件系统来解决这个问题。\n            您可以创建一个插件来注册此主题，并像这样声明此主题依赖于其资源：\n            "
          },
          {
            "kind": "Program",
            "code": "class DefaultSkinPlugin : public Object, public IGuiPlugin\r\n{\r\npublic:\r\n\r\n\tGUI_PLUGIN_NAME(Custom_DefaultSkinPlugin)\r\n\t{\r\n\t\tGUI_PLUGIN_DEPEND(GacGen_DarkSkinResourceLoader);\r\n\t}\r\n\r\n\tvoid Load()override\r\n\t{\r\n\t\tRegisterTheme(MakePtr<darkskin::Theme>());\r\n\t}\r\n\r\n\tvoid Unload()override\r\n\t{\r\n\t}\r\n};\r\nGUI_REGISTER_PLUGIN(DefaultSkinPlugin)"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当默认控件模板和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 已准备就绪，\n            是时候创建一个非常简单的 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "WinMain"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 启动应用程序：\n            "
          },
          {
            "kind": "Program",
            "code": "int CALLBACK WinMain(HINSTANCE hInstance, HINSTANCE hPrevInstance, LPSTR lpCmdLine, int CmdShow)\r\n{\r\n    return SetupWindowsDirect2DRenderer();\r\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            所有 GacUI 对象必须仅在 UI 线程中使用。\n            为了使线程间通信成为可能，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiApplication"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 提供以下所有功能来运行任务：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 检查当前线程是否为UI线程。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeAsync"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在随机的后台线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在UI线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThreadAndWait"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在UI线程中执行一个任务并等待其完成。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DelayExecute"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在指定时间后，在随机的后台线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DelayExecuteInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在指定时间后，在UI线程中执行一个任务。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RunGuiTask"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ": 在UI线程中执行一个任务并等待其完成。"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThread"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以在任何线程中调用。\n            此函数将一个任务加入队列，\n            稍后将执行。\n            在 UI 线程中调用此函数是可以的，\n            这是一种非常常见的模式，用于立即触发某些操作，但并非严格意义上的“现在”。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            例如，\n            当您在标签页标题中放置一个按钮以删除标签页时，\n            您不能直接在按钮中移除和删除选项卡页。 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Click"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 事件，\n            因为在此之后还有其他事件要触发 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Click"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 事件，\n            这要求按钮及其所有祖先都必须是活动的。\n            在这种情况下，\n            你可以提问 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThread"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 删除选项卡标题，\n            这将发生在为此次点击完成所有必要操作之后。\n            和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SafeDeleteControl"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 将直接生效。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThreadAndWait"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 不能在UI线程中调用。\n            如果你这样做，\n            它会通过抛出异常来报错。\n            您还可以要求此函数在指定时间未完成任务时返回\n            在这种情况下，任务不会被取消。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "RunGuiTask"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 像……一样工作 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "InvokeInMainThreadAndWait"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            但可以在UI线程中调用。\n            只有在任务完成后才会返回。\n        "
          }
        ]
      }
    ]
  }
};
