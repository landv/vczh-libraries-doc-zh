                              {
                                "kind": "Text",
                                "text": "第一个回调参数"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "wheel"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "：\n                            轮子的方向和距离。正数表示轮子向右或向下旋转。\n                            旋转的单位为 120，适用于今天的典型鼠标。\n                        "
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "移动事件",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    GacUI 提供以下按钮事件：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "mouseMove"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "mouseEnter"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "mouseLeave"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    映射到鼠标的标准5个按钮。\n                    但如今典型的鼠标，\n                    中键和垂直滚轮合并在一起，\n                    水平滚轮通常缺失。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseEnter"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当鼠标移入组合时发生。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseLeave"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当鼠标移出组合时发生。\n                    当鼠标从一个组合移动到其子组合时，\n                    它不被视为离开原始组合。\n                    它仍然在原始组合及其子组合中。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseMove"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当鼠标移动时发生。\n                    它在捕获组合时被触发，\n                    或当没有组合被捕获时，鼠标正下方的组合\n                    然后遍历父链，\n                    可通过设置来停止 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "handled"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "捕获",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当一个按钮按下事件发生时，\n                    该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "compositionSource"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被捕获。\n                    A捕获的组合成为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "compositionSource"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    所有以下鼠标事件均发生在包含窗口（或菜单、弹出窗口等）中，\n                    包括按钮抬起事件。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    按钮释放事件发生后，\n                    捕获已释放。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "在鼠标事件期间移动或删除控件或组合。",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    有时您可能希望在鼠标事件的回调中更改控件树结构，\n                    （包括 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Clicked"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 在按钮中）。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这很棘手，因为，\n                    鼠标事件不仅发送到此组合中，\n                    它被发送到所有父级组合中。\n                    即使当 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "handled"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被设置为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    回调函数结束后仍有一些事情要做。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当你移动或删除影响父链的控件或组合时，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GacUI 将稳定崩溃"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    为了解决此问题，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetApplication()->InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是你的朋友。\n                    每当您调用此函数时，\n                    回调函数 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InvokeInMainThread"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 将运行\n                    在当前一系列事件之后。\n                    这是一个非常安全的点，可用于重新组织你的控件或组合。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    例如，\n                    如果您自定义标签控件，使每个标签页都有一个关闭按钮：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "void MyTabPage::buttonCloseClicked(GuiGraphicsComposition* sender, GuiEventArgs& arguments)\r\n{\r\n    // this is still in the chain of mouse button events,\r\n    // so InvokeInMainThread is required to delete MyTabPage.\r\n    GetApplication()->InvokeInMainThread(this->GetRelatedControlHost(), [=]()\r\n    {\r\n        this->GetOwnerTab()->GetPages().Remove(this);\r\n        SafeDeleteControl(this);\r\n    });\r\n}"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "焦点事件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                GacUI 提供以下按钮事件：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "gotFocus"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "lostFocus"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "caretNotify"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                第二个参数的类型是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::compositions::GuiEventArgs&"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "presentation::composition::GuiEventArgs*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Workflow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                焦点组合是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 具有焦点的控件。\n                控件如按钮在被单击后会获得焦点，\n                您也可以调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetFocus"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将焦点移动到控件上。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个控件获得焦点时，\n                它的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 拥有焦点。\n                如果你正在编写控件模板，\n                您可以将任何组合设置为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 控件模板的属性，\n                并成为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "FocusableComposition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 控件的。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                窗口只有一个焦点控件。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "gotFocus"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在组合对象获得焦点时引发。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "lostFocus"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在先前具有焦点的组合对象失去焦点时引发。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "caretNotify"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是每隔半秒在焦点控件上持续增加的。\n                如果一个控件想要渲染输入光标，\n                它需要订阅 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "caretNotify"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                并在该事件发生时导致输入光标在可见和不可见状态之间切换。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                COMPOSITION->"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetRelatedGraphicsHost"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "()->"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetCaretPoint"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                有助于告诉系统在哪里显示输入法的小窗口。\n                强烈建议由获得焦点的控件调用此函数\n                以避免状态损坏。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果窗口本身获得或失去焦点，\n                相关事件将在窗口上引发，\n                此处描述的事件不受影响。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "键盘事件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                GacUI 提供以下按钮事件：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "previewKey"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "keyDown"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "keyUp"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "systemKeyDown"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "systemKeyUp"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                第二个参数的类型是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::compositions::GuiKeyEventArgs&"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "presentation::composition::GuiKeyEventArgs*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Workflow"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                键盘事件在具有焦点的组合元素上触发\n                然后遍历父链，\n                可通过设置来停止 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "handled"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "previewKey"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在任何其他键盘事件之前触发，\n                If "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "handled"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被设置为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                不仅父级链会停止，\n                以下键盘事件也将被取消。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "code"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 第二个参数的成员\n                映射到一个项 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "vl::presentation::VKEY"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " enum.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                其他成员包含事件的信息：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ctrl"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果按下了 CTRL 键。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "shift"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果按下 Shift 键。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "alt"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果ALT按钮正在按下。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "capslock"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果大写锁定键已激活。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "autoRepeatKeyDown"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 如果此事件是由于按住一个键而生成的。"
                      }
                    ]
                  }
                ]
              }
