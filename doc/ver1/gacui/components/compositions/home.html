              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    有时元素需要最小尺寸才能渲染其完整内容\n                    （通常用于 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SolidLabel"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 未启用尾部省略号）。\n                    为该组合分配最小尺寸，\n                    只需设置 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MinSizeLimitation"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LimitToElement"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    如果此组合有子项，\n                    还将有一个最小尺寸以渲染所有子项。\n                    为该组合分配最小尺寸，\n                    只需设置 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MinSizeLimitation"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LimitToElementAndChildren"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    您还可以使用为该组合指定特定最小尺寸 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "PreferredMinSize"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 属性。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    现在一个组合具有3个最小尺寸（元素、子元素、指定分配）。\n                    它将在每个维度中选择这三个值中的最大值。\n                    结果成为该组合的最小尺寸。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NOTE"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    元素的所需大小是在渲染时计算的。\n                    因此很明显，\n                    当一个元素从未被渲染过时（例如，一个窗口已创建但尚未显示），\n                    或当此元素的属性被更改但窗口尚未刷新时，\n                    您可以通过调用组合的成员函数获得错误的最小尺寸。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "组合的位置",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    位置由以下属性控制：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "Margin"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", defaults to (0,0,0,0)"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "AlignmentToParent"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", defaults to (-1,-1,-1,-1)"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "InternalMargin"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 父组合的，默认为 (0,0,0,0)"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Margin 和 InternalMargin 的任何组件必须为 0 或正数。"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent 的任何组件必须为 -1、0 或正数。"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " (白色) 是此合成与父合成之间的间隙。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Margin"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " (pink) 为该组合添加一个不可见的边框，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InternalMargin"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " (pink) 向父组合添加一个不可见的内部边框。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此组合的位置和大小不包括其 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Margin"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    但父组合的位置和大小包括其自身。 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InternalMargin"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 控制此组合在父组合中的位置。\n                    如果任何组件的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 不是 -1，\n                    此组合将尽力保持与父组合的间距为指定值。\n                    当父级组合增长时，此组合也会增长。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    但间隙无法保证，\n                    其中一个典型原因可能是，\n                    父级组合没有足够的空间来同时满足此组合的间隙和最小尺寸。\n                    在这种情况下：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "最小尺寸胜出"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "如果 AlignmentToParent.left 和 AlignmentToParent.right 都不为 -1，则 AlignmentToParent.left 优先。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "AlignmentToParent.top 在 AlignmentToParent.bottom 不为 -1 时胜出"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 也会影响父组合的最小尺寸\n                    if "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MinSizeLimitation"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 父组合的设置为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LimitToElementAndChildren"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NOTE"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    一些组合如 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<SideAligned/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " or "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<PartialView/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    忽略 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AlignmentToParent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Margin"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "将按钮保持在窗口的右下角",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这非常直接：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Button>\r\n  <att.BoundsComposition AlignmentToParent=\"left:-1 top:-1 right:5 bottom:5\"/>\r\n</Button>"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    通过这样做，\n                    按钮将保持距离其父容器右侧5像素（96 dpi）的位置。\n                    并且距离其父控件底部5像素（96 dpi）\n                    当其父控件的大小改变时，\n                    按钮将贴靠在右下角。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NOTE"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "：\n                    建议您使用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Table/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当你可以的时候，\n                    由于按钮的大小可能会因为不同操作系统语言配置下的文本不同而改变。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "<Table/>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 有助于组织按钮和按钮上方的内容，\n                    或当右下角有多个按钮时。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "定位属性的数据绑定",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                仅 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "DON'T DO THIS"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IT IS DANGEROUS"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将一个定位属性绑定到另一个定位属性。\n                例如，\n                您可能希望保持一个组合恰好占据其父组合的左半部分。\n                但是如果你绑定 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 的大小的此组合，\n                它可能导致其父组合持续增长。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当父组合对象增大时（例如拖动窗口），\n                子组合也会增长，因为它希望保持间隙完全一致。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                那之后 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "AlignmentToParent"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也随着子组合的增加而增加，\n                并且它会使父级组合再次增长，因为间隙变大了。\n                这个过程永远不会停止，\n                窗口在调整大小时会持续增长。\n                直到永远。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "其他属性",
        "content": [
          {
            "kind": "Topic",
            "title": "AssociatedControl",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回控件，\n                    其所属的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BoundsComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 这是组合吗？\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性可以返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当此组合不是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BoundsComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 控件的\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "RelatedControl",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回包含此组合的最内层控件。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性可以返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当此组合尚未放入控件中时。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "RelatedControlHost",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回包含此组合的窗口。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性可以返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当此组合尚未放入控件中时。\n                    或者控件尚未放入窗口中。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "MinPreferredClientSize",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回此组合的最小可能大小。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性是一个只读属性。\n                    与……不同 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "PreferredMinSize"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 哪个是可自定义的约束，用于计算最小尺寸？\n                    此属性返回计算结果。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "PreferredBounds",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回此组合的完美位置和大小。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这不是最终结果，\n                    它可能不准确，因为计算基于的信息可能已过时。\n                    当某些元素的属性在上一次渲染后被更改时。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "边界",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回此组合在其父组合中的相对位置。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "ForceCalculateSizeImmediately 方法",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此函数立即根据约束条件刷新此属性的大小。\n                但若此组合中的元素尚未渲染，\n                或由于元素的某些属性被更改而尚未重新渲染，\n                此函数可能返回不准确的结果。\n                这取决于元素渲染器的实现。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
