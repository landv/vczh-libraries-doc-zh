  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "编辑器控件",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            文档和文本控件是两种用于不同目的的编辑控件。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "文档控件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",

            ]

            "kind": "Paragraph",

              {
                "kind": "Text",

                "kind": "List",

                      }

                    "kind": "ContentListItem",

                      {
                        "kind": "Text",

            ]
          },

            "kind": "Paragraph",

              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "<DocumentViewer/>"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "<DocumentTextBox/>"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "<DocumentLabel/>"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },

        "kind": "Topic",
        "title": "文本控件",

          {
            "kind": "Paragraph",
            "content": [

                "kind": "Text",
                "text": "\n                文本控件设计用于显示编程语言。\n                它渲染UCS-2或UTF-16代码点\n                （取决于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "wchar_t"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在你的编译器中）\n                独立地以简单的从左到右布局。\n            "
              }
            ]

            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                文本控件不支持富文本格式：\n                "

                "kind": "List",
                "ordered": false,
                "items": [

                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        仅支持字符\n                        图像、控件或组合无法嵌入到字符中。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        没有段落。\n                        多行文本由 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CRLF"
                          }
                        ]

                      {
                        "kind": "Text",
                        "text": " 字符。\n                        您可以插入 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "LF"
                          }
                        ]

                      {
                        "kind": "Text",
                        "text": " 但它将被转换为 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CRLF"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 立即。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        所有字符大小和字体相同，但颜色不同。\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          },

            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                GacUI 中有两个文本控件：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "<SinglelineTextBox/>"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",

                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "颜色化",
            "content": [
              {
                "kind": "Paragraph",

                  {
                    "kind": "Text",
                    "text": "\n                    仅在文本控件中启用着色功能。\n                    文本可以通过多个正则表达式或完全通过代码进行着色。\n                    可以通过代码实现额外的上下文敏感着色。\n                    在正则表达式之上。\n                "
                  }
                ]
              }
            ]

            "content": [

                "kind": "Paragraph",

                    "kind": "Text",
                    "text": "\n                    自动完成仅在文本控件中启用。\n                    自动完成候选可以在输入时动态提供，\n                    以及文本控件将处理 UI。\n                "
                  }
                ]
              }
            ]
          },

            "kind": "Topic",

                "kind": "Paragraph",

                  },

                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "VlppParser"

                    ]

                    "kind": "Text",
                    "text": ".\n                    But a new "

                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "VlppParser2"
                      }
                    ]
                  },

                    "kind": "Text",
                    "text": " 即将到来，\n                    支持使用更强大的抽象语法树（AST）设计进行代码重构。\n                "
                  }
                ]
              }
            ]
          }
        ]
      }

  }

  }

  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
