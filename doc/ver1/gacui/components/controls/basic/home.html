                    "text": "\n                    此属性提供了一种在窗口与子控件的控件模板之间进行通信的方式。\n                    这个属性的典型场景是分配一个对象。\n                    控件模板将获取相同的对象并订阅其事件。\n                    窗口可以与该对象通信，并接受控件模板以进行更改。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Context"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当此属性更改时，控件模板会自动更新。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    请检出\n                    "
                  },
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/tree/master/Tutorial/GacUI_Controls/TriplePhaseImageButton",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        此教程项目\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    作为一个示例。\n                    在此项目中，\n                    它创建了一个新的控件 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TriplePhaseButton"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 具有不同状态下的不同图像。\n                    此新控件将自身传递给 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Context"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 控件内部的按钮\n                    然后该按钮的控件模板直接与此新控件通信，\n                    使按钮的行为类似于三态按钮（不同于双态按钮，如复选框）。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Focused (FocusedChanged)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这个属性的默认值 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetFocus"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 尝试将焦点移动到此控件。\n                    聚焦的控件会接收键盘和字符输入到窗口。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "标签",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这个属性的默认值 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性接受任何值。\n                    它只是将一个值关联到控件上。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "控件模板",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                以下属性和事件控制控件的模板。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "ControlThemeName (ControlThemeNameChanged)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    A "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ThemeTemplates"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 包含控件模板实现的控件。\n                    每个控件模板工厂字段都是可选的。\n                    多个 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ThemeTemplates"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 可以使用进行注册和注销 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RegisterTheme"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "UnregisteredTheme"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    后注册的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ThemeTemplates"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 有更高的优先级。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当调用时， "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetCurrentTheme->CreateStyle(themeName)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    它会遍历所有已注册的主题并查找是否存在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ThemeTemplates"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 为指定的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "themeName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlThemeName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 属性指定应为此模板使用哪个控件模板。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    不同的控件类对此属性有不同的默认值。\n                    在大多数情况下，此属性在运行时不会被更改。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlThemeName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被更改并且 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlTemplate"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 为空，\n                    此控件的控件模板将立即更改。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetControlThemeNameAndTemplate"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是用于同时更改 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlThemeName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlTemplate"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 同时以提高性能。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "ControlTemplate (ControlTemplateChanged)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当您不希望使用此控件的注册控件模板时，此属性被使用。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这个属性的默认值为空。\n                    此属性的值必须是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::Func"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 对于函数类型。 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "templates::GuiControlTemplate*(const reflection::description::Value&)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    请检出\n                    "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/gacui/xmlres/instance/properties.html#Control-Item-Template-func-data-Object-TEMPLATE-CLASS-",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        此页面\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    关于在 GacUI XML 资源中使用此属性的详细信息。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlTemplate"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被分配了一个空值，\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlThemeName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 触发并更新此控件的控件模板。\n                    当 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlTemplate"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被分配了一个非空值，\n                    此属性用于评估以创建此控件的控件模板。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetControlThemeNameAndTemplate"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是用于同时更改 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlThemeName"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ControlTemplate"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 同时以提高性能。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "ControlTemplateObject",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    此属性返回当前使用的控件模板实例。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    控件模板也是一个组合，\n                    并且它有 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BoundsComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ContainerComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " too.\n                    但它们与控件的同一属性的值不同。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "FocusComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 与控件和控件模板相同。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "上下文",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                以下属性和事件提供对控件上下文的访问。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "父级（ControlSignalTrigerred）",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    控件出现在其 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Parent"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    否则此属性返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " （通常用于窗口和菜单）。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    直接将控件添加到另一个控件内部，\n                    只需简单调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AddChild"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，这会添加子控件的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BoundsComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 到父控件的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ContainerComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    当子控件的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BoundsComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 不是父控件的直接子控件组合 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ContainerComposition"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetChildrenCount"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetChild"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 和 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HasChild"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    为子控件提供访问权限。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "RelatedControlHost（ControlSignalTrigerred）",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RelatedControlHost"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 是控件的根父控件，\n                    通常是一个窗口或菜单。\n                    否则此属性返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " （通常用于窗口和菜单）。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "行为",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                以下属性和事件控制控件的行为。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "AcceptTabInput",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这个属性的默认值 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当此属性设置为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    pressing "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TAB"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 当此控件具有焦点时，键入 a "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TAB"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 字符进入此控件。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "TabPriority",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这个属性的默认值 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "-1"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    按下 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TAB"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 在一个窗口中使焦点在所有具有非负值的控件之间移动 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "TabProperty"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 从低到高。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Alt (AltChanged)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    这个属性的默认值 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\"\""
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    按下 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ALT"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 引起一个窗口打印所有可接受的键以将焦点移动到所有具有非空值的控件 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Alt"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
