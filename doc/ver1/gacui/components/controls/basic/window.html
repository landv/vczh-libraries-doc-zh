                "kind": "Text",
                "text": " 作为子窗口：\n                "

                "kind": "List",

                "items": [

                    "kind": "ContentListItem",

                        "kind": "Strong",

                        "text": "：\n                        此函数使窗口以模态窗口的形式可见。\n                        模型窗口在可见时会禁用其所有者。\n                        第二个参数将在该窗口关闭后作为回调调用，\n                        然后其所有者窗口变为启用状态。\n                    "

                    "kind": "ContentListItem",

                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",

                        "kind": "Text",
                        "text": ":\n                        Just like "

                      {
                        "kind": "Strong",
                        "content": [

                        "kind": "Strong",
                        "content": [

                            "text": "Clicked"

                      },
                      {
                        "kind": "Text",
                        "text": " event.\n                        With "

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ref.CodeBehind=\"true\""
                          }

                      },
                      {
                        "kind": "Text",
                        "text": "，\n                        在中生成一个占位符\n                        "

                      {
                        "kind": "PageLink",

                        "kind": "Text",
                        "text": ".\n                    "

                    "kind": "ContentListItem",

                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ShowModalAsync"

                      },
                      {
                        "kind": "Text",
                        "text": ":\n                        Just like "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "ShowModal"

                        "kind": "Text",
                        "text": "，\n                        但它返回一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::Async^"
                          }

                      },
                      {
                        "kind": "Text",
                        "text": " (or "
                      },
                      {
                        "kind": "Strong",
                        "content": [

                            "kind": "Text",
                            "text": "Ptr<reflection::description::IAsync>"

                        "kind": "Text",
                        "text": " in C++).\n                        此函数可用于， "

                        "kind": "PageLink",

                        "content": [
                          {
                            "kind": "Text",
                            "text": "$Await"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ",\n                        it simplies "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Workflow"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " GacUI XML 资源中的脚本很多。\n                        请检出\n                        "
                      },
                      {
                        "kind": "PageLink",
                        "href": "https://github.com/vczh-libraries/Release/blob/master/Tutorial/GacUI_Controls/AddressBook/UI/Resource.xml",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            此教程项目\n                        "
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\n                        和\n                        "
                      },
                      {
                        "kind": "PageLink",
                        "href": "https://github.com/vczh-libraries/Release/blob/master/Tutorial/GacUI_ControlTemplate/BlackSkin/UI/FullControlTest/DocumentEditorBase.xml",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\n                            此教程项目\n                        "
                          }

                        "kind": "Text",
                        "text": "\n                        详细信息。\n                        它们使用 "

                        "kind": "Text",

                      },
                      {
                        "kind": "Text",
                        "text": " 不使用 lambda 表达式作为回调。\n                    "
