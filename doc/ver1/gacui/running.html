          {
            "kind": "Topic",
            "title": "GacUI.xml",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    GacUI 允许资源文件依赖其他资源文件。\n                    GacUI.xml 放置在根目录中。\n                    在 GacUI.xml 上运行 GacBuild.ps1，它将递归搜索所有资源文件。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    在本教程中，我们只有一个资源文件，\n                    即 UI\\Resource.xml。\n                    在这种情况下，GacUI.xml的内容非常简单：\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "<GacUI/>",
                    "language": "xml"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "UI\\Resource.xml",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    在此文件中，我们指定了以下信息：\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "存储生成的C++文件的位置"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "存储生成的二进制资源文件的位置"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "包含 \"GacUI.h\"，因为我们不需要运行时反射"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "名称为 HelloWorld"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "描述HelloWorld窗口"
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\r\n<Resource>\r\n<Folder name=\"GacGenConfig\">\r\n    <Folder name=\"Cpp\">\r\n    <Text name=\"SourceFolder\">Source</Text>\r\n    <Text name=\"Resource\">..\\HelloWorld.bin</Text>\r\n    <Text name=\"NormalInclude\">GacUI.h</Text>\r\n    <Text name=\"Name\">HelloWorld</Text>\r\n    </Folder>\r\n</Folder>\r\n<Folder name=\"MainWindow\">\r\n    <Instance name=\"MainWindowResource\">\r\n        <Instance ref.CodeBehind=\"false\" ref.Class=\"helloworld::MainWindow\">\r\n            <Window Text=\"Hello, world!\" ClientSize=\"x:480 y:320\">\r\n                <att.BoundsComposition-set PreferredMinSize=\"x:480 y:320\"/>\r\n                <Label Text=\"Welcome to GacUI Library!\">\r\n                    <att.Font>fontFamily:\"Segoe UI\" size:32 antialias:true</att.Font>\r\n                </Label>\r\n            </Window>\r\n        </Instance>\r\n    </Instance>\r\n</Folder>\r\n</Resource>",
                    "language": "xml"
                  }
                ]
              }
            ]
          }
        ]

            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在这个项目中我们不需要运行时反射，\n                因此你必须定义一个空的 "
              },

                "kind": "Strong",

                "kind": "PageLink",

            "kind": "Paragraph",

                "kind": "Program",

                "language": "c++"
              }

                "kind": "Text",
                "text": "\n                请注意，您需要仔细放置 "

                "kind": "Strong",

                    "kind": "Text",

                "kind": "Strong",

                    "kind": "Text",
                    "text": "基于可执行文件的完整路径计算绝对路径"

              },
              {
                "kind": "Text",
                "text": ".\n                "
              },
              {
                "kind": "Strong",
                "content": [

                    "text": "GetApplication()->GetExecutableFolder()"

                ]
              },

              }
            ]
          }
