        ]
      },
      {

        "content": [

      },
      {
        "kind": "Topic",
        "title": "线程和线程池",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ThreadPoolLite"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 建议始终尽可能使用，而不是使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Thread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                等待线程退出有点棘手，\n                使用它要安全得多 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EventObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 为此目的。\n                这就是为什么不建议您使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Thread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 直接。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                要启动后台任务，这是最简单的方法：\n                "
              },
              {
                "kind": "Program",
                "code": "ThreadPoolLite::Queue([]()\r\n{\r\n    // do something\r\n});"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                一个自动删除的线程也可以完成同样的工作：\n                "
              },
              {
                "kind": "Program",
                "code": "Thread::CreateAndStart([]()\r\n{\r\n    // do something\r\n}, true);"
              },
              {
                "kind": "Text",
                "text": "\n                通过传递 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 作为第二个参数，\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Thread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象将在函数结束之后被删除。\n                必须注意的是，\n                当你获取返回值时 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Thread"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 来自对象的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CreateAndStart"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数，\n                线程可能已经完成，然后对象被删除了。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                等待任务完成，\n                手动取消信号 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EventObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 建议始终使用。\n                手动取消信号意味着，当事件对象被信号触发且有某个对象接收该事件时，\n                事件对象不会自动取消信号。\n                "
              },
              {
                "kind": "Program",
                "code": "EventObject stopEvent;\r\nstopEvent.CreateManualUnsignal(false);\r\n\r\nThreadPoolLite::Queue([&]()\r\n{\r\n    // do something\r\n    stopEvent.Signal();\r\n});\r\n\r\nstopEvent.Wait();"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "线程局部变量",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                通过使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ThreadVariable<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 作为全局变量，\n                创建了一个线程局部变量。\n                "
              },
              {
                "kind": "Program",
                "code": "ThreadVariable<int> v;\r\n\r\nThreadPoolLite::Queue([&]()\r\n{\r\n    // this thread has a copy of v\r\n    v.Set(1);\r\n});\r\n\r\nThreadPoolLite::Queue([&]()\r\n{\r\n    // this thread has another copy of v too\r\n    v.Set(2);\r\n});\r\n\r\n// the main thread also has a different copy of v\r\nv.Set(3);"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Mutex、CriticalSection 和 SpinLock",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Mutex"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CriticalSection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SpinLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 非常相似。\n                当多个线程正在等待一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Mutex"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", a "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CriticalSection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SpinLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                同一时间只能有一个线程获取它。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Mutex"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 使用系统资源。建议在以下情况使用：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "长时间拥有互斥锁的情况可能发生。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "在多个进程之间同步多个操作。全局互斥量需要一个名称来创建。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CriticalSection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 比 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Mutex"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ". 当以下情况时建议使用：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "长时间拥有临界区的情况可能发生。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "（仅限 Windows）"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 您需要一个可组合的锁。当临界区被一个线程拥有时，该特定线程可以再次获取临界区而不会导致死锁。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CS_LOCK"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 宏是一种方便的等待临界区的方法：\n                "
              },
              {
                "kind": "Program",
                "code": "CriticalSection cs;\r\n\r\nCS_LOCK(cs)\r\n{\r\n    // do something when owning the lock\r\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SpinLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 建议在...时使用\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "始终仅短暂地拥有自旋锁。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SPIN_LOCK"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 宏是一种方便的等待自旋锁的方式：\n                "
              },
              {
                "kind": "Program",
                "code": "SpinLock lock;\r\n\r\nSPIN_LOCK(lock)\r\n{\r\n    // do something when owning the lock\r\n}"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "信号量",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Semaphore"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 类似于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Mutex"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                主要区别在于，\n                多个线程可以同时获取同一个信号量。\n                您可以设置最大拥有线程数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                信号量可以作为全局对象创建以在进程间使用，它需要一个名称来创建。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "EventObject",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EventObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不能被线程拥有。相反，它用于通知某事发生。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "（仅限 Windows）"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以将事件对象创建为全局对象以在进程间使用，它需要一个名称来创建。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                A自动取消信号事件使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CreateAutoUnsignal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                当多个线程正在等待自动取消信号事件时，\n                如果此事件被信号通知，只有一个线程会收到通知，并且事件会自动取消信号。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                手动取消信号事件通过 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CreateManualUnsignal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                当多个线程正在等待自动取消信号事件时，\n                如果此事件被信号通知，所有线程都会收到通知。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "ReaderWriterLock",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReaderWriterLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以在多个线程中被拥有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "阅读模式"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果任何线程拥有一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReaderWriterLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "阅读模式"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，在中没有线程可以拥有它 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "写入模式"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReaderWriterLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 只能在单个线程中被拥有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "写入模式"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果任何线程拥有一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReaderWriterLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "写入模式"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，在中没有线程可以拥有它 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "阅读模式"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                建议使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReaderWriterLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 以这种方式：\n                "
              },
              {
                "kind": "Program",
                "code": "ReaderWriterLock lock;\r\n\r\nREADER_LOCK(lock)\r\n{\r\n    // do something when owning the lock in reader mode\r\n}\r\n\r\nWRITER_LOCK(lock)\r\n{\r\n    // do something when owning the lock in writer mode\r\n}"
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "ConditionVariable",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReaderWriterLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 当您需要暂时放弃时使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CriticalSection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 或一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReaderWriterLock"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 等待信号。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                不建议您使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "EventObject"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在这种情况下\n                因为很容易陷入死锁。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SleepWith"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 方法用于暂时放弃一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CriticalSeciont"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "（仅限 Windows）"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SleepWithReader"
                  }
                ]
