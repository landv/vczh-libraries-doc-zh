              ]

};
  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "调用 C++ 类",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            涉及的文件：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/blob/master/Tutorial/Console_Workflow/W02_InvokingCppClasses/Main.cpp",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Main.cpp"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在 Workflow 脚本中允许使用可反射的类型。\n            这里我们定义一种类型，用于从控制台窗口读取和写入。\n            "
          },
          {
            "kind": "PageLink",
            "href": "/vlppreflection/ref/VL__REFLECTION__DESCRIPTION.html",
            "content": [
              {
                "kind": "Text",
                "text": "注册"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 此类是必需的，\n            但代码不会在此处粘贴。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            首先我们定义一个可反射的 C++ 类：\n            "
          },
          {
            "kind": "Program",
            "code": "namespace myapi\r\n{\r\n    class App : public Object, public Description<App>\r\n    {\r\n    public:\r\n        static WString Get()\r\n        {\r\n            return Console::Read();\r\n        }\r\n\r\n        static WString Get(const WString& message)\r\n        {\r\n            Console::Write(message);\r\n            return Console::Read();\r\n        }\r\n\r\n        static void Print(const WString& text)\r\n        {\r\n            Console::WriteLine(text);\r\n        }\r\n    };\r\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            其次，我们在工作流脚本中使用这个类：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\r\nusing myapi::*;\r\n\r\nfunc main(): void\r\n{\r\n    var name = App::Get(\"Please enter your name:\");\r\n    App::Print($\"Hello, $(name)!\");\r\n}"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Workflow 使用通配符导入名称，例如 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "using myapi::*;"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            实际上，你可以用它来使用名称的一部分。\n            例如，在 GacUI 中我们有 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "vl::presentation::controls::GuiWindow"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            它通过使用注册 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "presentation::controls::GuiWindow"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            您能够使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Window"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在脚本中通过 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "使用 presentation::controls::Gui*；"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IMPORTANT"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "：\n            虽然在 C++ 中我们可以自由地用原始指针或共享指针创建一个类，\n            但注册构造函数时，必须做出决定。\n            一些构造函数创建原始指针，一些构造函数创建共享指针。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这里我们无法写入 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "new App*()"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " or "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "new App^()"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            因为没有注册构造函数。\n            但当一个构造函数被注册时，\n            以及构造函数返回 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Ptr<App>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            然后仅 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "new App^()"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 允许。\n        "
          }
        ]
      }
    ]
  }
};
