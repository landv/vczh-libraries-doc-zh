  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {

    "title": "继承 C++ 类",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            涉及的文件：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/blob/master/Tutorial/Console_Workflow/W04_InheritingCppClasses/Main.cpp",

                      {

                      }

                  }
                ]
              }
            ]

        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            工作流类允许从可反射的 C++ 类继承。\n            这里我们有一个 C++ 类，包含两个属性：\n            "
          },
          {
            "kind": "Program",
            "code": "namespace myapi\r\n{\r\n    class App : public Object, public AggregatableDescription<App>\r\n    {\r\n    private:\r\n        WString name;\r\n        List<Ptr<IValueSubscription>> subscriptions;\r\n\r\n    public:\r\n        static WString Get();\r\n        static WString Get(const WString& message);\r\n        static void Print(const WString& text);\r\n\r\n        App() = default;\r\n        ~App()\r\n        {\r\n            FOREACH(Ptr<IValueSubscription>, sub, subscriptions)\r\n            {\r\n                sub->Close();\r\n            }\r\n            FinalizeAggregation();\r\n        }\r\n\r\n        Event<void()> NameChanged;\r\n        WString GetName();\r\n        void SetName(const WString& value);\r\n        List<Ptr<IValueSubscription>>& GetSubscriptions();\r\n    };\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            析构函数代码很重要，因此不会被隐藏。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            一个可继承的类需要使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "AggregatableDescription"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 而不是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Description"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "FinalizeAggregation"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 也很重要。\n            如果此函数在销毁继承自 App 的 Workflow 类时未被调用，\n            它会按设计崩溃。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            继承一个可反射的 C++ 类非常直接，\n            但在此版本的Workflow脚本中，类中没有虚方法，\n            因此，您无法重写可反射 C++ 类中的虚方法。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Program",
            "code": "module sampleModule;\r\nusing myapi::*;\r\n\r\nnamespace myscript\r\n{\r\n    class MyApp : App\r\n    {\r\n        new(name: string)\r\n        {\r\n            Name = name;\r\n            /* \"this\" is not allowed in binding, copy it to a variable */\r\n            var self = this;\r\n            var subscription = bind($\"Hello, $(self.Name)\");\r\n            attach(subscription.ValueChanged,\r\n                func (value: object): void\r\n                {\r\n                    Print(cast string value);\r\n                });\r\n            subscription.Open();\r\n            Subscriptions.Add(subscription);\r\n        }\r\n\r\n        delete\r\n        {\r\n            Print(\"Destructing myscript::MyApp\");\r\n        }\r\n    }\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            允许在工作流类中使用构造函数和析构函数。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这里不会详细解释数据绑定，\n            基本上代码正在跟踪 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$\"Hello, $(self.Name)\""
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            When "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 属性已更改，\n            显然，该表达式的结果也发生了改变。\n            当数据绑定被更改时， "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ValueChanged"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 将被调用。\n            这里将格式化的字符串打印到控制台窗口。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            在加载程序集时，Workflow 脚本中定义的所有类和接口都将被注册。\n            这就是为什么您不能加载两次，\n            因为类型之间存在冲突。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当一个可反射类被加载时，\n            无论它是用工作流还是C++实现的\n            调用方式不会改变。\n            但是因为它继承自 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "App"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            获取实例要容易得多 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "App"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Program",
            "code": "auto myapp = UnboxValue<Ptr<App>>(Value::Create(\r\n    L\"myscript::MyApp\",\r\n    (\r\n        Value_xs(), WString(L\"vczh\")\r\n    )));\r\n\r\nmyapp->SetName(L\"Vczh Libraries++\");\r\nmyapp->SetName(L\"Workflow\");\r\nmyapp->SetName(L\"Gaclib\");"
          },
          {
            "kind": "Text",
            "text": "\n            此代码创建 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "myscript::MyApp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 传递给构造函数的字符串。\n            它会更改 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 三次，因此将在控制台窗口中打印四行。\n            最后一个来自析构函数。\n        "
          }
        ]
      }
    ]
  }
