<script lang="javascript">
{

  const mvcViews = [

    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/vczh-libraries-doc-zh/doc/ver1";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "Workflow Script",
      "selected": false,
      "path": [
        "workflow",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "Running a Script",
          "selected": false,
          "path": [
            "workflow",
            "running"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "Running Workflow Scripts",
              "selected": false,
              "path": [
                "workflow",
                "running",
                "running"
              ]
            },
            {
              "icon": " ",
              "name": "Invoking C++ Classes",
              "selected": false,
              "path": [
                "workflow",
                "running",
                "invoking1"
              ]
            },
            {
              "icon": " ",
              "name": "Inheriting C++ Interfaces",
              "selected": false,
              "path": [
                "workflow",
                "running",
                "invoking2"
              ]
            },
            {
              "icon": " ",
              "name": "Inheriting C++ Classes",
              "selected": false,
              "path": [
                "workflow",
                "running",
                "invoking3"
              ]
            },
            {
              "icon": " ",
              "name": "Serializing and Loading Assemblies",
              "selected": false,
              "path": [
                "workflow",
                "running",
                "serializing"
              ]
            },
            {
              "icon": " ",
              "name": "Generating C++ Code",
              "selected": false,
              "path": [
                "workflow",
                "running",
                "generating"
              ]
            },
            {
              "icon": " ",
              "name": "Debugging",
              "selected": true,
              "path": [
                "workflow",
                "running",
                "debugging"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "调试",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            涉及的文件：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "PageLink",
                    "href": "https://github.com/vczh-libraries/Release/blob/master/Tutorial/Console_Workflow/W06_Debugging/Main.cpp",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "W06_Debugging/Main.cpp"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            如果未转换为 C++，它能够调试正在运行的 Workflow 脚本。\n            在此部分中，我们将使用调试器来调试此工作流脚本：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\r\nusing myapi::*;\r\n\r\nfunc main(): void\r\n{\r\n    var name = App::Get(\"Please enter your name:\");\r\n    App::Print($\"Hello, $(name)!\");\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            我们将在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "App::Print"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            并更改 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 变量，\n            并继续运行脚本。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            首先，在初始化程序集后，我们开始调试：\n            "
          },
          {
            "kind": "Program",
            "code": "auto debugger = MakePtr<MyDebugger>();\r\nSetDebuggerForCurrentThread(debugger);"
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "MyDebugger"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 继承 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "WfDebugger"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，它将在后面解释。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            其次，我们设置一个断点：\n            "
          },
          {
            "kind": "Program",
            "code": "debugger->AddCodeLineBreakPoint(assembly.Obj(), 0, 9, true);"
          },
          {
            "kind": "Text",
            "text": "\n            \"0\" 表示第一个文件，\"9\" 表示第10行，\n            哪个是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "App::Print($\"Hello, $(name)!\");"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            我们像往常一样运行脚本。\n            在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数被执行，\n            我们停止调试：\n            "
          },
          {
            "kind": "Program",
            "code": "auto mainFunction = LoadFunction<void()>(globalContext, L\"main\");\r\nmainFunction();\r\nSetDebuggerForCurrentThread(nullptr);"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            现在，在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "App::Print"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 被调用，\n            调试器将收到通知。\n            请注意，\n            在断点被触发后，\n            if "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "WfDebugger::Run"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 或其他类似函数未被调用\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "mainFunction() 将永远被阻塞。"
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            为了在断点被触发时采取行动，\n            我们需要重写 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "WfDebugger::OnBlockExecution"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 像这样：\n            "
          },
          {
            "kind": "Program",
            "code": "class MyDebugger : public WfDebugger\r\n{\r\nprotected:\r\n    void OnBlockExecution()override\r\n    {\r\n        // get the context for the current thread\r\n        auto context = GetCurrentThreadContext();\r\n\r\n        // whatever the input is, change the \"name\" variable to be \"MyDebugger\"\r\n        // it will print \"Hello, MyDebugger!\" after continuing\r\n        auto assembly = context->globalContext->assembly;\r\n        vint functionIndex = context->GetCurrentStackFrame().functionIndex;\r\n        auto functionMetadata = assembly->functions[functionIndex];\r\n        vint indexName = functionMetadata->localVariableNames.IndexOf(L\"name\");\r\n        context->StoreLocalVariable(indexName, BoxValue(WString(L\"MyDebugger\")));\r\n\r\n        // continue\r\n        Run();\r\n    }\r\n};"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            Workflow运行时API的细节将不会在此处解释。\n            基本上这个函数所做的就是，\n            我们首先获取当前正在调试的线程上下文，\n            然后使用程序集中元数据来知道如何更改 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 变量。\n            完成后，\n            继续运行脚本。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            由于我们只设置了一个断点，\n            所以我们不需要说明是哪个断点被触发了 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "OnBlockExecution"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当调试工作流脚本时，我们需要知道以下内容：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "线程默认未分配任何调试器。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "调试器在分配给特定线程时被激活。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "相同的调试器可以分配给多个线程。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    每次调用从函数返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LoadFunction"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 创建一个独立的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WfRuntimeThreadContext"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 对象。\n                    不要假设你总是会得到相同的 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WfRuntimeThreadContext"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 每个线程一个对象。\n                "
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
