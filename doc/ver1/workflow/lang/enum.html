  const article = {

    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            枚举可以在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "modules"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "namespaces"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "classes"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "interfaces"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            有两种类型的枚举：枚举和标志。\n            它们之间的主要区别是，\n            the \""
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "&"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\" and \""
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "|"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\" 运算符未为枚举定义。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            任何枚举类型的值都可以显式转换为 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "system::UInt8"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            的值为 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "system::UInt8"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 也可以显式转换为任何枚举类型，\n            但运行时不会检查转换结果是否为有效的枚举值。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "枚举",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                枚举是一种具有有限值的类型。\n                "
              },
              {
                "kind": "Program",
                "code": "enum Seasons\r\n{\r\n    Spring = 0,\r\n    Summer = 1,\r\n    Autumn = 2,\r\n    Winter = 3,\r\n}"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "每个项目都应分配一个整数。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "第一个项必须赋值为0"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "任何其他项必须比前一项大1"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "最后一个逗号 \""
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": ","
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\" 必须不能省略。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                使用枚举项有 4 种方式：\n                "
              },
              {
                "kind": "Program",
                "code": "func use(s: Seasons):Seasons\r\n{\r\n    return s;\r\n}\r\n\r\nvar a: Seasons = Spring;\r\nvar b = Seasons::Summer;\r\nvar c = Autumn of Seasons;\r\nvar d = use(Winter);"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "var a: Seasons = Spring;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "var d = use(Winter);"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ":\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当接受枚举项表达式的占位符具有已知类型时，\n                枚举项的名称就足够了。\n                变量 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 其类型已显式声明。\n                函数的参数类型 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "use"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也被显式声明了。\n                So "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Seasons::"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不需要。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "var b = Seasons::Summer;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ":\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                另一种方法是显式地写出枚举的名称。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "var c = 季节的秋"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ":\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                第三种方法是显式声明表达式的类型。\n                此用法类似于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "d"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                通过显式声明 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Autumn"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Seasons"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                接受枚举项的位置是“"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "季节的<HERE>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\"\",\n                所以这个地方有一个已知的类型。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "标志",
        "content": [
          {
            "kind": "Paragraph",

              {
                "kind": "Text",
                "text": "\n                标志是一种具有有限值及其组合的类型。\n                "

                "kind": "Program",
                "code": "flagenum Seasons\r\n{\r\n    None = 0,\r\n    Spring = 1,\r\n    Summer = 2,\r\n    Autumn = 4,\r\n    Winter = 8,\r\n    GoodSeasons = Spring | Autumn,\r\n    BadSeasons = Summer | Winter,\r\n}"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "每个项目都应分配一个整数。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "第一个项必须赋值为0。通常第一个项是 "

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "None"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "，你可以自由使用任何名称。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "任何其他项必须是前一项的两倍"

                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "项目组合的别名必须放在所有项目之后。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "最后一个逗号 \""
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": ","
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\" 必须不能省略。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                就像枚举一样，标志位也具有类型推断功能：\n                "
              },
              {
                "kind": "Program",
                "code": "func use(s: Seasons):Seasons\r\n{\r\n    return s;\r\n}\r\n\r\nvar a: Seasons = Spring | Summer;\r\nvar b = Seasons::Summer | Seasons::Autumn;\r\nvar c = (Autumn | Winter) of Seasons;\r\nvar d = use(Winter | Spring);"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如你所见，\n                运算符 \""
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "&"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\" and \""
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "|"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\" 都会自动为标志定义。\n                当它用于标志时，\n                它要求两个操作数必须是相同的类型。\n                结果的类型与操作数相同。\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\""
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "|"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\" 返回两个操作数的并集。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\""
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "&"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "\" 返回两个操作数的交集。"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                这两个运算符也定义为整数。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
