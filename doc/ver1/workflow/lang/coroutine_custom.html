  const article = {
  "index": true,

  "topic": {
    "kind": "Topic",
    "title": "设计你自己的协程",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            协程提供者是一个具有特定命名约定方法的类。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            协程提供者可以用带反射的 C++ 或者 Workflow 编写。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "命名你的协程",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果你希望协程以这种方式编写：\n                "
              },
              {
                "kind": "Program",
                "code": "func MyCoroutine(): void\r\n$Foo {\r\n    /* ... */\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                您需要像这样定义协程提供者：\n                "
              },
              {
                "kind": "Program",
                "code": "using system::*;\r\n\r\nclass FooCoroutine\r\n{\r\n    class InternalState\r\n    {\r\n        /* ... */\r\n    }\r\n\r\n    static CreateAndRun(creator: func(InternalState*): (Coroutine^)): void\r\n    {\r\n        /* ... */\r\n    }\r\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果你希望协程以这种方式编写：\n                "
              },
              {
                "kind": "Program",
                "code": "func MyCoroutine(): Foo^\r\n${\r\n    /* ... */\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                or\n                "
              },
              {
                "kind": "Program",
                "code": "$interface StringFoo : Foo<string>;\r\nfunc MyCoroutine(): StringFoo^\r\n${\r\n    /* ... */\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                您需要像这样定义协程提供者：\n                "
              },
              {
                "kind": "Program",
                "code": "using system::*;\r\n\r\ninterface Foo\r\n{\r\n    /* ... */\r\n}\r\n\r\nclass FooCoroutine\r\n{\r\n    class InternalState\r\n    {\r\n        /* ... */\r\n    }\r\n\r\n    static Create(creator: func(InternalState*): (Coroutine^)): Foo^\r\n    {\r\n        /* ... */\r\n    }\r\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "FooCoroutine::InternalState"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 可以是类或接口。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Create"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 和 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CreateAndRun"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 可以同时出现。\n                        这使得协程函数能够返回两种 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "void"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 和 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Foo^"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        的返回类型 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Create"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 必须与协程函数的返回类型兼容：\n                        "
                      },
                      {
                        "kind": "List",
                        "ordered": false,
                        "items": [
                          {
                            "kind": "ContentListItem",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "If "
                              },
                              {
                                "kind": "Strong",
                                "content": [
                                  {
                                    "kind": "Text",
                                    "text": "Create"
                                  }
                                ]
                              },
                              {
                                "kind": "Text",
                                "text": " 返回 "
                              },
                              {
                                "kind": "Strong",
                                "content": [
                                  {
                                    "kind": "Text",
                                    "text": "Foo^"
                                  }
                                ]
                              },
                              {
                                "kind": "Text",
                                "text": "，然后协程函数可以返回 "
                              },
                              {
                                "kind": "Strong",
                                "content": [
                                  {
                                    "kind": "Text",
                                    "text": "Foo^"
                                  }
                                ]
                              },
                              {
                                "kind": "Text",
                                "text": " 或其任何基类型。"
                              }
                            ]
                          },
                          {
                            "kind": "ContentListItem",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "If "
                              },
                              {
                                "kind": "Strong",
                                "content": [
                                  {
                                    "kind": "Text",
                                    "text": "Create"
                                  }
                                ]
                              },
                              {
                                "kind": "Text",
                                "text": " 返回 "
                              },
                              {
                                "kind": "Strong",
                                "content": [
                                  {
                                    "kind": "Text",
                                    "text": "Foo^"
                                  }
                                ]
                              },
                              {
                                "kind": "Text",
                                "text": "，然后协程函数可以返回一个通用版本的 "
                              },
                              {
                                "kind": "Strong",
                                "content": [
                                  {
                                    "kind": "Text",
                                    "text": "Foo^"
                                  }
                                ]
                              },
                              {
                                "kind": "Text",
                                "text": "."
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        唯一的参数是 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Create"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " or "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "CreateAndRun"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 应该是一个函数：\n                        "
                      },
                      {
                        "kind": "List",
                        "ordered": false,
                        "items": [
                          {
                            "kind": "ContentListItem",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "接收一个对象的原始指针用于存储内部状态。"
                              }
                            ]
                          },
                          {
                            "kind": "ContentListItem",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "必须返回 "
                              },
                              {
                                "kind": "Strong",
                                "content": [
                                  {
                                    "kind": "Text",
                                    "text": "Coroutine^"
                                  }
                                ]
                              },
                              {
                                "kind": "Text",
                                "text": "."
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个协程函数被调用时，\n                或者 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Create"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CreateAndRun"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将被调用。\n                您负责创建用于存储内部状态的对象，\n                然后一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将提供给您。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                协程函数获取并存储内部状态对象。\n                当由于以下原因调用协程提供程序中的任何方法时，\n                协程提供者， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "return"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                此对象将用作第一个参数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                协程函数中在第一次调用之前不会执行任何内容 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine::Resume"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                每当调用协程操作时，\n                协程暂停，\n                和另一个调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine::Resume"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 用于继续协程函数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine::Resume"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被调用，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine::Failure"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine::Status"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 必须按顺序读取，以正确处理协程操作。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "定义协程操作",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果您想支持\n                "
              },
              {
                "kind": "Program",
                "code": "$Do1;\r\n$Do2 something;\r\n$Do3 something, otherthings;"
              },
              {
                "kind": "Text",
                "text": "\n                您需要向您的协程提供者添加以下方法：\n                "
              },
              {
                "kind": "Program",
                "code": "static Do1AndPause(internalState: InternalState*): void { /* ... */ }\r\nstatic Do2AndPause(internalState: InternalState*, something: Something): void { /* ... */ }\r\nstatic Do3AndPause(internalState: InternalState*, something: Something, otherthings: Otherthings): void { /* ... */ }"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果您想同时支持\n                "
              },
              {
                "kind": "Program",
                "code": "$Do1;\r\n$Do2 something;\r\n$Do3 something, otherthings;"
              },
              {
                "kind": "Text",
                "text": "\n                和\n                "
              },
              {
                "kind": "Program",
                "code": "var x = $Do1;\r\nvar y = $Do2 something;\r\nvar z = $Do3 something, otherthings;"
              },
              {
                "kind": "Text",
                "text": "\n                您需要向您的协程提供者添加以下方法：\n                "
              },
              {
                "kind": "Program",
                "code": "static Do1AndRead(internalState: InternalState*): void { /* ... */ }\r\nstatic Do2AndRead(internalState: InternalState*, something: Something): void { /* ... */ }\r\nstatic Do3AndRead(internalState: InternalState*, something: Something, otherthings: Otherthings): void { /* ... */ }"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                允许重载。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个协程操作被调用时，\n                这些方法中的一个将被调用，\n                以及创建的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将在那之后立即暂停。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                所有协程操作的方法必须返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "void"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                协程恢复后，\n                协程操作的返回值来自第二个参数。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Coroutine::Resume"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此参数是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CoroutineResult^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "如果协程操作成功，返回值将存储在 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Result"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 属性。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "如果协程操作成功，异常将存储在 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Failure"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 属性。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        If "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Failure"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 不为 null，\n                        "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Result"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 将被忽略。\n                        将抛出一个异常。\n                        如果没有 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "try-catch"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 在此协程函数中，\n                        协程会立即以该异常停止。\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "定义返回语句",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果您想支持\n                "
              },
              {
                "kind": "Program",
                "code": "return;"
              },
              {
                "kind": "Text",
                "text": "\n                您需要向您的协程提供者添加此方法：\n                "
              },
              {
                "kind": "Program",
                "code": "static ReturnAndExit(internalState: InternalState*): void { /* ... */ }"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果您想支持\n                "
              },
              {
                "kind": "Program",
                "code": "return something;"
              },
              {
                "kind": "Text",
                "text": "\n                您需要向您的协程提供者添加此方法：\n                "
              },
              {
                "kind": "Program",
                "code": "static ReturnAndExit(internalState: InternalState*, something: Something): void { /* ... */ }"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                两种方法可以同时出现。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "return"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被调用，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReturnAndExit"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将被调用，\n                以及协程立即停止。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "定义 $ 表达式",
        "content": [
          {
            "kind": "Paragraph",
