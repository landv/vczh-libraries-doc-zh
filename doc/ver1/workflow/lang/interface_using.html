  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "通用（接口）",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            接口实际上不支持泛型，\n            但有时它在中表现得像泛型 "
          },
          {
            "kind": "PageLink",
            "href": "/workflow/lang/coroutine.html",
            "content": [
              {
                "kind": "Text",

              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            这是一个由工作流创建的协程示例：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\r\n\r\nusing system::*;\r\n\r\ninterface Reader\r\n{\r\n}\r\n\r\n$interface IntReader: Reader<int?>;\r\n$interface StringReader: Reader<string?>;\r\n\r\nfunc Read(): Reader^\r\n{\r\n    return new Reader^{};\r\n}\r\n\r\nfunc ReadInt(): IntReader^\r\n{\r\n    return new IntReader^(using Read());\r\n}\r\n\r\nfunc ReadString(): StringReader^\r\n{\r\n    return new StringReader^(using Read());\r\n}\r\n\r\nclass ReaderCoroutine\r\n{\r\n    class Executor\r\n    {\r\n        var readObject: bool = false;\r\n        var source: Enumerable^ = {};\r\n        var enumerator: Enumerator^ = null;\r\n        var co: Coroutine^ = null;\r\n        var result: object = null;\r\n\r\n        func Continue(): bool\r\n        {\r\n            if (co.Status == CoroutineStatus::Stopped)\r\n            {\r\n                return false;\r\n            }\r\n\r\n            var cr = new CoroutineResult^();\r\n            if (co.Failure is not null)\r\n            {\r\n                cr.Failure = co.Failure;\r\n            }\r\n            else if (readObject and enumerator is not null)\r\n            {\r\n                if (enumerator.Next())\r\n                {\r\n                    cr.Result = enumerator.Current;\r\n                }\r\n            }\r\n            co.Resume(false, cr);\r\n            return true;\r\n        }\r\n    }\r\n\r\n    static func SetAndPause(impl: Executor*, numbers: Enumerable^): void\r\n    {\r\n        impl.source = numbers;\r\n        impl.enumerator = numbers.CreateEnumerator();\r\n        impl.readObject = false;\r\n    }\r\n\r\n    static func GetAndRead(impl: Executor*, reader: Reader^): void\r\n    {\r\n        impl.readObject = true;\r\n    }\r\n\r\n    static func ReturnAndExit(impl: Executor*, value: object): void\r\n    {\r\n        impl.result = value;\r\n    }\r\n\r\n    static func Create(creator: func(Executor*): (Coroutine^)): ReaderCoroutine::Executor^\r\n    {\r\n        var e = new Executor^();\r\n        e.co = creator(cast Executor* e);\r\n        return e;\r\n    }\r\n}\r\n\r\nfunc Sum(): ReaderCoroutine::Executor^\r\n$Reader{\r\n    $Set range [1, 10];\r\n    var sum = 0;\r\n    while (true)\r\n    {\r\n        var current = $Get ReadInt();\r\n        if (current is null)\r\n        {\r\n            break;\r\n        }\r\n        sum = sum + current;\r\n    }\r\n    return sum;\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var e = Sum();\r\n    while (e.Continue()) {}\r\n    return cast string e.result;\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Sum"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数执行：\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [

                    "kind": "Text",

                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$Set"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 设置一个数字集合。"
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "调用 "

                    "content": [
                      {
                        "kind": "Text",
                        "text": "$Read"
                      }
                    ]
                  },

                  }
                ]
              },

            ]
          },

            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数获取从 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Sum"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            驱动协程运行直到产生结果。\n        "
          }
        ]

      {
        "kind": "Topic",
        "title": "$interface IDerived: IBase<TYPE>;",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在示例中，有：\n                "
              },
              {
                "kind": "Program",
                "code": "$interface IntReader: Reader<int?>;\r\n$interface StringReader: Reader<string?>;"
              },
              {
                "kind": "Text",
                "text": "\n                扩展为：\n                "
              },
              {
                "kind": "Program",
                "code": "interface IntReader : Reader\r\n{\r\n    static func CastResult(value : ::system::Object) : (int?)\r\n    {\r\n        return (cast (int?) value);\r\n    }\r\n\r\n    static func StoreResult(value : int?) : (::system::Object)\r\n    {\r\n        return value;\r\n    }\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                因此，例如：\n                "
              },
              {
                "kind": "Program",
                "code": "$interface StringReader: Reader<string?>;"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$interface"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 简单创建一个界面\n                继承自指定的那一个\n                并添加静态函数 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CastResult"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "StoreResult"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                用于在不同值之间进行强制转换， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "object"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 并且指定的泛型参数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "$Get"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 知道返回值的类型。\n                显然在：\n                "
              },
              {
                "kind": "Program",
                "code": "var current = $Get ReadInt();"
              },
              {
                "kind": "Text",
                "text": "\n                类型 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "current"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "int?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                because "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReadInt"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IntReader^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                其中， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CastResult"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "int?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                原始接口的外观无关紧要。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "new TYPE^（使用 OBJECT）",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此表达式创建一个接口对象， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "TYPE"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                将所有方法重定向到 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OBJECT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                它需要满足以下要求：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 并且类型为 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 两者都应为接口。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 必须与类型不同 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 必须从该类型继承 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". 它不必是直接的基类型。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "TYPE"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 不能包含比类型更多的成员 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "OBJECT"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "new 类型*"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 也根据情况可用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "TYPE"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已声明。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如：\n                "
              },
              {
                "kind": "Program",
                "code": "interface Reader\r\n{\r\n    func Dummy(): void;\r\n}\r\n\r\n$interface IntReader: Reader<int?>;\r\n\r\nfunc ReadInt(): IntReader^\r\n{\r\n    return new IntReader^(using Read());\r\n}"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReadInt"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 展开为：\n                "
              },
              {
                "kind": "Program",
                "code": "func ReadInt() : (IntReader^)\r\n{\r\n    return new (IntReader^)\r\n    {\r\n        var source = Read();\r\n\r\n        override func Dummy() : (::system::Void)\r\n        {\r\n            source.Dummy();\r\n        }\r\n    };\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                很明显，\n                if "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OBJECT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是一个原始指针，\n                然后创建的对象持有一个原始指针 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "OBJECT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                在这种情况下，你必须非常小心对象的生命周期。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
