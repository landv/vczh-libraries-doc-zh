  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "状态机",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            状态机的工作方式类似于协程，\n            但与协程不同，协程只具有 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",

            ]
          },
          {
            "kind": "Text",
            "text": "，\n            状态机可以有多个强类型输入。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            状态机是一个类。\n            必须从以下类继承 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "system::StateMachine"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            最后一个成员必须是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state_machine { ... }"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            状态机定义了多个带有参数的状态。\n            入口状态被称为 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "default"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$goto_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$push_state"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 可以用于在状态之间跳转。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            状态机定义了多个强类型输入。\n            状态机由输入驱动。\n            当一个 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$switch"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 状态已执行，\n            它等待选定的输入。\n            必须调用一个必需的输入方法以恢复状态机。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            让我们从一个例子开始：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\r\n\r\nusing system::*;\r\n\r\nclass MySM : StateMachine\r\n{\r\n    prop Output: string = \"\" {not observe}\r\n\r\n    func Append(text: string): void\r\n    {\r\n        Output = $\"$(Output)$(text); \";\r\n    }\r\n\r\n    $state_machine\r\n    {\r\n        $state_input A(name: string);\r\n        $state_input B(name: string);\r\n\r\n        $state WaitForName()\r\n        {\r\n            $switch ()\r\n            {\r\n            case A(name):\r\n                {\r\n                    Append($\"A($(name))\");\r\n                }\r\n            case B(name):\r\n                {\r\n                    Append($\"B($(name))\");\r\n                }\r\n            }\r\n        }\r\n\r\n        $state default()\r\n        {\r\n            Append(\"First line\");\r\n            $push_state WaitForName();\r\n            Append(\"Last line\");\r\n        }\r\n    }\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var sm = new MySM^();\r\n    try\r\n    {\r\n        sm.A(\"John\");\r\n        sm.B(\"Smith\");\r\n    }\r\n    catch (ex)\r\n    {\r\n        sm.Append(ex.Message);\r\n    }\r\n    return sm.Output;\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数返回 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "第一行；A(John)；最后一行；状态机已停止。；"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "List",
            "ordered": false,

                        "kind": "Text",
                        "text": "new MySM^()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被执行，\n                    状态机尚未启动。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",

                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "sm.A(\"John\");"
                      }
                    ]
                  },

                      {

                      }
                    ]

                  }
                ]
              },
              {
                "kind": "ContentListItem",

                  {

                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "default"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    它立即进入 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state default()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\"First line; \""
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 已打印。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$push_state WaitForName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被执行，\n                    它跳转到 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state WaitForName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    应该在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$switch"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    但因为 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "A"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 尚未被消耗，\n                    状态机继续并选择 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "case A(name):"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\"A(John)\""
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 已打印。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    现在 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state WaitForName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 完成。\n                    因为状态机通过此状态跳转， "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$push_state"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    所以它仍然需要返回 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "$state default"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\"Last line;\""
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 已打印。\n                "
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    状态机停止。\n                "
                  }
                ]
              },

                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "sm.B(\"Smith\");"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 被执行，\n                    因为状态机已停止，\n                    它会抛出一个异常。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state"
              }
            ]

            "kind": "Text",
            "text": " 定义状态。\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state_input"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 定义来自外部的输入。\n            与协程相比，状态机在数据交换方面具有更大的自由度。\n        "
          }
        ]
      }

  }
