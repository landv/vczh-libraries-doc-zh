  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "使用输入法",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            类似于任何函数，\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state_input"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 允许有零个、一个或多个参数。\n            但是因为它总是返回 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "void"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            因此，您无需指定返回值。\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            当 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$switch()"
              }
            ]
          },
          {
            "kind": "Text",

          },
          {
            "kind": "PageLink",

              {
                "kind": "Text",

          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            您不必在中保持相同的参数名称 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "case"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            例如：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\r\n\r\nusing system::*;\r\n\r\nclass MySM : StateMachine\r\n{\r\n    prop Output: string = \"\" {not observe}\r\n\r\n    $state_machine\r\n    {\r\n        $state_input A(name: string);\r\n        $state_input B(name: string);\r\n\r\n        $state default()\r\n        {\r\n            $switch ()\r\n            {\r\n            case A(foo):\r\n                {\r\n                    Output = $\"A($(foo))\";\r\n                }\r\n            case B(bar):\r\n                {\r\n                    Output = $\"B($(bar))\";\r\n                }\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var sm = new MySM^();\r\n    sm.A(\"John\");\r\n    return sm.Output;\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数返回 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "\"A(John)\""
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            尽管它定义了 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "A"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " using "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "$state_input A(name: string);"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "，\n            但你仍然可以使用 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "case A(foo):"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "name"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 在这里不可访问，\n            因为参数名称是 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "foo"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            您不必在所有中保持参数名称一致 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "case"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 语句：\n            "
          },
          {
            "kind": "Program",
            "code": "module sampleModule;\r\n\r\nusing system::*;\r\n\r\nclass MySM : StateMachine\r\n{\r\n    prop Output: string = \"\" {not observe}\r\n\r\n    $state_machine\r\n    {\r\n        $state_input A(name: string);\r\n        $state_input B(name: string);\r\n\r\n        $state default()\r\n        {\r\n            $switch ()\r\n            {\r\n            case A(foo):\r\n                {\r\n                    Output = $\"A($(foo))\";\r\n                }\r\n            case B(bar):\r\n                {\r\n                    Output = $\"B($(bar))\";\r\n                }\r\n            }\r\n            $switch ()\r\n            {\r\n            case A(cat):\r\n                {\r\n                    Output = $\"$(Output) A($(cat))\";\r\n                }\r\n            case B(dog):\r\n                {\r\n                    Output = $\"$(Output) B($(dog))\";\r\n                }\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var sm = new MySM^();\r\n    sm.A(\"John\");\r\n    sm.B(\"Smith\");\r\n    return sm.Output;\r\n}"
          },
          {
            "kind": "Text",
            "text": "\n            该 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "main"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 函数返回 "
          },
          {
            "kind": "Strong",
            "content": [
              {

              }
