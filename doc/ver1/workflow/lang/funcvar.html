  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "函数和变量",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            函数和变量可以在 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "modules"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "namespaces"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " 和 "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "classes"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "变量",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                变量可以是\n                "
              },
              {
                "kind": "Program",
                "code": "var a = \"Hello\";\r\nvar b: string = \"Hello\";"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                类型是可选的，当可以从初始化器推断出时。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                大多数表达式都支持类型推断，\n                但仍然有一些表达式没有显式类型。\n                类似于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                在这种情况下，你有两个选择，\n                一个是指定变量类型，\n                另一个是指定表达式类型：\n                "
              },
              {
                "kind": "Program",
                "code": "var a: MyClass = null;\r\nvar b = null of MyClass;"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                初始化器可以是任何表达式，\n                它不能被省略。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                多个变量不能在同一个作用域中共享相同的名称，\n                但变量可以隐藏父作用域中的其他变量。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "：\n                当一个变量是类成员时，\n                类型不能被省略。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "函数",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这是一个示例：\n                "
              },
              {
                "kind": "Program",
                "code": "func main(): string\r\n{\r\n    return \"Hello, world!\";\r\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此函数被调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "main"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                多个变量可以在同一个作用域中共享相同的名称，\n                这是重载。\n                当此类函数被调用时，\n                根据参数类型选择其中一个。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                返回类型和函数体不能省略。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                函数可以具有参数：\n                "
              },
              {
                "kind": "Program",
                "code": "func add(x: int, y: int): int\r\n{\r\n    return x + y;\r\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                调用此函数需要两个参数：\n                "
              },
              {
                "kind": "Program",
                "code": "add(1, 2);"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                任何参数都没有默认值。\n                建议使用函数重载来模拟参数的默认值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当函数的返回类型为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "void"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                any "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "return"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 此函数中的语句不允许包含表达式。\n                当返回类型不是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "void"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                any "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "return"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 此函数中的语句必须包含一个表达式。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                编译器不会检查函数的任何退出点是否缺少返回值。\n                如果一个函数没有返回值就退出，\n                它返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                如果返回类型与 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                编译期间不会产生错误。\n                这是未定义行为。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当此类代码被生成为 C++ 时，\n                C++ 编译器会提示这是错误的。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "重载解析",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                首先，\n                只有参数个数正确的函数才是有效的候选函数。\n                因为参数没有默认值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                其次，\n                函数参数用于从重载函数中选择一个。\n                但是并非所有参数都被使用，\n                因为它们中的一些没有显式类型：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        未解析的名称：\n                        一些对象，比如枚举项，\n                        不总是需要指定枚举类型。\n                        因为接受此表达式的上下文可能已经具有已知类型。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        带参数的有序 lambda 表达式：\n                        参数类型不允许用于顺序lambda表达式的参数中，\n                        因此，当它具有参数时，这种 lambda 表达式的类型就不明确了。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "null"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 它可以是任何引用类型。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "{ field:value ... }"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 它可以是任何结构类型。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "EXPR 作为 *"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ": 类型由接受此表达式的上下文推断。\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在所有具有显式类型的参数都被识别后，\n                每个有效候选都会通过计算需要类型转换的参数数量来检查。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在检查期间，\n                某些函数最终可能会被丢弃\n                因为参数类型不正确。\n                例如，传递 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 到一个 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "int"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 参数。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在缩减的候选列表中，\n                我们选择一个参数类型转换最少的。\n                如果有多于一个，\n                然后生成一个错误。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                例如：\n                "
              },
              {
                "kind": "Program",
                "code": "class Base {}\r\nclass Derived: Base{}\r\n\r\nfunc F(x: Base^): void {}\r\nfunc F(x: Derived^): void {}"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "F(new Derived^())"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将始终选择第二个。\n                因为第一个需要1次类型转换，\n                但第二个需要 0 类型转换。\n                后者胜出。\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};

  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
