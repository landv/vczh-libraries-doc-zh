            "content": [

                "kind": "Text",
                "text": "\n                括号可以改变类型的关联关系，\n                当存在歧义时，这很有用。\n                例如：\n                "
              },
              {
                "kind": "Program",

              },
              {
                "kind": "Text",
                "text": "\n                这是模糊的，\n                "

                ]

                "kind": "Text",

              },
              {
                "kind": "Program",
                "code": "var x: func():(string{}) = null;\r\nvar y: (func():string){} = null;"
              }
            ]

                        "content": [
                          {
                            "kind": "Text",
                            "text": "system::UInt64"

                        "text": ".\n                    "

                            "kind": "Text",

                      {
                        "kind": "Text",

                        "kind": "Text",

                  {

                          {

                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " or "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您可以查看如何 "
              },
              {
                "kind": "PageLink",
                "href": "/home/registered/vlppreflection.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "预定义类型"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 映射到 C++ 类型。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "类型转换",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "所有原始类型都可以隐式转换为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "string"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "string"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 可以显式转换为任何基本类型。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "float"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 可以隐式转换为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "double"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "有符号整数类型可以隐式转换为任何更大的有符号整数类型。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "无符号整数类型可以隐式转换为任何更大的无符号整数类型。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "8位和16位整数类型可以隐式转换为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "float"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "32位和64位整数类型可以隐式转换为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "double"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "所有数值类型都可以显式转换为彼此。"
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "枚举类型可以显式转换为 "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::UInt64"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::UInt64"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " 可以显式转换为枚举类型。"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "引用类型和指针",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                任意类类型、接口类型，或类型 \""
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "interface"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\"，都是引用类型。\n                可选类型不是引用类型。\n                引用类型本身不是一个有效类型，\n                指向引用类型的指针是有效类型。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "共享指针",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    类型 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "T^"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 表示 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Ptr<T>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " in C++.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    尽管 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "T"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 可以是 C++ 中的任何类型，\n                    但在工作流脚本中，\n                    指针只能指向引用类型。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "原始指针",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    类型 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "T*"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 表示 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "T*"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " in C++.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    尽管 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "T"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 可以是 C++ 中的任何类型，\n                    但在工作流脚本中，\n                    指针只能指向引用类型。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    您可以 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "delete"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 一个原始指针值，如在C++中。\n                    但是这可能导致抛出异常，\n                    当有共享指针持有此对象时。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "可选类型",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                类型 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "T?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 表示 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Nullable<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in C++.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                尽管 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "T"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以是 C++ 中的任何类型，\n                但在工作流脚本中，\n                可选类型只能指向基本类型、结构体和枚举。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "null"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 是可选类型的有效值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                任何有效类型的值都可以隐式转换为其可选类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                可选类型的值可以隐式转换为其包含类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                一种可选类型， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以隐式或显式转换为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "B?"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                when "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "A"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以隐式或显式转换为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "函数类型",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                A打包函数类型是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Ptr<IValueFunctionProxy>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                但它也可以解包为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Func<T>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                函数和成员都可以打包成函数类型：\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\r\n\r\nfunc A(): string\r\n{\r\n    return \"A\";\r\n}\r\n\r\nclass B\r\n{\r\n    func M(): string\r\n    {\r\n        return \"B\";\r\n    }\r\n}\r\n\r\ninterface IC\r\n{\r\n    func M(): string;\r\n}\r\n\r\nvar c = new IC^\r\n{\r\n    override func M(): string\r\n    {\r\n        return \"C\";\r\n    }\r\n}.M;\r\n\r\nfunc main(): string\r\n{\r\n    var fs /* : (func(): string){} */ = {\r\n        A;\r\n        new B^().M;\r\n        c;\r\n        [\"D\"];\r\n        func():string {return \"E\";};\r\n    };\r\n\r\n    var r = \"\";\r\n    for (f in fs)\r\n    {\r\n        r = r & f();\r\n    }\r\n    return r;\r\n}"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        函数 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "A"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 可以存储在函数类型的变量中。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        一个类方法可以存储在函数类型的变量中。\n                        我们分配 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "B"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 作为共享指针。\n                        即使我们已经失去了指向一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "B"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "，\n                        但是函数类型中还有另一个指针，\n                        引用计数被维护。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        接口方法也可以存储在函数类型的变量中。\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        有序的lambda表达式可以存储在函数类型的变量中，\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "\n                        Lambda 表达式可以存储在函数类型变量中。\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                函数允许具有参数。\n                作为函数类型。\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\r\n\r\nfunc main(): string\r\n{\r\n    var add: func(int, int):int = [$1 + $2];\r\n    var mul = func(x:int, y:int):int {return x * y;};\r\n    return mul(add(1, 2), add(3, 4));\r\n}"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                有序的lambda表达式没有显式类型，\n                因为参数的类型未指定，\n                因此接收它的位置必须具有显式类型。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Lambda 表达式具有显式类型，\n                所以变量的类型 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "mul"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 可以推断。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "集合类型",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                这里列出了所有支持的集合类型：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "TValue {}"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "这是一个只读集合，可以迭代，不支持随机访问。"
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "非泛型版本： "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::Enumerable^"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "可反射类型： "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::IValueEnumerable"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "TValue []"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "这是一个列表，支持随机访问。"
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "非泛型版本： "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::List^"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "可反射类型： "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::IValueList"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "const TValue []"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "这是一个只读列表，支持随机访问。"
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "非泛型版本： "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::ReadonlyList^"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "可反射类型： "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "system::IValueReadonlyList"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ParagraphListItem",
                    "paragraphs": [
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "观察 TValue []"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "这是一个可观察的列表，它支持随机访问，更改列表会触发事件。"
                          }
                        ]
                      },
                      {
                        "kind": "Paragraph",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "非泛型版本： "
