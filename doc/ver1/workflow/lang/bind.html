                    "kind": "Text",
                    "text": "C"
                  }

              },
              {
                "kind": "Text",

              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                但我们可以手动通过调用 "

                  {

              {
                "kind": "Text",
                "text": "\n                不，它返回 "

              {

                "content": [

      },
      {
        "kind": "Topic",
        "title": "注意属性链中的不可观测属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                拥有观察属性的对象将存储在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "bind"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                because "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "detach"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 需要被调用。\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\r\n\r\nclass ClassA\r\n{\r\n    prop B: ClassB^ = new ClassB^() {not observe}\r\n}\r\n\r\nclass ClassB\r\n{\r\n    prop C: ClassC^ = new ClassC^() {not observe}\r\n}\r\n\r\nclass ClassC\r\n{\r\n    prop X: int = 0 {}\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var a = new ClassA^();\r\n    var sub = bind(a.B.C.X);\r\n\r\n    var r = {\"\"};\r\n    attach(sub.ValueChanged, func(newValue: object): void\r\n    {\r\n        r[0] = $\"$(r[0])$(cast int newValue); \";\r\n    });\r\n    sub.Open();\r\n\r\n    var oldC = a.B.C;\r\n    {\r\n        a.B.C.X = 100;\r\n    }\r\n    {\r\n        var c = new ClassC^();\r\n        c.X = 200;\r\n        a.B.C = c;\r\n    }\r\n    {\r\n        var b = new ClassB^();\r\n        b.C.X = 300;\r\n        a.B = b;\r\n    }\r\n    oldC.X = 400;\r\n\r\n    sub.Close();\r\n    return r[0];\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                此函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\"100; 400; \""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不可观察，\n                因此，对它们赋值不会触发回调。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                但当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC.X = 400;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被调用，\n                回调以以下方式触发： "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "400"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                这显然不是实际的值 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 指定的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "bind"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被缓存。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不可观察，\n                所以当我们写 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "bind(a.B.C.X)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                实际上 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "让缓存对象 = a.B.C，在（绑定（缓存对象.X））中"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 变得可观察但 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 仍然不是。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 将在更新时 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改。\n                If "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在更改时不会被调用， "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被重新分配，\n                对观察表达式的求值仍然使用旧的 previous "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 值。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                在之前的示例中，\n                删除 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "未观察"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "属性 B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                并在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "sub.Open()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "sub.Close"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 像这样：\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\r\n\r\nclass ClassA\r\n{\r\n    prop B: ClassB^ = new ClassB^() {}\r\n}\r\n\r\nclass ClassB\r\n{\r\n    prop C: ClassC^ = new ClassC^() {not observe}\r\n}\r\n\r\nclass ClassC\r\n{\r\n    prop X: int = 0 {}\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var a = new ClassA^();\r\n    var sub = bind(a.B.C.X);\r\n\r\n    var r = {\"\"};\r\n    attach(sub.ValueChanged, func(newValue: object): void\r\n    {\r\n        r[0] = $\"$(r[0])$(cast int newValue); \";\r\n    });\r\n    sub.Open();\r\n\r\n    {\r\n        var b = new ClassB^();\r\n        b.C.X = 100;\r\n        a.B = b;\r\n    }\r\n    {\r\n        a.B.C.X = 200;\r\n    }\r\n    var oldC = a.B.C;\r\n    {\r\n        var c = new ClassC^();\r\n        c.X = 300;\r\n        a.B.C = c;\r\n    }\r\n    oldC.X = 400;\r\n\r\n    sub.Close();\r\n    return r[0];\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                此函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\"100; 200; 400; \""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                更改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不触发事件，\n                因为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不可观察。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                更改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 触发事件，\n                因为之前 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在订阅中缓存\n                即使在 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改。\n                因此它实际上不会求值 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B.C.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                相反，它会评估 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC.X"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                但若我们更改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.B"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 再次，\n                缓存的 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClassC^"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 对象将被刷新，\n                并且它不是 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "oldC"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不再。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "A ? B : C",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "module sampleModule;\r\n\r\nclass Cond\r\n{\r\n    prop Value: bool = false {}\r\n}\r\n\r\nclass Int\r\n{\r\n    prop Value: int = 0 {}\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var c = new Cond^();\r\n    var a = new Int^();\r\n    var b = new Int^();\r\n    var sub = bind(c.Value ? a.Value : b.Value);\r\n\r\n    var r = {\"\"};\r\n    attach(sub.ValueChanged, func(newValue: object): void\r\n    {\r\n        r[0] = $\"$(r[0])$(cast int newValue); \";\r\n    });\r\n    sub.Open();\r\n\r\n    c.Value = true;\r\n    a.Value = 100;\r\n    b.Value = 200;\r\n    c.Value = false;\r\n    a.Value = 300;\r\n    b.Value = 400;\r\n\r\n    sub.Close();\r\n    return r[0];\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                此函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\"0; 100; 100; 200; 200; 400; \""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                即使 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在 if 表达式的不同分支中，\n                它们的事件都已附加。\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b.Value"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被更改，\n                即使它不参与评估，\n                它仍然会触发回调。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                如果条件表达式的分支中有属性链，\n                所有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "attach"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "detach"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 当上游属性被更改时会发生什么，\n                缓存拥有可观察属性的对象时进行评估，\n                相关属性的获取器将被调用，\n                无论条件表达式的求值结果如何。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                让我们看一个更复杂的例子：\n                "
              },
              {
                "kind": "Program",
                "code": "module sampleModule;\r\n\r\nclass Cond\r\n{\r\n    prop Value: bool = false {}\r\n}\r\n\r\nclass Holder\r\n{\r\n    prop Value: Int^ = new Int^() {}\r\n}\r\n\r\nclass Int\r\n{\r\n    prop Value: int = 0 {}\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var c = new Cond^();\r\n    var a = new Holder^();\r\n    var b = new Holder^();\r\n    var sub = bind((c.Value ? a.Value : b.Value).Value);\r\n\r\n    var r = {\"\"};\r\n    attach(sub.ValueChanged, func(newValue: object): void\r\n    {\r\n        r[0] = $\"$(r[0])$(cast int newValue); \";\r\n    });\r\n    sub.Open();\r\n\r\n    c.Value = true;\r\n    a.Value.Value = 100;\r\n    b.Value.Value = 200;\r\n    c.Value = false;\r\n    a.Value.Value = 300;\r\n    b.Value.Value = 400;\r\n\r\n    sub.Close();\r\n    return r[0];\r\n}"
              },
              {
                "kind": "Text",
                "text": "\n                此函数返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\"0; 100; 200; 400; \""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "c.Value = true;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被执行，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "0;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已打印。\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "(c.Value ? a.Value : b.Value)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 变成 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                so "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value.ValueChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已附加，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b.Value.ValueChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已分离。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "a.Value.Value = 100;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被执行，\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "100;"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 已打印，显然。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "b.Value.Value = 200;"
                  }
                ]
              },
              {
                "kind": "Text",
