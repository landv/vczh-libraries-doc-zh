  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "属性和事件（接口）",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            属性和事件允许在接口中使用。\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "定义属性和事件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当属性 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 与事件相关联 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NameChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                魔法不会自动发生，\n                实现 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 应触发 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NameChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 适当。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                该属性也可能是只读的，或者不与事件关联。\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "功能齐全的自动属性",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    prop Name: string {}\r\n}"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    这意味着：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    event NameChanged();\r\n    func GetName(): string;\r\n    func SetName(value: string): void;\r\n    prop Name: string {GetName, SetName : NameChanged}\r\n}"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "只读自动属性",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    prop Name: string {const}\r\n}"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    这意味着：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    event NameChanged();\r\n    func GetName(): string;\r\n    prop Name: string {GetName : NameChanged}\r\n}"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "无事件的自动属性",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    prop Name: string {not observe}\r\n}"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    这意味着：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    func GetName(): string;\r\n    func SetName(value: string): void;\r\n    prop Name: string {GetName, SetName}\r\n}"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "只读自动属性，无事件",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    prop Name: string {const, not observe}\r\n}"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    这意味着：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "interface IWithProp\r\n{\r\n    func GetName(): string;\r\n    prop Name: string {GetName}\r\n}"
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "实现属性",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                新的接口表达式中也允许使用自动属性\n                创建属性的默认实现：\n                "
              },
              {
                "kind": "Program",
                "code": "var withProp = new IWithProp^\r\n{\r\n    override prop Name: string = \"an-initialized-value\" {}\r\n};"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "该 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "override"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " keyword 是必需的。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "新的接口表达式中的自动属性必须被初始化。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "接口中的属性是否为自动属性无关紧要。"
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                它几乎等同于：\n                "
              },
              {
                "kind": "Program",
                "code": "var withProp = new IWithProp^\r\n{\r\n    var name: string = \"an-initialized-value\";\r\n\r\n    override func GetName(): string\r\n    {\r\n        return name;\r\n    }\r\n\r\n    override func SetName(value: string): void\r\n    {\r\n        if (name != value)\r\n        {\r\n            name = value;\r\n            NameChanged();\r\n        }\r\n    }\r\n};"
              },
              {
                "kind": "Text",
                "text": "\n                但 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "name"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 变量不可访问。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                您不需要 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "override"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 接口中的一种事件。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当在新的接口表达式中使用自动属性时，\n                配置 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "const"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 和 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "未观察"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 必须完全相同\n                到在接口中被重写的属性，\n                语义上（因为可以使用普通属性声明，而不需要使用自动属性）。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                即使你使用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "const"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 用于新接口表达式中的自动属性，\n                该 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 函数始终存在。\n                在这种情况下，\n                更改属性值的唯一方法是调用 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetName"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "使用事件",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                事件不必与属性关联。\n                您可以在接口中定义事件，并在新的接口表达式中触发它们。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                事件允许带有参数，\n                但就像函数类型一样，\n                参数没有名称。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "module sampleModule;\r\n\r\ninterface IWithEvent\r\n{\r\n    event SomethingHappened(string);\r\n    func MakeItHappen(something: string): void;\r\n}\r\n\r\nfunc main(): string\r\n{\r\n    var withEvent = new IWithEvent^\r\n    {\r\n        override func MakeItHappen(something: string): void\r\n        {\r\n            SomethingHappened(something);\r\n        }\r\n    };\r\n\r\n    var r = {\"\"};\r\n    var handler = attach(\r\n        withEvent.SomethingHappened,\r\n        func (something:string): void\r\n        {\r\n            r[0] = r[0] & $\"$(something); \";\r\n        }\r\n    );\r\n\r\n    withEvent.MakeItHappen(\"Good\");\r\n    withEvent.MakeItHappen(\"Cool\");\r\n    withEvent.SomethingHappened(\"Wonderful\");\r\n\r\n    detach(withEvent.SomethingHappened, handler);\r\n    return r[0];\r\n}"
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "触发事件就像调用一个函数。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "事件可以在任何地方触发，而不仅限于新的界面表达式中。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "访问事件的唯一方法是触发它，您不允许复制事件对象。"
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "attach"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 用于订阅一个事件，其值为与事件兼容的函数类型（参数类型和返回类型完全相同） "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "void"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ")."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "从 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "attach"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 用于取消订阅事件 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "detach"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "detach"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " 表达式返回一个 "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "bool"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " value，当此事件处理程序不是此事件的订阅，或此事件处理程序已被取消订阅时，返回 null。"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "：\n                变量在有序lambda表达式、lambda表达式和新接口表达式中按值捕获。\n                这就是我们定义的原因。 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "r"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " as "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "string []"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                Because "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "r"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 不允许在事件回调中更改，\n                但我们可以更改 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "r"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                函数 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "main"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 返回 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "好；酷；太棒了；"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
