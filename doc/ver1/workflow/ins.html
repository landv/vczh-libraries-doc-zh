                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    从栈中弹出一个值。\n                    如果它是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，跳转到指定的指令。\n                    如果它是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，继续执行下一个指令。\n                    如果它不是布尔值，将抛出异常。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Invoke(索引, 数量)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> stack frame 2 (top)\r\narg-n\r\n...\r\narg-1\r\n... others"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> stack frame 1 (top)\r\n... local variables\r\narg-n\r\n...\r\narg-1\r\n--> stack frame 2 (top)\r\n... others"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    跳转到指定函数，以指定数量的栈值作为参数。\n                    参数被传递到新的栈帧中，\n                    因此，函数结束后，\n                    他们都走了。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InvokeWithContext(索引, 数量)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    类似于 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Invoke(索引, 数量)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "，\n                    但目标函数共享当前函数捕获的值。\n                    当同一接口实现的方法互相调用时，会发生这种情况，\n                    因为所有这些方法共享相同的捕获值。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InstallTry(index)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    向堆栈推送一个带有入口指令的新陷阱帧， "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "catch"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 处理程序。\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "UninstallTry(count)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 必须与 pairing 一起调用 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InstallTry(index)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "UninstallTry(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    弹出一个新的陷阱框架。\n                    保留指定数量的栈值在该陷阱帧之后。\n                    当在计算逻辑与运算符（&&）的左操作数时没有发生异常时，会发生这种情况 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "??"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " operator,\n                    左操作数的值成为整个表达式的值，\n                    应保留在堆栈中。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "RaiseException",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    抛出一个异常。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    当发生异常时，\n                    所有在顶部陷阱帧之后压入的堆栈帧和堆栈值都将被移除，\n                    并跳转到最顶层陷阱框架的指定指令。\n                    如果没有陷阱帧，\n                    脚本以这个异常结束。\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "对象创建操作",
        "content": [
          {
            "kind": "Topic",
            "title": "CreateArray(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\nitem-1\r\n...\r\nitem-n"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(Ptr<IValueList>) value of created array"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    从栈中弹出指定数量的值，\n                    按弹出顺序推送包含这些值的已创建数组。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateObservableList(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\nitem-1\r\n...\r\nitem-n"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(Ptr<IValueObservableList>) value of created observable list"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    从栈中弹出指定数量的值，\n                    将创建的可观察列表按弹出顺序推送。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateMap(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\nvalue-1\r\nkey-1\r\n...\r\nvalue-n\r\nkey-n"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(Ptr<IValueDictionary>) value of created map"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    从栈中弹出指定数量的值-键对，\n                    推送已创建的可观察映射。\n                    一对值是栈上的两个值，而不是一个对对象。\n                    映射中键的顺序取决于键的值。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateClosureContext(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\nitem-n\r\n...\r\nitem-1"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(Ptr<WfRuntimeVariableContext>) value of created closure context"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    从栈中弹出指定数量的值，\n                    将创建的闭包上下文按反向弹出顺序压入。\n                    如果没有要存储的值，创建的上下文将是 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateClosure",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(int) function\r\n(Ptr<WfRuntimeVariableContext>) closure context"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(Ptr<IValueFunctionProxy>) value of created closure"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    弹出全局函数的索引和一个闭包上下文，\n                    将创建的闭包推入栈中。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateInterface(方法, 数量)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(int) function-1\r\n(IMethodInfo*) method-1\r\n...\r\nfunction-n\r\nmethod-n\r\n(Ptr<WfRuntimeVariableContext>) closure context"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\nvalue of created interface"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    从栈中弹出指定数量的函数-方法对。\n                    将创建的接口推送到堆栈。\n                    一对值是栈上的两个值，而不是一个对对象。\n                    声明由哪个全局函数实现的方法。\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    该 "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "methodParamter"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 该指令的构造函数是接口的构造函数。\n                    这样的接口必须使用以下之一进行注册： "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BEGIN_INTERFACE_PROXY_*"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 宏。\n                    请检出 "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/vlppreflection/ref/VL__REFLECTION__DESCRIPTION.html",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "类 描述"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " 用于获取更多详情。\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateRange",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\nvalue of ending\r\nvalue of beginning"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(Ptr<IValueEnumerable>) value of created range"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    按顺序弹出结束值和开始值，\n                    推送创建的范围，\n                    这是一个可枚举的集合，\n                    包括起始值但不包括结束值。\n                    此集合中的每个值都比前一个值大一。\n                "
                  }
                ]
              }
            ]
          },

            "kind": "Topic",
            "title": "CreateStruct(标志, 类型)",

                "content": [

              }
            ]

            "kind": "Topic",
            "title": "DeleteRawPtr",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "

                "kind": "Paragraph",
                "content": [

                "kind": "Paragraph",

                        "kind": "Text",
                        "text": "Value::DeleteRawPtr"

                  }
                ]
              }
            ]
          }
        ]
      },
      {

        "title": "类型操作",

                  {

                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "

                  {

                    "kind": "Text",

          {
            "kind": "Topic",
            "title": "GetType",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之前的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\nvalue to test"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    之后的栈模式：\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\r\n(ITypeDescriptor*) type of the value"
