      {

          {
            "kind": "Text",

        "kind": "Topic",
        "title": "@cpp:File(\"YourFile\")",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此属性适用于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",

              {
                "kind": "Text",
                "text": ".\n                它创建一对新文件 "
              },

                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "YourFile.h"

              {
                "kind": "Text",
                "text": " 和 "

              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",

              {
                "kind": "Text",

          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                由于工作流中的内部类会被转换为C++中的内部类，\n                如果您在定义 B 时为类 A 和 B 分配了不同的文件名，而 B 定义在 A 内部，\n                它会导致一个错误。\n            "

            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当类具有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@cpp:UserImpl"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "@cpp:UserImpl",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此属性适用于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "构造函数、析构函数和函数"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在类中。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                函数体包含 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@cpp:UserImpl"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 被忽略，\n                它们在生成的文件中留为空白。\n                允许用户添加自定义代码行\n                在……之间：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/* USER_CONTENT_BEGIN(CLASS-NAME) */"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/* USER_CONTENT_END() */"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个类包含具有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@cpp:UserImpl"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                可以在为此类生成的头文件中添加自定义成员\n                在……之间：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/* USER_CONTENT_BEGIN(custom members of CLASS-NAME) */"

                    ]

                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "/* USER_CONTENT_END() */"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当文件包含具有 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@cpp:UserImpl"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                可以在为此类生成的头文件中添加自定义全局声明\n                在……之间：\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",

                    "kind": "ContentListItem",

                      {
                        "kind": "Strong",

                          {
                            "kind": "Text",
                            "text": "/* USER_CONTENT_END() */"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当工作流脚本被修改并重新生成时，\n                新生成的代码和特定位置的自定义代码行将被合并在一起，\n                这样你的工作就不会丢失。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IMPORTANT"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "：\n                如果有花括号（"
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "{"

                ]

                "kind": "Text",
                "text": " 和 "

                "kind": "Strong",
                "content": [

                    "kind": "Text",
                    "text": "}"
                  }
                ]

              {

              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "@cpp:Protected 和 @cpp:Private",

                "text": "\n                这些属性适用于 "

                "content": [

                    "kind": "Text",
                    "text": "任何成员"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 在类中，除了非自动属性。\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                当一个类成员被标注为 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@cpp:Protected"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "，\n                此部分 C++ 代码将由 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "protected:"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                So as "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "@cpp:Private"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "NOTE"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ": 这些属性不会影响工作流编译器，\n                Workflow 脚本将所有成员视为公共成员。\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "@cpp:Friend(typeof(YourType))",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                此属性适用于 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "classes"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                它生成 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "friend"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " C++代码中的声明，\n                允许 "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "YourType"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " 访问当前类的受保护或私有成员。 \n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "示例",
        "content": [
          {
            "kind": "Topic",

                "kind": "Paragraph",

                    "kind": "Program",
                    "code": "module SampleModule;\r\n\r\nclass DummyClass\r\n{\r\n    func CallPrivateMethod(my: MyClass^): void\r\n    {\r\n        my.Method();\r\n    }\r\n}\r\n\r\n@cpp:File(\"MyClass\")\r\n@cpp:Friend(typeof(DummyClass))\r\nclass MyClass\r\n{\r\n    @cpp:UserImpl\r\n    @cpp:Private\r\n    func Method(): void\r\n    {\r\n        raise \"Not Implemented!\";\r\n    }\r\n}"
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",

              {
                "kind": "Paragraph",

                  {
                    "kind": "Strong",
                    "content": [

                        "kind": "Text",

                              {
                                "kind": "Text",
                                "text": "SampleModule"

                            "kind": "Text",

                          },

                            "kind": "PageLink",
                            "href": "/workflow/running/generating.html",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "生成 C++ 代码"

                          },

                            "kind": "Text",

                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [

                        "kind": "Text",
                        "text": "SampleModule.h"
                      }
                    ]
                  },
                  {
                    "kind": "Program",
                    "code": "class DummyClass;\r\nclass MyClass;\r\n\r\nclass DummyClass : public ::vl::Object, public ::vl::reflection::Description<DummyClass>\r\n{\r\n#ifndef VCZH_DEBUG_NO_REFLECTION\r\n    friend struct ::vl::reflection::description::CustomTypeDescriptorSelector<DummyClass>;\r\n#endif\r\npublic:\r\n    void CallPrivateMethod(::vl::Ptr<::MyClass> my);\r\n    DummyClass();\r\n};\r\n\r\n/***********************************************************************\r\nGlobal Variables and Functions\r\n***********************************************************************/\r\n\r\nnamespace vl_workflow_global\r\n{\r\n    class W05Script\r\n    {\r\n    public:\r\n\r\n        static W05Script& Instance();\r\n    };\r\n}"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SampleModule.cpp"
                      }
                    ]
                  },
                  {
                    "kind": "Program",
                    "code": "#define GLOBAL_SYMBOL ::vl_workflow_global::W05Script::\r\n#define GLOBAL_NAME ::vl_workflow_global::W05Script::Instance().\r\n#define GLOBAL_OBJ &::vl_workflow_global::W05Script::Instance()\r\n\r\n/***********************************************************************\r\nGlobal Variables\r\n***********************************************************************/\r\n\r\nBEGIN_GLOBAL_STORAGE_CLASS(vl_workflow_global_W05Script)\r\n    vl_workflow_global::W05Script instance;\r\n    INITIALIZE_GLOBAL_STORAGE_CLASS\r\n    FINALIZE_GLOBAL_STORAGE_CLASS\r\nEND_GLOBAL_STORAGE_CLASS(vl_workflow_global_W05Script)\r\n\r\nnamespace vl_workflow_global\r\n{\r\n/***********************************************************************\r\nGlobal Functions\r\n***********************************************************************/\r\n\r\n    W05Script& W05Script::Instance()\r\n    {\r\n        return Getvl_workflow_global_W05Script().instance;\r\n    }\r\n}\r\n\r\n/***********************************************************************\r\nClass (::DummyClass)\r\n***********************************************************************/\r\n\r\nvoid DummyClass::CallPrivateMethod(::vl::Ptr<::MyClass> my)\r\n{\r\n    ::vl::__vwsn::This(my.Obj())->Method();\r\n}\r\n\r\nDummyClass::DummyClass()\r\n{\r\n}\r\n\r\n#undef GLOBAL_SYMBOL\r\n#undef GLOBAL_NAME\r\n#undef GLOBAL_OBJ"
                  }
                ]
              },

                "kind": "Paragraph",

                  },

                    "kind": "Program",

                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",

                  }
                ]
              }
